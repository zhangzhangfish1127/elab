<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由落体 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>自由落体</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>项目</th><th>关系</th></tr></thead>
    <tbody>
      <tr class="active"><td>速度</td><td>v = g·t</td></tr>
      <tr class="active"><td>下落高度</td><td>h = ½g·t²</td></tr>
      <tr class="active"><td>机械能</td><td>Ep + Ek 保持不变</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>初始高度 h₀ = <span id="h0Val">20.0</span> m
    <input type="range" id="h0Range" min="5" max="45" value="20" step="0.5">
  </label>
  <label>重力加速度 g = <span id="gVal">9.8</span> m/s²
    <input type="range" id="gRange" min="1.6" max="15" value="9.8" step="0.1">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">点播放看小球下落，能量条实时变化</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var h0 = 20, g = 9.8;
  var t = 0, playing = false, rafId = null;
  var m = 1;   // 质量 1kg（求能量）

  function getState() {
    var tf = Math.sqrt(2 * h0 / g);  // 落地时间
    var tt = Math.min(t, tf);
    var h = h0 - 0.5 * g * tt * tt;
    var v = g * tt;
    var Ep = m * g * Math.max(0, h);
    var Ek = 0.5 * m * v * v;
    return { h: Math.max(0, h), v: v, Ep: Ep, Ek: Ek, total: m * g * h0, tf: tf, done: t >= tf };
  }

  function draw() {
    var ctx = opt.ctx;
    var W = opt.W, H = opt.H;
    opt.clear();
    var s = getState();

    // 左侧：下落轨道
    var leftX = W * 0.28;
    var topY = 60, botY = H - 60;
    var trackH = botY - topY;

    // 竖线
    ctx.save();
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(leftX, topY);
    ctx.lineTo(leftX, botY);
    ctx.stroke();
    ctx.restore();

    // 高度刻度
    ctx.save();
    ctx.fillStyle = '#666';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var hh = 0; hh <= h0; hh += 5) {
      var y = botY - (hh / h0) * trackH;
      ctx.fillText(hh + 'm', leftX - 12, y);
      ctx.strokeStyle = '#e8ecef';
      ctx.beginPath();
      ctx.moveTo(leftX - 6, y);
      ctx.lineTo(leftX + 6, y);
      ctx.stroke();
    }
    ctx.restore();

    // 小球位置
    var ballY = botY - (s.h / h0) * trackH;
    ctx.save();
    var grad = ctx.createRadialGradient(leftX - 4, ballY - 4, 2, leftX, ballY, 14);
    grad.addColorStop(0, '#f39c12');
    grad.addColorStop(1, '#c0392b');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(leftX, ballY, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 速度箭头
    if (s.v > 0.1) {
      ctx.save();
      ctx.strokeStyle = '#27ae60';
      ctx.lineWidth = 3;
      var arrowLen = Math.min(60, s.v * 3);
      ctx.beginPath();
      ctx.moveTo(leftX + 20, ballY);
      ctx.lineTo(leftX + 20, ballY - arrowLen);
      ctx.stroke();
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.moveTo(leftX + 20, ballY - arrowLen);
      ctx.lineTo(leftX + 15, ballY - arrowLen + 10);
      ctx.lineTo(leftX + 25, ballY - arrowLen + 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#27ae60';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('v=' + s.v.toFixed(1) + ' m/s', leftX + 28, ballY - arrowLen / 2);
      ctx.restore();
    }

    // 右侧：能量条
    var rx = W * 0.62;
    var barW = 60;
    var barH = H - 140;
    var barTop = 80;

    // 底框
    ctx.save();
    ctx.fillStyle = '#fafbfc';
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.fillRect(rx - 10, barTop - 20, barW * 2 + 40, barH + 50);
    ctx.strokeRect(rx - 10, barTop - 20, barW * 2 + 40, barH + 50);
    ctx.restore();

    // Ep 条（蓝）
    var EpFrac = s.Ep / s.total;
    var EkFrac = s.Ek / s.total;
    ctx.save();
    ctx.fillStyle = '#3498db';
    ctx.fillRect(rx, barTop + barH * (1 - EpFrac), barW, barH * EpFrac);
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 2;
    ctx.strokeRect(rx, barTop + barH * (1 - EpFrac), barW, barH * EpFrac);
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('重力势能', rx + barW / 2, barTop - 4);
    ctx.fillText('Ep', rx + barW / 2, barTop + barH + 18);
    ctx.fillStyle = '#2980b9';
    ctx.fillText(s.Ep.toFixed(1) + ' J', rx + barW / 2, barTop + barH + 34);
    ctx.restore();

    // Ek 条（橙）
    ctx.save();
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(rx + barW + 20, barTop + barH * (1 - EkFrac), barW, barH * EkFrac);
    ctx.strokeStyle = '#d35400';
    ctx.lineWidth = 2;
    ctx.strokeRect(rx + barW + 20, barTop + barH * (1 - EkFrac), barW, barH * EkFrac);
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('动能', rx + barW + 20 + barW / 2, barTop - 4);
    ctx.fillText('Ek', rx + barW + 20 + barW / 2, barTop + barH + 18);
    ctx.fillStyle = '#d35400';
    ctx.fillText(s.Ek.toFixed(1) + ' J', rx + barW + 20 + barW / 2, barTop + barH + 34);
    ctx.restore();

    // 总能量
    ctx.save();
    ctx.fillStyle = '#27ae60';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('总机械能 = ' + s.total.toFixed(1) + ' J', W / 2, H - 20);
    ctx.restore();

    // 侧栏读数
    document.getElementById('h0Val').textContent = h0.toFixed(1);
    document.getElementById('gVal').textContent = g.toFixed(1);
    document.getElementById('h0Range').value = h0;
    document.getElementById('gRange').value = g;

    document.getElementById('readout').innerHTML =
      '下落时间 t = <b>' + Math.min(t, s.tf).toFixed(2) + '</b> s<br>' +
      '当前高度 h = <b>' + s.h.toFixed(2) + '</b> m<br>' +
      '当前速度 v = <b>' + s.v.toFixed(2) + '</b> m/s<br>' +
      'Ep = <b>' + s.Ep.toFixed(2) + '</b> J　Ek = <b>' + s.Ek.toFixed(2) + '</b> J<br>' +
      (s.done ? '<b style="color:#e67e22">已落地</b>' : '<span style="color:#27ae60">下落中…</span>');
  }

  document.getElementById('h0Range').addEventListener('input', function(e){ h0 = parseFloat(e.target.value); t = 0; stopPlay(); draw(); });
  document.getElementById('gRange').addEventListener('input', function(e){ g = parseFloat(e.target.value); t = 0; stopPlay(); draw(); });
  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    t = 0; stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value);
    t += 0.02 * spd;
    draw();
    var tf = Math.sqrt(2 * h0 / g);
    if (t > tf + 0.3) { stopPlay(); return; }
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      var tf = Math.sqrt(2 * h0 / g);
      if (t >= tf) t = 0;
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
