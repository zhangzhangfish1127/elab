<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连通器 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>连通器</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>规律</th><th>现象</th></tr></thead>
    <tbody>
      <tr class="active"><td>静止时</td><td>各容器液面总是相平</td></tr>
      <tr class="active"><td>原理</td><td>同种液体，底部压强相等</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>液面高度 h = <span id="hVal">5.0</span> 格
    <input type="range" id="hRange" min="0" max="10" value="5" step="0.1">
  </label>
  
  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">无论左边怎么倾斜，静止时两边液面总是相平</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var h = 5.0;

  function draw() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    opt.clear();

    var cx = W / 2;
    var baseY = H * 0.8;
    var gridSize = 30; // 每格像素
    var tubeW = 80;

    // 底部连通管
    var botTubeH = 60;
    
    // 左侧管（稍微歪一点显示效果）
    var leftX = cx - 150;
    // 右侧管
    var rightX = cx + 150;

    // 画玻璃容器（简化为管状）
    ctx.save();
    ctx.strokeStyle = '#bdc3c7';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    
    // 左管
    ctx.beginPath();
    ctx.moveTo(leftX - tubeW/2, baseY - h * gridSize - 50);
    ctx.lineTo(leftX - tubeW/2, baseY);
    ctx.lineTo(leftX + tubeW/2, baseY);
    ctx.lineTo(leftX + tubeW/2, baseY - h * gridSize - 50);
    ctx.stroke();

    // 右管
    ctx.beginPath();
    ctx.moveTo(rightX - tubeW/2, baseY - h * gridSize - 50);
    ctx.lineTo(rightX - tubeW/2, baseY);
    ctx.lineTo(rightX + tubeW/2, baseY);
    ctx.lineTo(rightX + tubeW/2, baseY - h * gridSize - 50);
    ctx.stroke();

    // 底部连通
    ctx.beginPath();
    ctx.moveTo(leftX, baseY);
    ctx.lineTo(rightX, baseY);
    ctx.stroke();
    ctx.restore();

    // 画液体
    var liquidColor = 'rgba(52, 152, 219, 0.6)';
    var liquidTopY = baseY - h * gridSize;

    ctx.save();
    ctx.fillStyle = liquidColor;
    
    // 左液体
    ctx.fillRect(leftX - tubeW/2 + 2, liquidTopY, tubeW - 4, h * gridSize);
    // 右液体
    ctx.fillRect(rightX - tubeW/2 + 2, liquidTopY, tubeW - 4, h * gridSize);
    // 底部液体
    ctx.fillRect(leftX - tubeW/2 + 2, baseY - 30, (rightX - leftX) + tubeW - 4, 30);
    ctx.restore();

    // 画水平虚线和刻度
    ctx.save();
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(leftX - tubeW, liquidTopY);
    ctx.lineTo(rightX + tubeW, liquidTopY);
    ctx.stroke();
    ctx.restore();

    // 画网格线帮助观察
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    for(var i=0; i<=10; i++) {
      var gy = baseY - i * gridSize;
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    }
    ctx.restore();

    document.getElementById('hVal').textContent = h.toFixed(1);
    document.getElementById('hRange').value = h;

    document.getElementById('readout').innerHTML =
      '当前液面高度 h = <b>' + h.toFixed(1) + '</b> 格<br>' +
      '两边液面高度<b>完全相同</b>。<br>' +
      '<span style="font-size:12px;color:#888">连通器原理：装同种液体且静止时，各容器中的液面总是相平的。</span>';
  }

  document.getElementById('hRange').addEventListener('input', function(e) {
    h = parseFloat(e.target.value);
    draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
