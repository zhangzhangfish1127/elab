<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摩擦力 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>摩擦力</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>受力特点</th></tr></thead>
    <tbody>
      <tr data-case="static"><td>静止</td><td>f = F拉</td></tr>
      <tr data-case="sliding"><td>滑动</td><td>f = μN (恒定)</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>拉力 F = <span id="fVal">0.0</span> N
    <input type="range" id="fRange" min="0" max="20" value="0" step="0.5">
  </label>
  <label>重力 G = <span id="gVal">10.0</span> N
    <input type="range" id="gRange" min="5" max="20" value="10" step="0.5">
  </label>
  
  <div class="row">
    <label style="margin:0;white-space:nowrap">接触面粗糙度 μ</label>
    <select id="surfaceSel">
      <option value="0.2">光滑木板 (0.2)</option>
      <option value="0.4" selected>粗糙木板 (0.4)</option>
      <option value="0.6">毛巾 (0.6)</option>
    </select>
  </div>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">慢慢增大拉力，观察物体何时开始运动</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var F = 0, G = 10, mu = 0.4;
  var x = 100, v = 0;

  function update() {
    var fMax = mu * G;
    if (F > fMax + 0.01) {
      var a = (F - fMax) / (G / 9.8);
      v += a * 0.02;
    } else {
      v = 0;
    }
    x += v * 20;
    if (x > opt.W - 100) x = 100;
    draw();
  }

  function draw() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    opt.clear();

    var fMax = mu * G;
    var f = (F <= fMax && v === 0) ? F : fMax;
    var state = (v > 0) ? 'sliding' : 'static';

    var groundY = H * 0.7;
    var boxW = 80, boxH = 60;
    var boxY = groundY - boxH;

    // 地面
    ctx.save();
    ctx.fillStyle = mu > 0.5 ? '#d2b48c' : '#a0522d';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.restore();

    // 物体
    ctx.save();
    ctx.fillStyle = '#3498db';
    ctx.fillRect(x - boxW/2, boxY, boxW, boxH);
    ctx.strokeStyle = '#2980b9'; ctx.lineWidth = 2;
    ctx.strokeRect(x - boxW/2, boxY, boxW, boxH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('M', x, boxY + boxH/2);
    ctx.restore();

    // 画力
    var as = 4;
    // 重力
    ctx.save(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, boxY + boxH/2); ctx.lineTo(x, boxY + boxH/2 + G*as); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.beginPath();
    ctx.moveTo(x, boxY + boxH/2 + G*as); ctx.lineTo(x-6, boxY + boxH/2 + G*as - 10); ctx.lineTo(x+6, boxY + boxH/2 + G*as - 10); ctx.fill();
    ctx.fillText('G', x + 15, boxY + boxH/2 + G*as - 5); ctx.restore();

    // 支持力
    ctx.save(); ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, boxY + boxH/2); ctx.lineTo(x, boxY + boxH/2 - G*as); ctx.stroke();
    ctx.fillStyle = '#27ae60'; ctx.beginPath();
    ctx.moveTo(x, boxY + boxH/2 - G*as); ctx.lineTo(x-6, boxY + boxH/2 - G*as + 10); ctx.lineTo(x+6, boxY + boxH/2 - G*as + 10); ctx.fill();
    ctx.fillText('N', x + 15, boxY + boxH/2 - G*as + 5); ctx.restore();

    // 拉力 F
    if (F > 0) {
      ctx.save(); ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - boxW/2, boxY + boxH/2); ctx.lineTo(x - boxW/2 - F*as, boxY + boxH/2); ctx.stroke();
      ctx.fillStyle = '#f39c12'; ctx.beginPath();
      var fx = x - boxW/2 - F*as;
      ctx.moveTo(fx, boxY + boxH/2); ctx.lineTo(fx+10, boxY + boxH/2 - 6); ctx.lineTo(fx+10, boxY + boxH/2 + 6); ctx.fill();
      ctx.fillText('F', fx - 15, boxY + boxH/2); ctx.restore();
    }

    // 摩擦力 f
    if (f > 0) {
      ctx.save(); ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + boxW/2, boxY + boxH); ctx.lineTo(x + boxW/2 + f*as, boxY + boxH); ctx.stroke();
      ctx.fillStyle = '#9b59b6'; ctx.beginPath();
      var ffx = x + boxW/2 + f*as;
      ctx.moveTo(ffx, boxY + boxH); ctx.lineTo(ffx-10, boxY + boxH - 6); ctx.lineTo(ffx-10, boxY + boxH + 6); ctx.fill();
      ctx.fillText('f', ffx + 10, boxY + boxH + 4); ctx.restore();
    }

    document.querySelectorAll('#caseTable tbody tr').forEach(function(tr) {
      tr.classList.toggle('active', tr.dataset.case === state);
    });

    document.getElementById('fVal').textContent = F.toFixed(1);
    document.getElementById('gVal').textContent = G.toFixed(1);
    document.getElementById('fRange').value = F;
    document.getElementById('gRange').value = G;

    document.getElementById('readout').innerHTML =
      '最大静摩擦力 ≈ μN = <b>' + fMax.toFixed(2) + '</b> N<br>' +
      '当前摩擦力 f = <b>' + f.toFixed(2) + '</b> N<br>' +
      '状态：' + (state === 'static' ? '<b style="color:#f39c12">静止</b>' : '<b style="color:#27ae60">滑动</b>') + '<br>' +
      '<span style="font-size:12px;color:#888">滑动摩擦力只与 μ 和 N 有关，与拉力无关</span>';
  }

  document.getElementById('fRange').addEventListener('input', function(e) { F = parseFloat(e.target.value); v=0; draw(); });
  document.getElementById('gRange').addEventListener('input', function(e) { G = parseFloat(e.target.value); v=0; draw(); });
  document.getElementById('surfaceSel').addEventListener('change', function(e) { mu = parseFloat(e.target.value); v=0; draw(); });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  
  // 简单的动画循环，让推动后物体能滑行
  setInterval(function(){ if(v>0) update(); }, 30);
  draw();
})();
</script>
</body>
</html>
