<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杠杆平衡 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>杠杆平衡</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>条件</th><th>现象</th></tr></thead>
    <tbody>
      <tr data-case="left"><td>1</td><td>F₁L₁ &gt; F₂L₂</td><td>左端下沉</td></tr>
      <tr data-case="balance"><td>2</td><td>F₁L₁ = F₂L₂</td><td>杠杆平衡</td></tr>
      <tr data-case="right"><td>3</td><td>F₁L₁ &lt; F₂L₂</td><td>右端下沉</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div style="font-size:13px;color:#666;margin-bottom:6px">左侧</div>
  <label>力 F₁ = <span id="f1Val">5.0</span> N
    <input type="range" id="f1Range" min="1" max="10" value="5" step="0.5">
  </label>
  <label>力臂 L₁ = <span id="l1Val">20.0</span> cm
    <input type="range" id="l1Range" min="5" max="30" value="20" step="0.5">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:6px">右侧</div>
  <label>力 F₂ = <span id="f2Val">5.0</span> N
    <input type="range" id="f2Range" min="1" max="10" value="5" step="0.5">
  </label>
  <label>力臂 L₂ = <span id="l2Val">20.0</span> cm
    <input type="range" id="l2Range" min="5" max="30" value="20" step="0.5">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <div class="row">
    <input type="checkbox" id="playF1">
    <label for="playF1" style="margin:0">左力 F₁ 变化</label>
  </div>
  <div class="row">
    <input type="checkbox" id="playL1">
    <label for="playL1" style="margin:0">左力臂 L₁ 变化</label>
  </div>
  <div class="row">
    <label style="margin:0;white-space:nowrap">方向</label>
    <select id="playDir">
      <option value="inc">逐渐增大</option>
      <option value="dec">逐渐减小</option>
      <option value="pingpong" selected>来回</option>
    </select>
  </div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">拖动滑块改变力和力臂，观察杠杆倾斜</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var F1 = 5, L1 = 20, F2 = 5, L2 = 20;
  var playing = false, playDir = 1, rafId = null;
  var BAR_HALF = 30;  // 杆半长（场景单位）

  function getState() {
    var M1 = F1 * L1;
    var M2 = F2 * L2;
    var dM = M1 - M2;
    if (Math.abs(dM) < 0.5) return { state: 'balance', M1: M1, M2: M2, tilt: 0 };
    var tilt = Math.max(-15, Math.min(15, dM / 8));
    return { state: dM > 0 ? 'left' : 'right', M1: M1, M2: M2, tilt: tilt };
  }

  function draw() {
    var TH = App.getTheme();
    opt.clear();

    var info = getState();
    var tiltRad = info.tilt * Math.PI / 180;

    // 支架
    var base = opt.toScreen(0, -28);
    var origin = opt.toScreen(0, 0);
    var ctx = opt.ctx;
    ctx.save();
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(origin[0], origin[1]);
    ctx.lineTo(base[0], base[1]);
    ctx.stroke();
    // 底座
    ctx.beginPath();
    ctx.moveTo(base[0] - 30, base[1]);
    ctx.lineTo(base[0] + 30, base[1]);
    ctx.stroke();
    // 支点三角
    ctx.fillStyle = '#34495e';
    ctx.beginPath();
    ctx.moveTo(origin[0], origin[1]);
    ctx.lineTo(origin[0] - 8, origin[1] + 10);
    ctx.lineTo(origin[0] + 8, origin[1] + 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 旋转坐标系画杠杆
    ctx.save();
    ctx.translate(origin[0], origin[1]);
    ctx.rotate(tiltRad);
    // 杆
    ctx.fillStyle = '#5d6d7e';
    ctx.fillRect(-BAR_HALF * opt.scale, -3, BAR_HALF * 2 * opt.scale, 6);
    // 刻度线（每 5 单位）
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 1;
    for (var t = -30; t <= 30; t += 5) {
      if (t === 0) continue;
      var px = t * opt.scale;
      ctx.beginPath();
      ctx.moveTo(px, -3);
      ctx.lineTo(px, 3);
      ctx.stroke();
    }
    // 左力臂标注
    ctx.strokeStyle = TH.ray1;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-L1 * opt.scale, 0);
    ctx.lineTo(0, 0);
    ctx.stroke();
    // 右力臂标注
    ctx.strokeStyle = TH.ray2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(L2 * opt.scale, 0);
    ctx.stroke();
    ctx.restore();

    // 计算左右砝码位置（旋转后的世界坐标）
    function rotate(x, y, rad) {
      var c = Math.cos(rad), s = Math.sin(rad);
      return [x * c - y * s, x * s + y * c];
    }
    var leftPos = rotate(-L1, 0, tiltRad);
    var rightPos = rotate(L2, 0, tiltRad);

    // 左砝码
    drawWeight(leftPos[0], leftPos[1], F1, TH.ray1, '左');
    // 右砝码
    drawWeight(rightPos[0], rightPos[1], F2, TH.ray2, '右');

    // 支撑点标记
    opt.drawPoint(0, 0, '#2c3e50');

    // 表格高亮
    document.querySelectorAll('#caseTable tbody tr').forEach(function (tr) {
      tr.classList.toggle('active', tr.dataset.case === info.state);
    });

    // 侧栏读数
    document.getElementById('f1Val').textContent = F1.toFixed(1);
    document.getElementById('l1Val').textContent = L1.toFixed(1);
    document.getElementById('f2Val').textContent = F2.toFixed(1);
    document.getElementById('l2Val').textContent = L2.toFixed(1);
    document.getElementById('f1Range').value = F1;
    document.getElementById('l1Range').value = L1;
    document.getElementById('f2Range').value = F2;
    document.getElementById('l2Range').value = L2;

    var stateText = info.state === 'balance' ? '<b style="color:#27ae60">✓ 杠杆平衡</b>'
                  : info.state === 'left' ? '<b style="color:#e74c3c">左端下沉</b>'
                  : '<b style="color:#e74c3c">右端下沉</b>';
    document.getElementById('readout').innerHTML =
      'F₁ × L₁ = <b>' + info.M1.toFixed(1) + '</b> N·cm<br>' +
      'F₂ × L₂ = <b>' + info.M2.toFixed(1) + '</b> N·cm<br>' +
      stateText + '<br>' +
      '<span style="font-size:12px;color:#888">条件：F₁L₁ = F₂L₂</span>';
  }

  // 画砝码 + 向下箭头（表示力）
  function drawWeight(x, y, F, color, label) {
    var ctx = opt.ctx;
    var p = opt.toScreen(x, y);
    var w = 8 + F * 1.5;   // 尺寸随力变
    var h = 8 + F * 1.5;
    // 砝码方块（改为紧贴杠杆下方，解决"悬浮"问题）
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(p[0] - w / 2, p[1], w, h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(p[0] - w / 2, p[1], w, h);
    // 力箭头（向下）
    var arrowLen = 10 + F * 3;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1] + h);
    ctx.lineTo(p[0], p[1] + h + arrowLen);
    ctx.stroke();
    // 箭头尖
    ctx.beginPath();
    ctx.moveTo(p[0], p[1] + h + arrowLen);
    ctx.lineTo(p[0] - 5, p[1] + h + arrowLen - 10);
    ctx.lineTo(p[0] + 5, p[1] + h + arrowLen - 10);
    ctx.closePath();
    ctx.fill();
    // F 标注
    ctx.fillStyle = color;
    ctx.font = '13px sans-serif';
    ctx.fillText('F' + (label === '左' ? '₁' : '₂') + '=' + F.toFixed(1) + 'N', p[0] + w/2 + 4, p[1] + h/2 + 4);
    ctx.restore();
  }

  // 事件绑定
  document.getElementById('f1Range').addEventListener('input', function(e) { F1 = parseFloat(e.target.value); draw(); });
  document.getElementById('l1Range').addEventListener('input', function(e) { L1 = parseFloat(e.target.value); draw(); });
  document.getElementById('f2Range').addEventListener('input', function(e) { F2 = parseFloat(e.target.value); draw(); });
  document.getElementById('l2Range').addEventListener('input', function(e) { L2 = parseFloat(e.target.value); draw(); });
  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var mode = document.getElementById('playDir').value;
    var spd = parseFloat(document.getElementById('speedRange').value) * 0.4;
    var dir = mode === 'inc' ? 1 : mode === 'dec' ? -1 : playDir;

    if (document.getElementById('playF1').checked) {
      F1 += dir * spd;
      if (F1 > 10) { F1 = 10; if (mode === 'pingpong') playDir = -1; }
      if (F1 < 1)  { F1 = 1;  if (mode === 'pingpong') playDir = 1; }
      F1 = Math.round(F1 * 10) / 10;
    }
    if (document.getElementById('playL1').checked) {
      L1 += dir * spd;
      if (L1 > 30) { L1 = 30; if (mode === 'pingpong') playDir = -1; }
      if (L1 < 5)  { L1 = 5;  if (mode === 'pingpong') playDir = 1; }
      L1 = Math.round(L1 * 10) / 10;
    }
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      var pf = document.getElementById('playF1').checked;
      var pl = document.getElementById('playL1').checked;
      if (!pf && !pl) { alert('请至少勾选一项播放内容'); return; }
      playing = true; playDir = 1;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    F1 = 5; L1 = 20; F2 = 5; L2 = 20;
    playDir = 1;
    document.getElementById('playF1').checked = false;
    document.getElementById('playL1').checked = false;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
