<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杠杆平衡 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>杠杆平衡</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>条件</th><th>现象</th></tr></thead>
    <tbody>
      <tr data-case="left"><td>1</td><td>F₁L₁ &gt; F₂L₂</td><td>左端下沉</td></tr>
      <tr data-case="balance"><td>2</td><td>F₁L₁ = F₂L₂</td><td>杠杆平衡</td></tr>
      <tr data-case="right"><td>3</td><td>F₁L₁ &lt; F₂L₂</td><td>右端下沉</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <div style="font-size:13px;color:#666;margin-bottom:6px">左侧</div>
  <label>力 F₁ = <span id="f1Val">5.0</span> N
    <input type="range" id="f1Range" min="1" max="10" value="5" step="0.5">
  </label>
  <label>力臂 L₁ = <span id="l1Val">20.0</span> cm
    <input type="range" id="l1Range" min="5" max="30" value="20" step="0.5">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:6px">右侧</div>
  <label>力 F₂ = <span id="f2Val">5.0</span> N
    <input type="range" id="f2Range" min="1" max="10" value="5" step="0.5">
  </label>
  <label>力臂 L₂ = <span id="l2Val">20.0</span> cm
    <input type="range" id="l2Range" min="5" max="30" value="20" step="0.5">
  </label>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">拖动滑块改变力和力臂，观察杠杆倾斜</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var F1 = 5, L1 = 20, F2 = 5, L2 = 20;
  var BAR_HALF = 30;

  function getState() {
    var M1 = F1 * L1, M2 = F2 * L2, dM = M1 - M2;
    if (Math.abs(dM) < 0.5) return { state: 'balance', M1: M1, M2: M2, tilt: 0 };
    var tilt = Math.max(-15, Math.min(15, dM / 8));
    return { state: dM > 0 ? 'left' : 'right', M1: M1, M2: M2, tilt: tilt };
  }

  function draw() {
    var TH = App.getTheme();
    opt.clear();
    var info = getState();
    var tiltRad = info.tilt * Math.PI / 180;

    // 画支架
    var base = opt.toScreen(0, -28);
    var origin = opt.toScreen(0, 0);
    var ctx = opt.ctx;
    
    ctx.save();
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(origin[0], origin[1]);
    ctx.lineTo(base[0], base[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(base[0] - 30, base[1]);
    ctx.lineTo(base[0] + 30, base[1]);
    ctx.stroke();
    // 支点三角
    ctx.fillStyle = '#34495e';
    ctx.beginPath();
    ctx.moveTo(origin[0], origin[1]);
    ctx.lineTo(origin[0] - 8, origin[1] + 10);
    ctx.lineTo(origin[0] + 8, origin[1] + 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 旋转坐标系画杠杆
    ctx.save();
    ctx.translate(origin[0], origin[1]);
    ctx.rotate(tiltRad);

    // 杆
    ctx.fillStyle = '#5d6d7e';
    ctx.fillRect(-BAR_HALF * opt.scale, -3, BAR_HALF * 2 * opt.scale, 6);
    
    // 刻度线
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 1;
    for (var t = -30; t <= 30; t += 5) {
      if (t === 0) continue;
      var px = t * opt.scale;
      ctx.beginPath(); ctx.moveTo(px, -3); ctx.lineTo(px, 3); ctx.stroke();
    }
    
    // 力臂标注
    ctx.strokeStyle = TH.ray1; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-L1 * opt.scale, 0); ctx.lineTo(0, 0); ctx.stroke();
    ctx.strokeStyle = TH.ray2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L2 * opt.scale, 0); ctx.stroke();

    // 画砝码（传入倾斜角度以让箭头保持竖直）
    drawWeightLocal(-L1 * opt.scale, 0, F1, TH.ray1, '₁', tiltRad);
    drawWeightLocal(L2 * opt.scale, 0, F2, TH.ray2, '₂', tiltRad);

    ctx.restore();

    // 表格高亮
    document.querySelectorAll('#caseTable tbody tr').forEach(function (tr) {
      tr.classList.toggle('active', tr.dataset.case === info.state);
    });

    // 侧栏读数
    document.getElementById('f1Val').textContent = F1.toFixed(1);
    document.getElementById('l1Val').textContent = L1.toFixed(1);
    document.getElementById('f2Val').textContent = F2.toFixed(1);
    document.getElementById('l2Val').textContent = L2.toFixed(1);
    document.getElementById('f1Range').value = F1;
    document.getElementById('l1Range').value = L1;
    document.getElementById('f2Range').value = F2;
    document.getElementById('l2Range').value = L2;

    var stateText = info.state === 'balance' ? '<b style="color:#27ae60">✓ 杠杆平衡</b>'
                  : info.state === 'left' ? '<b style="color:#e74c3c">左端下沉</b>'
                  : '<b style="color:#e74c3c">右端下沉</b>';
    document.getElementById('readout').innerHTML =
      'F₁ × L₁ = <b>' + info.M1.toFixed(1) + '</b> N·cm<br>' +
      'F₂ × L₂ = <b>' + info.M2.toFixed(1) + '</b> N·cm<br>' +
      stateText;
  }

  // 局部坐标系画砝码及全局向下的力
  function drawWeightLocal(x, y, F, color, label, tiltRad) {
    var ctx = opt.ctx;
    var w = 8 + F * 1.5;
    var h = 8 + F * 1.5;
    var hangLen = 10;

    ctx.save();
    // 1. 悬挂线（跟随杠杆旋转）
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 3); ctx.lineTo(x, 3 + hangLen); ctx.stroke();

    // 2. 砝码方块（跟随杠杆旋转）
    var boxY = 3 + hangLen;
    ctx.fillStyle = color; ctx.globalAlpha = 0.75;
    ctx.fillRect(x - w / 2, boxY, w, h);
    ctx.globalAlpha = 1; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.strokeRect(x - w / 2, boxY, w, h);

    // 3. 力箭头（抵消旋转变竖直向下）
    ctx.translate(x, boxY + h); // 原点移到砝码底部
    ctx.rotate(-tiltRad);       // 反向旋转，恢复绝对的竖直向下

    var arrowLen = 10 + F * 3;
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, arrowLen); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, arrowLen);
    ctx.lineTo(-5, arrowLen - 10);
    ctx.lineTo(5, arrowLen - 10);
    ctx.fill();

    // 文字标注（保持水平）
    ctx.fillStyle = color; ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('F' + label + '=' + F.toFixed(1) + 'N', 10, arrowLen / 2);
    ctx.restore();
  }

  document.getElementById('f1Range').addEventListener('input', function(e) { F1 = parseFloat(e.target.value); draw(); });
  document.getElementById('l1Range').addEventListener('input', function(e) { L1 = parseFloat(e.target.value); draw(); });
  document.getElementById('f2Range').addEventListener('input', function(e) { F2 = parseFloat(e.target.value); draw(); });
  document.getElementById('l2Range').addEventListener('input', function(e) { L2 = parseFloat(e.target.value); draw(); });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
