<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>过山车 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>过山车</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>位置</th><th>能量</th></tr></thead>
    <tbody>
      <tr class="active"><td>最高处</td><td>Ep 最大，v = 0</td></tr>
      <tr class="active"><td>下坡</td><td>Ep → Ek</td></tr>
      <tr class="active"><td>上坡</td><td>Ek → Ep</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>轨道起伏 A = <span id="aVal">4.0</span> m
    <input type="range" id="aRange" min="1" max="8" value="4" step="0.2">
  </label>
  <label>坡度 s = <span id="sVal">1.0</span>
    <input type="range" id="sRange" min="0.5" max="2.5" value="1" step="0.05">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">看小球上下坡时动能和势能的转换</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var g = 9.8, m = 1;
  var A = 4.0;          // 轨道起伏幅度
  var speedScale = 1.0; // 时间加速
  var x = 0;            // 位置参数（0 ~ 2π）
  var playing = false, rafId = null;
  var maxX = 4 * Math.PI;  // 走两圈

  // 轨道：y = A * (1 - cos(x)) / 2 ，最低点 y = 0，最高点 y = A
  function trackY(xv) {
    return A * (1 - Math.cos(xv)) / 2;
  }
  // 轨道弧长用数值积分近似，为简化我们用等参数 x 步进（视觉上基本一致）
  // 能量守恒：v = sqrt(2g(y0 - y))，起始点 y0 = A（最高点）
  var y0 = A;
  function getV(xv) {
    var y = trackY(xv);
    var h = y0 - y;
    if (h < 0) h = 0;
    return Math.sqrt(2 * g * h);
  }

  function draw() {
    var ctx = opt.ctx;
    var W = opt.W, H = opt.H;
    opt.clear();

    // 轨道
    var xStart = W * 0.12;
    var xEnd = W * 0.88;
    var xSpan = xEnd - xStart;
    var yBase = H - 90;
    var yTop = 80;
    var yScale = (yBase - yTop) / A;
    var xRange = maxX;

    // 采样画曲线
    ctx.save();
    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var first = true;
    for (var i = 0; i <= 300; i++) {
      var xv = xRange * i / 300;
      var px = xStart + (xv / xRange) * xSpan;
      var py = yBase - trackY(xv) * yScale;
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // 双层轨道
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    first = true;
    for (var j = 0; j <= 300; j++) {
      var xv2 = xRange * j / 300;
      var px2 = xStart + (xv2 / xRange) * xSpan;
      var py2 = yBase - trackY(xv2) * yScale + 6;
      if (first) { ctx.moveTo(px2, py2); first = false; }
      else ctx.lineTo(px2, py2);
    }
    ctx.stroke();
    ctx.restore();

    // 当前位置
    var cx = xStart + (x / xRange) * xSpan;
    var cy = yBase - trackY(x) * yScale;

    // 小球
    ctx.save();
    var grad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 14);
    grad.addColorStop(0, '#f39c12');
    grad.addColorStop(1, '#c0392b');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 能量计算
    var yNow = trackY(x);
    var v = getV(x);
    var Ep = m * g * yNow;
    var Ek = 0.5 * m * v * v;
    var total = m * g * y0;

    // 能量条
    var rx = W * 0.15;
    var barY = 30;
    var barW = W * 0.7;
    var barH = 22;

    // 底框
    ctx.save();
    ctx.fillStyle = '#fafbfc';
    ctx.strokeStyle = '#ddd';
    ctx.fillRect(rx, barY, barW, barH);
    ctx.strokeRect(rx, barY, barW, barH);
    ctx.restore();

    // Ep（蓝） + Ek（橙）叠加
    var EpW = barW * (Ep / total);
    var EkW = barW * (Ek / total);
    ctx.save();
    ctx.fillStyle = '#3498db';
    ctx.fillRect(rx, barY, EpW, barH);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(rx + EpW, barY, EkW, barH);
    ctx.strokeStyle = '#95a5a6';
    ctx.strokeRect(rx, barY, barW, barH);
    ctx.restore();

    // 标签
    ctx.save();
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#fff';
    if (EpW > 40) {
      ctx.textAlign = 'left';
      ctx.fillText('Ep', rx + 6, barY + 16);
    }
    if (EkW > 40) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText('Ek', rx + EpW + 6, barY + 16);
    }
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'center';
    ctx.font = '12px sans-serif';
    ctx.fillText('重力势能 Ep = ' + Ep.toFixed(1) + ' J　动能 Ek = ' + Ek.toFixed(1) + ' J　总能量 = ' + total.toFixed(1) + ' J', W / 2, barY + barH + 18);
    ctx.restore();

    // 侧栏
    document.getElementById('aVal').textContent = A.toFixed(1);
    document.getElementById('sVal').textContent = speedScale.toFixed(2);
    document.getElementById('aRange').value = A;
    document.getElementById('sRange').value = speedScale;

    document.getElementById('readout').innerHTML =
      '高度 h = <b>' + yNow.toFixed(2) + '</b> m<br>' +
      '速度 v = <b>' + v.toFixed(2) + '</b> m/s<br>' +
      'Ep = <b>' + Ep.toFixed(2) + '</b> J<br>' +
      'Ek = <b>' + Ek.toFixed(2) + '</b> J<br>' +
      '<span style="color:#27ae60">Ep + Ek = ' + (Ep + Ek).toFixed(2) + ' J（守恒）</span>';
  }

  document.getElementById('aRange').addEventListener('input', function(e){
    A = parseFloat(e.target.value); y0 = A; x = 0; draw();
  });
  document.getElementById('sRange').addEventListener('input', function(e){
    speedScale = parseFloat(e.target.value);
  });
  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    x = 0; stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var base = 0.02 * speedScale * parseFloat(document.getElementById('speedRange').value);
    // 越快的球，x 变化也越快（简单近似）
    var yNow = trackY(x);
    var v = getV(x);
    x += base * (0.5 + v * 0.3);
    if (x > maxX) x = 0;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
