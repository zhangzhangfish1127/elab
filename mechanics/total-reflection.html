<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全反射 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>全反射</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>条件</th><th>现象</th></tr></thead>
    <tbody>
      <tr data-case="normal"><td>1</td><td>θ₁ &lt; C</td><td>折射 + 反射</td></tr>
      <tr data-case="critical"><td>2</td><td>θ₁ = C</td><td>折射沿界面</td></tr>
      <tr data-case="total"><td>3</td><td>θ₁ &gt; C</td><td>只有反射</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div class="row">
    <label style="margin:0;white-space:nowrap">入射介质</label>
    <select id="n1Sel">
      <option value="air">空气 (1.00)</option>
      <option value="ice">冰 (1.31)</option>
      <option value="water" selected>水 (1.33)</option>
      <option value="alcohol">酒精 (1.36)</option>
      <option value="acrylic">有机玻璃 (1.49)</option>
      <option value="glass">玻璃 (1.50)</option>
      <option value="diamond">钻石 (2.42)</option>
    </select>
  </div>
  <div class="row">
    <label style="margin:0;white-space:nowrap">出射介质</label>
    <select id="n2Sel">
      <option value="air" selected>空气 (1.00)</option>
      <option value="ice">冰 (1.31)</option>
      <option value="water">水 (1.33)</option>
      <option value="alcohol">酒精 (1.36)</option>
      <option value="acrylic">有机玻璃 (1.49)</option>
      <option value="glass">玻璃 (1.50)</option>
      <option value="diamond">钻石 (2.42)</option>
    </select>
  </div>

  <label>入射角 θ₁ = <span id="aVal">30.0</span>°
    <input type="range" id="aRange" min="0" max="89" value="30" step="1">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <div class="row">
    <input type="checkbox" id="playToggle" checked>
    <label for="playToggle" style="margin:0">入射角自动变化</label>
  </div>
  <div class="row">
    <label style="margin:0;white-space:nowrap">方向</label>
    <select id="playDir">
      <option value="increase">逐渐增大</option>
      <option value="decrease">逐渐减小</option>
      <option value="pingpong" selected>来回</option>
    </select>
  </div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>

  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="legend">
      <span id="lgIn" style="--c:#e74c3c">入射光线</span>
      <span id="lgRe" style="--c:#f39c12">反射光线</span>
      <span id="lgRf" style="--c:#27ae60">折射光线</span>
      <span id="lgNm" style="--c:#7f8c8d">法线</span>
    </div>
    <div class="hint">拖动入射光线（左下方）或滑块，改变入射角</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();

  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var RAY_LEN = 50;
  var angle = 30;
  var playing = false, playDir = 1, rafId = null, dragging = false;

  var N = { air:1.00, ice:1.31, water:1.33, alcohol:1.36, acrylic:1.49, glass:1.50, diamond:2.42 };
  var NAMES = { air:'空气', ice:'冰', water:'水', alcohol:'酒精', acrylic:'有机玻璃', glass:'玻璃', diamond:'钻石' };
  var COLORS = {
    air:'rgba(200,230,250,0.10)', ice:'rgba(200,230,255,0.35)', water:'rgba(100,180,220,0.35)',
    alcohol:'rgba(230,230,220,0.30)', acrylic:'rgba(220,210,180,0.30)', glass:'rgba(149,180,180,0.35)', diamond:'rgba(230,230,245,0.25)'
  };

  function draw() {
    var TH = App.getTheme();
    opt.clear();
    var shown = angle.toFixed(1);
    var n1Name = document.getElementById('n1Sel').value;
    var n2Name = document.getElementById('n2Sel').value;
    var n1 = N[n1Name], n2 = N[n2Name];
    var rad1 = angle * Math.PI / 180;
    var canTotal = n1 > n2 + 0.001;
    var Cdeg = canTotal ? Math.asin(n2 / n1) * 180 / Math.PI : null;

    var state;
    if (!canTotal) state = 'none';
    else if (angle < Cdeg - 0.5) state = 'normal';
    else if (angle <= Cdeg + 0.5) state = 'critical';
    else state = 'total';

    var totalReflect = state === 'total';
    var sin2 = n1 * Math.sin(rad1) / n2;
    var rad2 = totalReflect || sin2 > 1 ? null : Math.asin(sin2);

    opt.drawMedium(-100, 60, 100, 0, COLORS[n1Name], NAMES[n1Name], '#2c3e50');
    opt.drawMedium(-100, 0, 100, -60, COLORS[n2Name], NAMES[n2Name], '#2c3e50');
    opt.drawRay(-100, 0, 100, 0, '#7f8c8d', 2);
    opt.drawVerticalNormal(0, -45, 45, TH.normal);

    var ix = -RAY_LEN * Math.sin(rad1);
    var iy = -RAY_LEN * Math.cos(rad1);
    opt.drawArrowRay(ix, iy, 0, 0, TH.ray1, 0.55);
    opt.drawArrowRay(0, 0, RAY_LEN * Math.sin(rad1), -RAY_LEN * Math.cos(rad1), TH.ray3, 0.55);
    if (rad2 !== null) {
      opt.drawArrowRay(0, 0, RAY_LEN * Math.sin(rad2), RAY_LEN * Math.cos(rad2), TH.ray2, 0.55);
    }

    opt.drawAngleArc(0, 0, 15, -Math.PI/2 - rad1, -Math.PI/2, TH.ray1, 'θ₁=' + shown + '°');
    opt.drawAngleArc(0, 0, 22, -Math.PI/2, -Math.PI/2 + rad1, TH.ray3, 'θ₂=' + shown + '°');
    if (rad2 !== null) {
      opt.drawAngleArc(0, 0, 30, Math.PI/2 - rad2, Math.PI/2, TH.ray2, 'θ₃=' + (rad2 * 180 / Math.PI).toFixed(1) + '°');
    }

    opt.drawPoint(0, 0, '#2c3e50', 'O');

    document.querySelectorAll('#caseTable tbody tr').forEach(function(tr) {
      if (state === 'none') { tr.classList.remove('active'); tr.classList.add('disabled'); }
      else { tr.classList.remove('disabled'); tr.classList.toggle('active', tr.dataset.case === state); }
    });

    document.getElementById('lgIn').style.setProperty('--c', TH.ray1);
    document.getElementById('lgRe').style.setProperty('--c', TH.ray3);
    document.getElementById('lgRf').style.setProperty('--c', TH.ray2);
    document.getElementById('lgNm').style.setProperty('--c', TH.normal);

    document.getElementById('aVal').textContent = shown;
    document.getElementById('aRange').value = angle;

    var info = document.getElementById('readout');
    if (state === 'none') {
      info.innerHTML = 'n₁ = <b>' + n1 + '</b>（' + NAMES[n1Name] + '）<br>n₂ = <b>' + n2 + '</b>（' + NAMES[n2Name] + '）<br><b style="color:#e67e22">n₁ ≤ n₂，不会发生全反射</b><br><span style="font-size:12px;color:#888">全反射只发生在光密 → 光疏时</span>';
    } else {
      var st = state === 'normal' ? '正常折射 + 反射' : state === 'critical' ? '临界状态（折射光沿界面）' : '<span style="color:#e67e22">全反射（无折射光）</span>';
      info.innerHTML = '入射角 θ₁ = <b>' + shown + '°</b><br>临界角 C = <b>' + Cdeg.toFixed(1) + '°</b><br>状态：<b>' + st + '</b>';
    }
  }

  document.getElementById('aRange').addEventListener('input', function(e) { angle = parseFloat(e.target.value); draw(); });
  document.getElementById('n1Sel').addEventListener('change', draw);
  document.getElementById('n2Sel').addEventListener('change', draw);
  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });

  function startDrag(e) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, t.clientY - rect.top);
    var wx = w[0], wy = w[1];
    var rad = angle * Math.PI / 180;
    var ix = -RAY_LEN * Math.sin(rad), iy = -RAY_LEN * Math.cos(rad);
    var dx = -ix, dy = -iy;
    var tt = Math.max(0, Math.min(1, ((wx - ix) * dx + (wy - iy) * dy) / (dx*dx + dy*dy)));
    var px = ix + tt * dx, py = iy + tt * dy;
    if (Math.hypot(wx - px, wy - py) < 20 || (wy < 0 && wx < 0)) {
      dragging = true; stopPlay();
      updateAngle(wx, wy); e.preventDefault();
    }
  }
  function moveDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, t.clientY - rect.top);
    updateAngle(w[0], w[1]);
  }
  function updateAngle(wx, wy) {
    if (wy >= 0 || wx >= 0) return;
    var deg = Math.atan2(-wx, -wy) * 180 / Math.PI;
    angle = Math.max(0, Math.min(89, Math.round(deg * 10) / 10));
    draw();
  }
  function endDrag() { dragging = false; }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', endDrag);

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var mode = document.getElementById('playDir').value;
    var spd = parseFloat(document.getElementById('speedRange').value) * 0.5;
    var dir = mode === 'increase' ? 1 : mode === 'decrease' ? -1 : playDir;
    angle += dir * spd;
    if (angle > 89) { angle = 89; if (mode === 'pingpong') playDir = -1; }
    if (angle < 0)  { angle = 0;  if (mode === 'pingpong') playDir = 1; }
    angle = Math.round(angle * 10) / 10;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      playing = true; playDir = 1;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    angle = 30; playDir = 1;
    document.getElementById('n1Sel').value = 'water';
    document.getElementById('n2Sel').value = 'air';
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
