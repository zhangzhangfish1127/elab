<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大气压 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>大气压 (托里拆利实验)</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>项目</th><th>数值</th></tr></thead>
    <tbody>
      <tr class="active"><td>标准大气压</td><td>760 mmHg</td></tr>
      <tr class="active"><td>换算</td><td>约 1.013 × 10⁵ Pa</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>外界大气压 = <span id="pVal">760</span> mmHg
    <input type="range" id="pRange" min="500" max="800" value="760" step="10">
  </label>
  
  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">上方为真空，水银柱高度由外界大气压决定</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var pressure = 760; // mmHg

  function draw() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    opt.clear();

    var centerX = W / 2;
    var baseY = H * 0.85; // 水银槽底部
    var dishW = 300;
    var dishH = 60;
    var tubeW = 40;
    var scale = Math.min((H * 0.7) / 800, 1); // 像素/mm，最多 1:1

    // 画水银槽
    ctx.save();
    ctx.fillStyle = '#bdc3c7'; // 玻璃槽
    ctx.fillRect(centerX - dishW/2, baseY - dishH, dishW, dishH);
    
    // 槽内水银
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(centerX - dishW/2 + 4, baseY - dishH + 20, dishW - 8, dishH - 20);
    ctx.restore();

    // 画玻璃管
    var tubeTopY = H * 0.1;
    var tubeBotY = baseY - 20; // 插入水银中

    ctx.save();
    ctx.strokeStyle = '#ecf0f1';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(centerX - tubeW/2, tubeTopY);
    ctx.lineTo(centerX - tubeW/2, tubeBotY);
    ctx.lineTo(centerX + tubeW/2, tubeBotY);
    ctx.lineTo(centerX + tubeW/2, tubeTopY);
    ctx.stroke();
    // 封顶
    ctx.beginPath();
    ctx.moveTo(centerX - tubeW/2, tubeTopY);
    ctx.lineTo(centerX + tubeW/2, tubeTopY);
    ctx.stroke();
    ctx.restore();

    // 管内水银柱高度
    var mercuryH = pressure * scale;
    var mercuryTopY = baseY - 20 - mercuryH;

    // 画管内水银
    ctx.save();
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(centerX - tubeW/2 + 2, mercuryTopY, tubeW - 4, mercuryH);
    
    // 管内真空部分（留白，或者画点星星示意）
    ctx.fillStyle = '#fff';
    ctx.fillRect(centerX - tubeW/2 + 2, tubeTopY + 2, tubeW - 4, mercuryTopY - tubeTopY - 2);
    ctx.fillStyle = '#3498db';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('真空', centerX, tubeTopY + 30);
    ctx.restore();

    // 画刻度尺
    ctx.save();
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    var rulerX = centerX + 80;
    ctx.beginPath();
    ctx.moveTo(rulerX, baseY - 20 - 800 * scale);
    ctx.lineTo(rulerX, baseY - 20);
    ctx.stroke();
    
    // 刻度线
    ctx.fillStyle = '#2c3e50';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (var i = 0; i <= 800; i += 100) {
      var y = baseY - 20 - i * scale;
      ctx.beginPath(); ctx.moveTo(rulerX, y); ctx.lineTo(rulerX + 10, y); ctx.stroke();
      ctx.fillText(i, rulerX + 15, y);
    }
    // 显示当前刻度
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.moveTo(rulerX - 10, mercuryTopY); ctx.lineTo(rulerX, mercuryTopY); ctx.stroke();
    ctx.restore();

    // 顶部大气压指示
    ctx.save();
    ctx.strokeStyle = '#2980b9'; ctx.lineWidth = 3;
    ctx.beginPath(); 
    ctx.moveTo(centerX - 100, baseY - dishH + 10); 
    ctx.lineTo(centerX - 100, baseY - dishH - 50); 
    ctx.stroke();
    ctx.fillStyle = '#2980b9';
    ctx.beginPath();
    ctx.moveTo(centerX - 100, baseY - dishH - 50);
    ctx.lineTo(centerX - 106, baseY - dishH - 40);
    ctx.lineTo(centerX - 94, baseY - dishH - 40);
    ctx.fill();
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('大气压', centerX - 110, baseY - dishH - 30);
    ctx.restore();

    // 读数
    document.getElementById('pVal').textContent = pressure;
    document.getElementById('pRange').value = pressure;

    document.getElementById('readout').innerHTML =
      '管内水银柱高度 h = <b>' + pressure + '</b> mm<br>' +
      '换算为标准大气压 = <b>' + (pressure / 760).toFixed(2) + '</b> atm<br>' +
      '底部压强 = 大气压 = <b>' + (pressure * 133.3).toFixed(0) + '</b> Pa';
  }

  document.getElementById('pRange').addEventListener('input', function(e) {
    pressure = parseFloat(e.target.value);
    draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
