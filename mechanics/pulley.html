<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑轮组 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>滑轮组</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>情况</th><th>拉力 F (不计摩擦)</th></tr></thead>
    <tbody>
      <tr class="active"><td>定滑轮</td><td>F = G</td></tr>
      <tr class="active"><td>动滑轮 (n=2)</td><td>F = G / 2</td></tr>
      <tr class="active"><td>滑轮组 (n=3)</td><td>F = G / 3</td></tr>
      <tr class="active"><td>距离关系</td><td>s = n · h</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  
  <div class="row">
    <label style="margin:0;white-space:nowrap">滑轮类型</label>
    <select id="typeSel">
      <option value="fixed">定滑轮</option>
      <option value="movable" selected>动滑轮 (n=2)</option>
      <option value="combo">滑轮组 (n=3)</option>
    </select>
  </div>

  <label>物重 G = <span id="gVal">10.0</span> N
    <input type="range" id="gRange" min="2" max="20" value="10" step="0.5">
  </label>
  
  <label>上升高度 h = <span id="hVal">2.0</span> m
    <input type="range" id="hRange" min="0.5" max="5" value="2" step="0.5">
  </label>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">观察绳子段数（n）对拉力和拉动距离的影响</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var G = 10, h = 2;
  var type = 'movable';

  function draw() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    opt.clear();

    var n = type === 'fixed' ? 1 : (type === 'movable' ? 2 : 3);
    var F = G / n;
    var s = h * n;

    // 天花板
    var ceilY = 60;
    ctx.save();
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(0, ceilY - 10, W, 10);
    ctx.strokeStyle = '#95a5a6';
    for(var i=0; i<W; i+=20){
      ctx.beginPath();
      ctx.moveTo(i, ceilY); ctx.lineTo(i-10, ceilY-10); ctx.stroke();
    }
    ctx.restore();

    var scale = Math.min(80, H * 0.3 / h); // 每米像素
    var weightW = 40 + G * 2;
    var weightH = 30 + G * 1.5;
    
    var floorY = H - 60;
    var centerX = W / 2;
    
    // 物体位置（减去上升高度）
    var boxX = centerX - weightW / 2;
    var boxY = floorY - weightH - h * scale;

    // 画物体
    ctx.save();
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(boxX, boxY, weightW, weightH);
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, weightW, weightH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', centerX, boxY + weightH/2);
    ctx.restore();

    // 画滑轮工具
    function drawPulley(cx, cy, r) {
      ctx.save();
      ctx.fillStyle = '#bdc3c7';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.arc(cx, cy, r*0.2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // 画绳子
    ctx.save();
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 2;
    var topY = ceilY;
    var r = 20;

    if (type === 'fixed') {
      var py = topY + 60;
      drawPulley(centerX, py, r);
      ctx.beginPath(); ctx.moveTo(centerX - r, py); ctx.lineTo(centerX - r, boxY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX + r, py); ctx.lineTo(centerX + r, py + 100); ctx.stroke();
      ctx.fillStyle = '#27ae60'; ctx.beginPath();
      ctx.moveTo(centerX + r, py + 100); ctx.lineTo(centerX + r - 6, py + 90); ctx.lineTo(centerX + r + 6, py + 90); ctx.fill();
      ctx.fillText('F', centerX + r + 15, py + 95);

    } else if (type === 'movable') {
      var py = boxY - r - 10;
      ctx.beginPath(); ctx.moveTo(centerX, py + r); ctx.lineTo(boxX + weightW/2, boxY); ctx.stroke();
      drawPulley(centerX, py, r);
      ctx.beginPath(); ctx.moveTo(centerX - r, topY); ctx.lineTo(centerX - r, py); ctx.stroke();
      ctx.beginPath(); ctx.arc(centerX, py, r, Math.PI, 0, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX + r, py); ctx.lineTo(centerX + r, py - 100); ctx.stroke();
      ctx.fillStyle = '#27ae60'; ctx.beginPath();
      ctx.moveTo(centerX + r, py - 100); ctx.lineTo(centerX + r - 6, py - 90); ctx.lineTo(centerX + r + 6, py - 90); ctx.fill();
      ctx.fillText('F', centerX + r + 15, py - 95);
      
    } else {
      var pyFixed = topY + 40;
      var pyMov = boxY - r - 10;
      drawPulley(centerX, pyFixed, r);
      drawPulley(centerX, pyMov, r);
      ctx.beginPath(); ctx.moveTo(centerX - r, pyMov); ctx.lineTo(centerX - r, pyFixed); ctx.stroke();
      ctx.beginPath(); ctx.arc(centerX, pyFixed, r, Math.PI, 0, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX + r, pyFixed); ctx.lineTo(centerX + r, pyMov); ctx.stroke();
      ctx.beginPath(); ctx.arc(centerX, pyMov, r, 0, Math.PI, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX - r, pyMov); ctx.lineTo(centerX - r, pyMov + 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX + r, pyMov); ctx.lineTo(centerX + r, pyMov - 100); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(centerX, pyMov + r); ctx.lineTo(boxX + weightW/2, boxY); ctx.stroke();
      ctx.fillStyle = '#27ae60'; ctx.beginPath();
      ctx.moveTo(centerX + r, pyMov - 100); ctx.lineTo(centerX + r - 6, pyMov - 90); ctx.lineTo(centerX + r + 6, pyMov - 90); ctx.fill();
      ctx.fillText('F', centerX + r + 15, pyMov - 95);
    }
    ctx.restore();

    document.getElementById('gVal').textContent = G.toFixed(1);
    document.getElementById('hVal').textContent = h.toFixed(1);
    document.getElementById('gRange').value = G;
    document.getElementById('hRange').value = h;

    document.getElementById('readout').innerHTML =
      '承担物重的绳子段数 n = <b>' + n + '</b><br>' +
      '理论拉力 F = G / n = <b>' + F.toFixed(2) + '</b> N<br>' +
      '绳子自由端移动距离 s = n × h = <b>' + s.toFixed(2) + '</b> m<br>' +
      '<span style="font-size:12px;color:#888">省力必费距离，且不能省功</span>';
  }

  document.getElementById('typeSel').addEventListener('change', function(e) { type = e.target.value; draw(); });
  document.getElementById('gRange').addEventListener('input', function(e) { G = parseFloat(e.target.value); draw(); });
  document.getElementById('hRange').addEventListener('input', function(e) { h = parseFloat(e.target.value); draw(); });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
