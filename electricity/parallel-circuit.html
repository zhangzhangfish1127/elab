<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>并联电路 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>并联电路</h1>
<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>规律</th><th>关系</th></tr></thead>
    <tbody>
      <tr class="active"><td>电压</td><td>U₁ = U₂ = U总</td></tr>
      <tr class="active"><td>电流</td><td>I总 = I₁ + I₂</td></tr>
    </tbody>
  </table>
  <h3>控制面板</h3>
  
  <div class="row" style="margin-bottom:8px;">
    <input type="checkbox" id="switchToggle" checked>
    <label for="switchToggle" style="margin:0; cursor:pointer; font-weight:bold;">闭合开关（通路）</label>
  </div>
  <div class="row" style="margin-bottom:12px;">
    <input type="checkbox" id="showMeter" checked>
    <label for="showMeter" style="margin:0; cursor:pointer; font-weight:bold;">显示干路电流表</label>
  </div>

  <label>电源电压 U = <span id="uVal">6.0</span> V
    <input type="range" id="uRange" min="1" max="12" value="6" step="0.5">
  </label>
  <label>支路 R₁ = <span id="r1Val">10.0</span> Ω
    <input type="range" id="r1Range" min="2" max="30" value="10" step="1">
  </label>
  <label>支路 R₂ = <span id="r2Val">15.0</span> Ω
    <input type="range" id="r2Range" min="2" max="30" value="15" step="1">
  </label>
  <div class="readout" id="readout"></div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var U = 6, R1 = 10, R2 = 15, offset = 0;
  var isClosed = true, showMeter = true;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var I1 = isClosed ? U / R1 : 0;
    var I2 = isClosed ? U / R2 : 0;
    var It = I1 + I2;

    var left = W * 0.25, right = W * 0.75, top = H * 0.25, mid = H * 0.45, bot = H * 0.7;
    var midX = (left + right) / 2;

    // 导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.rect(left, top, right - left, bot - top); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(midX, top); ctx.lineTo(midX, mid); ctx.lineTo(right, mid); ctx.lineTo(right, top); ctx.stroke();

    // 电源
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(left - 8, (top + bot) / 2 - 20, 16, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(left - 8, (top + bot) / 2 - 20, 16, 40);

    // 灯泡
    drawBulb(midX, top, I1, 'R₁=' + R1 + 'Ω');
    drawBulb(midX, mid, I2, 'R₂=' + R2 + 'Ω');

    // 开关
    var swY = (top + bot) / 2;
    drawSwitch(left, swY);

    // 电表
    if (showMeter) {
      drawMeter(left + 40, bot + 40, 'A', It.toFixed(2) + ' A', 3);
    }

    // 粒子
    if (isClosed && It > 0) {
      offset = (offset + It * 0.4) % 40;
      ctx.fillStyle = '#f39c12';
      for (var y = top; y < bot; y += 40) drawDot(left, y + offset);
      for (var x = left; x < midX; x += 40) drawDot(x + offset, bot);
      for (var x1 = midX; x1 < right; x1 += (40 / (I1 / It))) drawDot(x1, top);
      for (var x2 = midX; x2 < right; x2 += (40 / (I2 / It))) drawDot(x2, mid);
    }

    document.getElementById('readout').innerHTML = isClosed ?
      '总电流 I = <b>' + It.toFixed(2) + '</b> A<br>' +
      '支路1 I₁ = <b>' + I1.toFixed(2) + '</b> A<br>' +
      '支路2 I₂ = <b>' + I2.toFixed(2) + '</b> A'
      :
      '<b style="color:#e74c3c;">开关断开，电路无电流</b>';

    requestAnimationFrame(draw);
  }

  function drawBulb(cx, cy, current, text) {
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 15, cy - 10, 30, 20); ctx.strokeRect(cx - 15, cy - 10, 30, 20);
    ctx.fillStyle = '#2c3e50'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, cx, cy - 20);

    var r = 12;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = current > 0 ? '#f1c40f' : '#bdc3c7';
    ctx.fill(); ctx.stroke();

    if (current > 0) {
      var glow = ctx.createRadialGradient(cx, cy, r, cx, cy, r + current * 15);
      glow.addColorStop(0, 'rgba(241, 196, 15, 0.6)');
      glow.addColorStop(1, 'rgba(241, 196, 15, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, r + current * 15, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawSwitch(cx, cy) {
    ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(cx - 25, cy - 25, 50, 50);
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(cx, cy - 20, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + 20, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = isClosed ? '#27ae60' : '#e74c3c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx, cy - 20);
    if (isClosed) ctx.lineTo(cx, cy + 20); else ctx.lineTo(cx + 20, cy + 10);
    ctx.stroke(); ctx.restore();
  }

  function drawMeter(cx, cy, label, text, maxVal) {
    var r = 30;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 2; ctx.stroke();
    for(var i=0; i<=10; i++) {
      var a = Math.PI + (Math.PI/10)*i;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(r-5), cy+Math.sin(a)*(r-5));
      ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke();
    }
    var val = parseFloat(text);
    var angle = Math.PI + (Math.PI * Math.min(1, val / maxVal));
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle)*(r-8), cy + Math.sin(angle)*(r-8));
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, cx, cy - 10);
    ctx.fillStyle = '#e74c3c'; ctx.font = '12px sans-serif'; ctx.fillText(text, cx, cy + 15);
    ctx.restore();
  }

  function drawDot(x, y) { ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); }

  canvas.addEventListener('pointerdown', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var left = W * 0.25, top = H * 0.25, bot = H * 0.7;
    var swY = (top + bot) / 2;
    if (Math.abs(mx - left) < 30 && Math.abs(my - swY) < 30) {
      isClosed = !isClosed;
      document.getElementById('switchToggle').checked = isClosed;
    }
  });

  document.getElementById('switchToggle').addEventListener('change', function(e) { isClosed = e.target.checked; });
  document.getElementById('showMeter').addEventListener('change', function(e) { showMeter = e.target.checked; });
  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U; });
  document.getElementById('r1Range').addEventListener('input', function(e){ R1 = parseFloat(e.target.value); document.getElementById('r1Val').textContent = R1; });
  document.getElementById('r2Range').addEventListener('input', function(e){ R2 = parseFloat(e.target.value); document.getElementById('r2Val').textContent = R2; });

  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
</body>
</html>
