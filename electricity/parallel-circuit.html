<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>并联电路 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>并联电路</h1>

<div class="lab">
<aside class="lab-side">
  <!-- 顶部规律表格 -->
  <table class="case-table">
    <thead>
      <tr><th>规律</th><th>关系</th></tr>
    </thead>
    <tbody>
      <tr class="active"><td>电压</td><td>U = U₁ = U₂</td></tr>
      <tr class="active"><td>电流</td><td>I = I₁ + I₂</td></tr>
      <tr class="active"><td>电阻</td><td>1/R = 1/R₁ + 1/R₂</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  
  <div class="row" style="margin-bottom:10px;">
    <input type="checkbox" id="switchToggle" checked>
    <label for="switchToggle" style="margin:0; cursor:pointer; font-weight:bold; color:#2c3e50;">闭合总开关</label>
  </div>
  
  <label>电源电压 U = <span id="uVal">12.0</span> V
    <input type="range" id="uRange" min="1" max="24" value="12" step="0.5">
  </label>
  
  <label>灯泡 L₁ 电阻 = <span id="r1Val">10.0</span> Ω
    <input type="range" id="r1Range" min="2" max="30" value="10" step="1">
  </label>
  
  <label>灯泡 L₂ 电阻 = <span id="r2Val">20.0</span> Ω
    <input type="range" id="r2Range" min="2" max="30" value="20" step="1">
  </label>

  <div class="readout" id="readout" style="margin-top:16px;"></div>
  <div style="font-size:12px; color:#888; margin-top:10px; line-height:1.5;">
    💡 <b>画布交互：</b><br>
    1. 点击开关可通/断电。<br>
    2. 拖动干路变阻器滑片改变总电流。<br>
    3. 点击各支路灯泡可模拟“断路烧毁”。
  </div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  
  // 物理参数
  var U = 12, R1 = 10, R2 = 20, Rv = 2; // Rv 是干路变阻器
  var isClosed = true, isBurnt1 = false, isBurnt2 = false;

  // 动画参数
  var offset1 = 0, offset2 = 0; // 上下支路粒子偏移
  var needleA = -Math.PI/2, needleA1 = -Math.PI/2, needleA2 = -Math.PI/2, needleV = -Math.PI/2;
  var targetA = -Math.PI/2, targetA1 = -Math.PI/2, targetA2 = -Math.PI/2, targetV = -Math.PI/2;
  
  // 交互热区
  var swBox = {x:0, y:0, w:0, h:0};
  var sliderBox = {x:0, y:0, w:0, h:0, val: Rv};
  var bulb1Pos = {x:0, y:0}, bulb2Pos = {x:0, y:0};
  var isDragging = false;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    // 物理计算：并联总电阻
    let R1_eff = isBurnt1 ? Infinity : R1;
    let R2_eff = isBurnt2 ? Infinity : R2;
    let Req = (R1_eff === Infinity && R2_eff === Infinity) ? Infinity : 1 / (1/R1_eff + 1/R2_eff);
    
    let R_total = Infinity;
    if (Req !== Infinity) R_total = Rv + Req;

    let I_total = (isClosed && R_total !== Infinity) ? U / R_total : 0;
    let U_branch = I_total * (Req === Infinity ? 0 : Req); // 并联部分两端电压
    
    let I1 = isBurnt1 ? 0 : U_branch / R1;
    let I2 = isBurnt2 ? 0 : U_branch / R2;
    let Uv = I_total * Rv;

    // 指针缓动逻辑
    targetA = -Math.PI/2 + Math.PI * Math.min(1, I_total / 3); // 量程 3A
    targetA1 = -Math.PI/2 + Math.PI * Math.min(1, I1 / 3);
    targetA2 = -Math.PI/2 + Math.PI * Math.min(1, I2 / 3);
    targetV = -Math.PI/2 + Math.PI * Math.min(1, U_branch / 24); // 量程 24V

    needleA += (targetA - needleA) * 0.15;
    needleA1 += (targetA1 - needleA1) * 0.15;
    needleA2 += (targetA2 - needleA2) * 0.15;
    needleV += (targetV - needleV) * 0.15;

    // --- 布局参数 ---
    var left = W * 0.2, right = W * 0.75;
    var top = H * 0.3, mid = H * 0.5, bot = H * 0.7;
    var midX = (left + right) / 2;

    // ================= 1. 画导线 =================
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    // 主回路外框
    ctx.beginPath(); ctx.rect(left, top, right - left, bot - top); ctx.stroke();
    // 中间并联支路分隔线
    ctx.beginPath(); ctx.moveTo(left, mid); ctx.lineTo(right, mid); ctx.stroke();

    // ================= 2. 画电源 =================
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(left - 6, mid - 20, 12, 15); 
    ctx.fillRect(left - 12, mid + 5, 24, 8);  
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('+', left - 20, mid - 10);
    ctx.fillText('-', left - 20, mid + 12);
    ctx.fillStyle = '#333'; ctx.fillText('U='+U+'V', left - 25, mid + 35);

    // ================= 3. 画滑动变阻器 (在左侧干路) =================
    var sW = 16, sH = 80, sX = left - 8, sY = bot - 90;
    sliderBox = {x: sX, y: sY, w: sW, h: sH, val: Rv};
    var sliderPos = sY + sH - (Rv / 20) * sH; // 假设变阻器最大 20欧

    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(sX, sY, sW, sH); ctx.strokeRect(sX, sY, sW, sH);
    
    // 滑片
    ctx.fillStyle = isDragging ? '#e74c3c' : '#3498db';
    ctx.beginPath(); 
    ctx.moveTo(sX, sliderPos); 
    ctx.lineTo(sX - 12, sliderPos - 8); 
    ctx.lineTo(sX - 12, sliderPos + 8); 
    ctx.fill();
    
    ctx.fillStyle = '#2c3e50'; ctx.textAlign = 'right'; ctx.font = '12px sans-serif';
    ctx.fillText('Rv='+Rv+'Ω', sX - 18, sY + 40);

    // ================= 4. 画灯泡 (在上下支路) =================
    bulb1Pos = {x: midX, y: top};
    bulb2Pos = {x: midX, y: mid};
    drawBulb(bulb1Pos.x, bulb1Pos.y, I1, 'L₁=' + R1 + 'Ω', isBurnt1);
    drawBulb(bulb2Pos.x, bulb2Pos.y, I2, 'L₂=' + R2 + 'Ω', isBurnt2);

    // ================= 5. 画开关 (在左侧上方) =================
    var swX = left, swY = (top + mid) / 2;
    swBox = {x: swX, y: swY, w: 30, h: 30};
    drawSwitch(swX, swY);

    // ================= 6. 画电表 =================
    // 总电流表 A (右侧中线)
    drawMeter(right, mid, 'A', I_total.toFixed(2) + ' A', needleA);
    // 支路电流表 A1 (上方偏左)
    drawMeter(left + (right-left)*0.3, top, 'A₁', I1.toFixed(2) + ' A', needleA1);
    // 支路电流表 A2 (中线偏左)
    drawMeter(left + (right-left)*0.3, mid, 'A₂', I2.toFixed(2) + ' A', needleA2);
    // 电压表 V (右上角并联在电源两端，这里画在图表旁边)
    drawMeter(W * 0.88, top, 'V', U_branch.toFixed(1) + ' V', needleV);

    // ================= 7. 画电流分布柱状图 =================
    drawCurrentChart(W * 0.82, mid + 20, W * 0.12, H * 0.25, I_total, I1, I2, U);

    // ================= 8. 粒子动画 =================
    if (isClosed && I_total > 0) {
      // 干路粒子速度
      offset1 = (offset1 + I_total * 0.5) % 30;
      // 画干路
      drawLineParticles(left, bot, left, mid, offset1); // 下半截
      drawLineParticles(left, mid, left, top, offset1); // 上半截
      
      // 画支路
      if (!isBurnt1 && I1 > 0) {
        offset2 = (offset2 + I1 * 0.5) % 30;
        drawLineParticles(left, top, right, top, offset2);
      }
      if (!isBurnt2 && I2 > 0) {
        offset2 = (offset2 + I2 * 0.5) % 30;
        drawLineParticles(left, mid, right, mid, offset2);
      }
      
      // 画右侧汇聚下落
      drawLineParticles(right, top, right, bot, offset1);
    }

    // 更新侧边栏
    var readout = document.getElementById('readout');
    if (!isClosed) {
      readout.innerHTML = '<b style="color:#e74c3c;">总开关断开，无电流。</b>';
    } else if (isBurnt1 && isBurnt2) {
      readout.innerHTML = '<b style="color:#e74c3c;">⚠️ 支路全断，电路无电流。</b>';
    } else {
      readout.innerHTML =
        '干路总电流 I = <b>' + I_total.toFixed(2) + '</b> A<br>' +
        '支路电流 I₁ = <b>' + I1.toFixed(2) + '</b> A<br>' +
        '支路电流 I₂ = <b>' + I2.toFixed(2) + '</b> A<br>' +
        '各支路电压 U = <b>' + U_branch.toFixed(2) + '</b> V<br>' +
        '<span style="font-size:12px;color:#888;">总电阻 R总 = '+ (R_total === Infinity ? '∞' : R_total.toFixed(2)) +' Ω</span>';
    }

    requestAnimationFrame(draw);
  }

  // --- 绘图函数细节 ---

  function drawBulb(cx, cy, current, text, burnt) {
    // 底座
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 8, cy - 15, 16, 30); ctx.strokeRect(cx - 8, cy - 15, 16, 30);
    ctx.fillStyle = '#2c3e50'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(text, cx + 15, cy + 5);

    // 光晕
    if (current > 0 && !burnt) {
      var glow = ctx.createRadialGradient(cx, cy, 5, cx, cy, 25 + current * 15);
      glow.addColorStop(0, 'rgba(241, 196, 15, 0.6)');
      glow.addColorStop(1, 'rgba(241, 196, 15, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, 25 + current * 15, 0, Math.PI * 2); ctx.fill();
    }

    // 玻璃体
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.fillStyle = burnt ? '#333' : (current > 0 ? '#f1c40f' : '#bdc3c7');
    ctx.fill(); ctx.stroke();
    
    // 灯丝
    if (burnt) {
      ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx - 2, cy + 3); 
      ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 2, cy + 3);
    } else {
      ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx, cy + 6); ctx.lineTo(cx + 5, cy); 
    }
    ctx.strokeStyle = burnt ? '#e74c3c' : (current > 0 ? '#e67e22' : '#7f8c8d'); ctx.stroke();
  }

  function drawSwitch(cx, cy) {
    ctx.save(); 
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 20, cy - 20, 40, 30);
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(cx, cy - 15, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + 15, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = isClosed ? '#27ae60' : '#e74c3c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx, cy - 15);
    if (isClosed) ctx.lineTo(cx, cy + 15); else ctx.lineTo(cx + 20, cy + 5);
    ctx.stroke(); ctx.restore();
  }

  function drawMeter(cx, cy, label, text, angle) {
    var r = 20;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 2; ctx.stroke();
    
    for(var i=0; i<=10; i++) {
      var a = Math.PI + (Math.PI/10)*i;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(r-4), cy+Math.sin(a)*(r-4));
      ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle)*(r-6), cy + Math.sin(angle)*(r-6));
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fillStyle = '#34495e'; ctx.fill();

    ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, cx, cy - 4);
    ctx.fillStyle = '#e74c3c'; ctx.font = '10px sans-serif'; ctx.fillText(text, cx, cy + 12);
    ctx.restore();
  }

  function drawCurrentChart(x, y, w, h, it, i1, i2, totalU) {
    if (it === 0 && totalU === 0) return;
    ctx.save();
    ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    
    var maxH = h - 30;
    var maxVal = Math.max(it, 0.1);
    var barW = w / 4.5;
    var gap = (w - barW*3) / 4;
    
    var bars = [
      { val: i1, color: '#3b82f6', label: 'I₁' },
      { val: i2, color: '#10b981', label: 'I₂' },
      { val: it, color: '#f59e0b', label: 'I' }
    ];

    bars.forEach(function(b, i) {
      var bx = x + gap + i * (barW + gap);
      var bh = (b.val / maxVal) * maxH;
      if (bh < 2 && b.val > 0) bh = 2; 
      
      ctx.fillStyle = b.color;
      ctx.fillRect(bx, y + h - 20 - bh, barW, bh);
      
      ctx.fillStyle = '#475569'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.label, bx + barW/2, y + h - 5);
      ctx.fillText(b.val.toFixed(1) + 'A', bx + barW/2, y + h - 25 - bh);
    });
    
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif';
    ctx.fillText('电流分配', x + w/2, y + 15);
    ctx.restore();
  }

  function drawLineParticles(x1, y1, x2, y2, off) {
    var len = Math.hypot(x2 - x1, y2 - y1); if (len === 0) return;
    var dx = (x2 - x1) / len, dy = (y2 - y1) / len;
    ctx.fillStyle = '#f39c12';
    for (var d = 0; d <= len; d += 30) {
      var dist = (d + off) % len;
      ctx.beginPath(); ctx.arc(x1 + dx * dist, y1 + dy * dist, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  // --- 交互事件 ---
  canvas.addEventListener('pointerdown', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;

    // 1. 点击开关 (左侧)
    if (mx > swBox.x - 20 && mx < swBox.x + 20 && my > swBox.y - 25 && my < swBox.y + 25) {
      isClosed = !isClosed; 
      document.getElementById('switchToggle').checked = isClosed;
      return;
    }

    // 2. 点击灯泡烧毁 (识别是 L1 还是 L2)
    if (Math.hypot(mx - bulb1Pos.x, my - bulb1Pos.y) < 20) { isBurnt1 = !isBurnt1; return; }
    if (Math.hypot(mx - bulb2Pos.x, my - bulb2Pos.y) < 20) { isBurnt2 = !isBurnt2; return; }

    // 3. 拖拽变阻器 (左侧垂直)
    if (mx > sliderBox.x - 20 && mx < sliderBox.x + sliderBox.w + 20 && my > sliderBox.y - 20 && my < sliderBox.y + sliderBox.h + 20) {
      isDragging = true;
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var rect = canvas.getBoundingClientRect();
    var my = e.clientY - rect.top;
    var ratio = 1 - (my - sliderBox.y) / sliderBox.h;
    ratio = Math.max(0, Math.min(1, ratio));
    Rv = Math.round(ratio * 20); // 0~20欧
  });

  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);

  // --- 侧边栏交互 ---
  document.getElementById('switchToggle').addEventListener('change', function(e) { isClosed = e.target.checked; });
  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U.toFixed(1); });
  document.getElementById('r1Range').addEventListener('input', function(e){ R1 = parseFloat(e.target.value); document.getElementById('r1Val').textContent = R1.toFixed(1); });
  document.getElementById('r2Range').addEventListener('input', function(e){ R2 = parseFloat(e.target.value); document.getElementById('r2Val').textContent = R2.toFixed(1); });

  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
</body>
</html>
