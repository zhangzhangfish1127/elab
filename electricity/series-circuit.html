<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串联电路 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>串联电路</h1>
<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>规律</th><th>关系</th></tr></thead>
    <tbody>
      <tr class="active"><td>电流</td><td>I₁ = I₂ = I总</td></tr>
      <tr class="active"><td>电压</td><td>U总 = U₁ + U₂</td></tr>
    </tbody>
  </table>
  <h3>控制面板</h3>
  <label>电源电压 U = <span id="uVal">6.0</span> V
    <input type="range" id="uRange" min="1" max="12" value="6" step="0.5">
  </label>
  <label>电阻 R₁ = <span id="r1Val">5.0</span> Ω
    <input type="range" id="r1Range" min="1" max="20" value="5" step="0.5">
  </label>
  <label>电阻 R₂ = <span id="r2Val">10.0</span> Ω
    <input type="range" id="r2Range" min="1" max="20" value="10" step="0.5">
  </label>
  <div class="readout" id="readout"></div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var U = 6, R1 = 5, R2 = 10, offset = 0;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var I = U / (R1 + R2);
    var U1 = I * R1;
    var U2 = I * R2;

    var left = W * 0.2, right = W * 0.8, top = H * 0.3, bot = H * 0.7;

    // 画导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.rect(left, top, right - left, bot - top); ctx.stroke();

    // 电源
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(left - 8, (top + bot) / 2 - 20, 16, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(left - 8, (top + bot) / 2 - 20, 16, 40);
    ctx.fillStyle = '#333'; ctx.font = '14px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('U', left - 15, (top + bot) / 2 + 5);

    // 电阻
    drawResistor(left + (right - left) * 0.25, top, 'R₁=' + R1 + 'Ω');
    drawResistor(left + (right - left) * 0.75, top, 'R₂=' + R2 + 'Ω');

    // 电流粒子动画
    var speed = I * 0.3;
    offset = (offset + speed) % 40;
    ctx.fillStyle = '#f39c12';
    for (var x = left; x < right; x += 40) drawDot(x + offset, top);
    for (var y = top; y < bot; y += 40) drawDot(right, y + offset);
    for (var x2 = right; x2 > left; x2 -= 40) drawDot(x2 - offset, bot);
    for (var y2 = bot; y2 > top; y2 -= 40) drawDot(left, y2 - offset);

    document.getElementById('readout').innerHTML =
      '总电阻 R = R₁ + R₂ = <b>' + (R1 + R2).toFixed(1) + '</b> Ω<br>' +
      '总电流 I = U/R = <b>' + I.toFixed(2) + '</b> A<br>' +
      'R₁电压 U₁ = <b>' + U1.toFixed(2) + '</b> V<br>' +
      'R₂电压 U₂ = <b>' + U2.toFixed(2) + '</b> V';

    requestAnimationFrame(draw);
  }

  function drawResistor(cx, cy, text) {
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 30, cy - 10, 60, 20); ctx.strokeRect(cx - 30, cy - 10, 60, 20);
    ctx.fillStyle = '#2c3e50'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, cx, cy - 20);
  }
  function drawDot(x, y) {
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  }

  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U; });
  document.getElementById('r1Range').addEventListener('input', function(e){ R1 = parseFloat(e.target.value); document.getElementById('r1Val').textContent = R1; });
  document.getElementById('r2Range').addEventListener('input', function(e){ R2 = parseFloat(e.target.value); document.getElementById('r2Val').textContent = R2; });

  window.addEventListener('resize', resize);
  
  // 启动
  resize();
  draw();
})();
</script>
</body>
</html>
