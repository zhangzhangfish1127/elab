<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串联电路 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>串联电路</h1>
<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>规律</th><th>关系</th></tr></thead>
    <tbody>
      <tr class="active"><td>电流</td><td>I₁ = I₂ = I总</td></tr>
      <tr class="active"><td>电压</td><td>U总 = U₁ + U₂</td></tr>
    </tbody>
  </table>
  <h3>控制面板</h3>
  <div class="row" style="margin-bottom:8px;">
    <input type="checkbox" id="switchToggle" checked>
    <label for="switchToggle" style="margin:0; cursor:pointer; font-weight:bold;">闭合开关（通路）</label>
  </div>
  <div class="row" style="margin-bottom:12px;">
    <input type="checkbox" id="showMeter" checked>
    <label for="showMeter" style="margin:0; cursor:pointer; font-weight:bold;">显示电表</label>
  </div>
  <label>电源电压 U = <span id="uVal">6.0</span> V
    <input type="range" id="uRange" min="1" max="12" value="6" step="0.5">
  </label>
  <label>电阻 R₁ = <span id="r1Val">5.0</span> Ω
    <input type="range" id="r1Range" min="1" max="20" value="5" step="0.5">
  </label>
  <label>电阻 R₂ = <span id="r2Val">10.0</span> Ω
    <input type="range" id="r2Range" min="1" max="20" value="10" step="0.5">
  </label>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var U = 6, R1 = 5, R2 = 10, offset = 0;
  var isClosed = true, showMeter = true;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var I = isClosed ? U / (R1 + R2) : 0;
    var U1 = I * R1, U2 = I * R2;

    var left = W * 0.25, right = W * 0.75, top = H * 0.35, bot = H * 0.7;
    var midX = (left + right) / 2;

    // 导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.rect(left, top, right - left, bot - top); ctx.stroke();

    // 电源 (画在左侧)
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(left - 4, (top + bot) / 2 - 20, 8, 15); // 长线
    ctx.fillRect(left - 8, (top + bot) / 2 + 5, 16, 8);  // 短线
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('+', left - 12, (top + bot) / 2 - 10);
    ctx.fillText('-', left - 12, (top + bot) / 2 + 12);
    ctx.fillStyle = '#333'; ctx.fillText('U='+U+'V', left - 20, (top + bot) / 2 + 30);

    // 电阻
    drawResistor(left + (right - left) * 0.25, top, 'R₁=' + R1 + 'Ω');
    drawResistor(left + (right - left) * 0.75, top, 'R₂=' + R2 + 'Ω');

    // 电表
    if (showMeter) {
      drawMeter(left + (right - left) * 0.5, bot, 'A', I.toFixed(2) + 'A', true);
      drawMeter(left + (right - left) * 0.25, top - 40, 'V', U1.toFixed(1) + 'V', false);
      drawMeter(left + (right - left) * 0.75, top - 40, 'V', U2.toFixed(1) + 'V', false);
    }

    // 开关
    drawSwitch(midX, bot);

    // 粒子动画
    if (isClosed && I > 0) {
      offset = (offset + I * 0.4) % 30;
      drawLineParticles(left, top, right, top, offset);
      drawLineParticles(right, top, right, bot, offset);
      drawLineParticles(right, bot, left, bot, offset);
      drawLineParticles(left, bot, left, top, offset);
    }

    requestAnimationFrame(draw);
  }

  function drawLineParticles(x1, y1, x2, y2, off) {
    var len = Math.hypot(x2 - x1, y2 - y1);
    var dx = (x2 - x1) / len, dy = (y2 - y1) / len;
    ctx.fillStyle = '#f39c12';
    for (var d = 0; d <= len; d += 30) {
      var dist = (d + off) % len;
      ctx.beginPath(); ctx.arc(x1 + dx * dist, y1 + dy * dist, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawResistor(cx, cy, text) {
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 20, cy - 8, 40, 16); ctx.strokeRect(cx - 20, cy - 8, 40, 16);
    ctx.fillStyle = '#2c3e50'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, cx, cy + 25);
  }

  function drawMeter(cx, cy, label, val, onWire) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy);
    ctx.textBaseline = 'top';
    ctx.fillText(val, cx, cy + 18);
  }

  function drawSwitch(cx, cy) {
    ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(cx - 15, cy - 15, 30, 30);
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(cx - 10, cy, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 10, cy, 3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = isClosed ? '#27ae60' : '#e74c3c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - 10, cy);
    if (isClosed) ctx.lineTo(cx + 10, cy); else ctx.lineTo(cx + 5, cy - 10);
    ctx.stroke(); ctx.restore();
  }

  canvas.addEventListener('pointerdown', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var left = W * 0.25, right = W * 0.75, bot = H * 0.7;
    if (Math.abs(mx - (left + right) / 2) < 20 && Math.abs(my - bot) < 20) {
      isClosed = !isClosed; document.getElementById('switchToggle').checked = isClosed;
    }
  });

  document.getElementById('switchToggle').addEventListener('change', function(e) { isClosed = e.target.checked; });
  document.getElementById('showMeter').addEventListener('change', function(e) { showMeter = e.target.checked; });
  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U; });
  document.getElementById('r1Range').addEventListener('input', function(e){ R1 = parseFloat(e.target.value); document.getElementById('r1Val').textContent = R1; });
  document.getElementById('r2Range').addEventListener('input', function(e){ R2 = parseFloat(e.target.value); document.getElementById('r2Val').textContent = R2; });

  window.addEventListener('resize', resize); resize(); draw();
})();
</script>
</body>
</html>
