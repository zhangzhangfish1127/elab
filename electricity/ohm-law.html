<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欧姆定律变化曲线图 · ijhub</title>

  <style>
    * { box-sizing: border-box; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --green: #059669;
      --orange: #ea580c;
      --red: #dc2626;
      --text: #172033;
      --muted: #64748b;
      --border: #d8e0ea;
      --background: #f3f6fb;
      --panel: rgba(255, 255, 255, 0.96);
      --shadow: 0 14px 40px rgba(30, 64, 175, 0.10);
    }
    body {
      margin: 0; padding: 20px;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      background: radial-gradient(circle at top left, #dbeafe 0, transparent 32%),
                  radial-gradient(circle at top right, #e0e7ff 0, transparent 30%),
                  var(--background);
    }
    button, select, input { font: inherit; }
    
    /* 顶部导航与基础框架 */
    .page { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    .header {
      position: relative; overflow: hidden; margin-bottom: 20px; padding: 28px 30px;
      color: #fff; border-radius: 22px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.97), rgba(79, 70, 229, 0.93));
      box-shadow: var(--shadow);
    }
    .header h1 { position: relative; z-index: 1; margin: 0 0 10px; font-size: clamp(27px, 4vw, 42px); }
    .header p { position: relative; z-index: 1; margin: 0; color: rgba(255, 255, 255, 0.88); font-size: 15px; }
    .formula-badges { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .formula-badge { padding: 7px 14px; border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; background: rgba(255,255,255,0.13); font-weight: 700; }

    .layout { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel { border: 1px solid rgba(216, 224, 234, 0.85); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
    .controls { position: sticky; top: 18px; padding: 22px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 18px; font-size: 20px; }
    .tag { color: var(--primary); font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: var(--primary-light); }
    
    .section { padding: 16px 0; border-top: 1px solid #edf1f6; }
    .section:first-of-type { padding-top: 0; border-top: 0; }
    .section-title { margin-bottom: 12px; color: #334155; font-size: 14px; font-weight: 800; }
    .field { margin-bottom: 13px; }
    .field label { display: flex; justify-content: space-between; margin-bottom: 7px; color: #475569; font-size: 13px; font-weight: 700; }
    input, select { width: 100%; min-height: 42px; padding: 9px 11px; color: var(--text); border: 1px solid var(--border); border-radius: 10px; outline: none; background: #fff; }
    input:disabled { color: #94a3b8; background: #f1f5f9; }
    .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-with-unit { position: relative; }
    .unit { position: absolute; right: 12px; top: 50%; color: var(--muted); font-size: 13px; transform: translateY(-50%); pointer-events: none; }
    
    .checkbox-row { display: flex; align-items: center; gap: 9px; color: #475569; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    .checkbox-row input { width: 17px; min-height: auto; height: 17px; accent-color: var(--primary); }
    
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .button { min-height: 42px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 800; transition: 0.18s; }
    .button-primary { color: #fff; background: var(--primary); }
    .button-primary:hover { background: var(--primary-dark); }
    .button-secondary { color: #334155; border: 1px solid var(--border); background: #fff; }
    
    .quick-buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .quick-button { padding: 6px 10px; color: #475569; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; }
    .quick-button:hover { color: var(--primary); border-color: var(--primary); background: #eff6ff; }

    .content { min-width: 0; }
    .chart-panel { padding: 20px; }
    .chart-toolbar { display: flex; justify-content: space-between; margin-bottom: 14px; }
    .chart-toolbar h2 { margin: 0; font-size: 20px; }
    .chart-toolbar p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    
    .canvas-wrap { position: relative; width: 100%; height: 550px; overflow: hidden; border: 1px solid #e5eaf1; border-radius: 16px; background: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    
    .tooltip { position: absolute; z-index: 5; display: none; min-width: 160px; padding: 10px 12px; color: #fff; border-radius: 10px; background: rgba(15, 23, 42, 0.93); box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25); font-size: 12px; line-height: 1.7; pointer-events: none; }
    .tooltip strong { color: #93c5fd; }
    
    .status { display: flex; gap: 10px; margin-top: 14px; padding: 12px 14px; color: #334155; border: 1px solid #bfdbfe; border-radius: 12px; background: #eff6ff; font-size: 13px; }
    .status.error { color: #991b1b; border-color: #fecaca; background: #fef2f2; }
    .status-icon { flex: 0 0 auto; width: 20px; height: 20px; color: #fff; border-radius: 50%; background: var(--primary); text-align: center; line-height: 20px; font-weight: 900; }
    
    .table-panel { margin-top: 20px; padding: 20px; }
    .table-wrap { max-height: 360px; overflow: auto; border: 1px solid #e5eaf1; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 14px; border-bottom: 1px solid #edf1f6; text-align: right; }
    th { position: sticky; top: 0; z-index: 1; color: #334155; background: #f8fafc; font-weight: 800; }
    th:first-child, td:first-child { text-align: center; }

    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }
      .controls { position: static; }
      .canvas-wrap { height: 450px; }
    }
  </style>
</head>
<body>
<main class="page">
  <header class="header">
    <h1>欧姆定律变化曲线图</h1>
    <p>自由选择横轴和纵轴所代表的物理量，设置第三个固定物理量，即可观察变化关系。你可以直接在下方左侧画布中拖动滑动变阻器。</p>
    <div class="formula-badges">
      <span class="formula-badge">电压 = 电流 × 电阻</span>
      <span class="formula-badge">电流 = 电压 ÷ 电阻</span>
      <span class="formula-badge">电阻 = 电压 ÷ 电流</span>
    </div>
  </header>

  <div class="layout">
    <aside class="panel controls">
      <h2 class="panel-title">参数设置 <span class="tag">实时绘图</span></h2>

      <section class="section">
        <div class="section-title">坐标轴选择</div>
        <div class="field">
          <label for="xVariable">横轴物理量</label>
          <select id="xVariable">
            <option value="I">电流 I（安培）</option>
            <option value="U">电压 U（伏特）</option>
            <option value="R">电阻 R（欧姆）</option>
          </select>
        </div>
        <div class="field">
          <label for="yVariable">纵轴物理量</label>
          <select id="yVariable">
            <option value="U">电压 U（伏特）</option>
            <option value="I">电流 I（安培）</option>
            <option value="R">电阻 R（欧姆）</option>
          </select>
        </div>
      </section>

      <section class="section">
        <div class="section-title">固定条件</div>
        <div class="field">
          <label for="fixedValue">
            <span id="fixedLabel">固定电阻</span>
            <span class="field-note" id="fixedSymbol">R</span>
          </label>
          <div class="input-with-unit">
            <input id="fixedValue" type="number" value="10" min="0.000001" step="any" />
            <span class="unit" id="fixedUnit">Ω</span>
          </div>
          <div class="quick-buttons" id="quickButtons"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">横轴数值范围</div>
        <div class="two-columns">
          <div class="field"><label for="xMin">最小值</label><div class="input-with-unit"><input id="xMin" type="number" value="0" step="any" /><span class="unit x-unit">A</span></div></div>
          <div class="field"><label for="xMax">最大值</label><div class="input-with-unit"><input id="xMax" type="number" value="5" step="any" /><span class="unit x-unit">A</span></div></div>
        </div>
        <div class="field">
          <label for="sampleCount">采样点数 <span class="field-note">20～500</span></label>
          <input id="sampleCount" type="number" value="101" min="20" max="500" step="1" />
        </div>
      </section>

      <section class="section">
        <div class="section-title">纵轴显示范围</div>
        <label class="checkbox-row"><input id="autoY" type="checkbox" checked /> 自动计算纵轴范围</label>
        <div class="two-columns" style="margin-top: 13px">
          <div class="field"><label for="yMin">最小值</label><div class="input-with-unit"><input id="yMin" type="number" value="0" step="any" disabled /><span class="unit y-unit">V</span></div></div>
          <div class="field"><label for="yMax">最大值</label><div class="input-with-unit"><input id="yMax" type="number" value="50" step="any" disabled /><span class="unit y-unit">V</span></div></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">曲线样式</div>
        <div class="field"><label for="lineColor">曲线颜色</label><input id="lineColor" type="color" value="#2563eb" style="padding: 5px" /></div>
        <label class="checkbox-row"><input id="showPoints" type="checkbox" /> 显示所有采样点</label>
        <label class="checkbox-row"><input id="showGrid" type="checkbox" checked /> 显示坐标网格</label>
      </section>

      <div class="button-row">
        <button class="button button-primary" id="drawButton">重新绘制</button>
        <button class="button button-secondary" id="resetButton">恢复默认</button>
      </div>
    </aside>

    <section class="content">
      <div class="panel chart-panel">
        <div class="chart-toolbar">
          <div>
            <h2 id="chartTitle">电压随电流变化曲线</h2>
            <p id="chartSubtitle">固定电阻 R = 10 Ω</p>
          </div>
          <div class="legend"><span class="legend-line" id="legendLine" style="display:inline-block; width:27px; height:4px; border-radius:99px; background:#2563eb;"></span> <span id="legendText" style="font-weight:bold; color:#475569; margin-left:8px;">欧姆定律曲线</span></div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="chartCanvas"></canvas>
          <div class="tooltip" id="tooltip"></div>
        </div>

        <div class="status" id="statusBox">
          <span class="status-icon">i</span>
          <span id="statusText">拖动左侧滑动变阻器，曲线和表格会实时更新。</span>
        </div>
      </div>

      <div class="panel table-panel">
        <div class="table-toolbar"><h2>曲线数据</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>序号</th><th id="tableXHeader">电流 I（A）</th><th id="tableYHeader">电压 U（V）</th></tr></thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
  const variableInfo = {
    U: { name: "电压", symbol: "U", unit: "V" },
    I: { name: "电流", symbol: "I", unit: "A" },
    R: { name: "电阻", symbol: "R", unit: "Ω" }
  };

  const presets = { U: [1.5, 5, 12, 24, 220], I: [0.1, 0.5, 1, 2, 5], R: [1, 10, 100, 1000, 10000] };
  const defaultRanges = { I: [0, 5], U: [0, 50], R: [1, 100] };

  const elements = {
    xVariable: document.getElementById("xVariable"), yVariable: document.getElementById("yVariable"),
    fixedValue: document.getElementById("fixedValue"), fixedLabel: document.getElementById("fixedLabel"),
    fixedSymbol: document.getElementById("fixedSymbol"), fixedUnit: document.getElementById("fixedUnit"),
    quickButtons: document.getElementById("quickButtons"),
    xMin: document.getElementById("xMin"), xMax: document.getElementById("xMax"),
    yMin: document.getElementById("yMin"), yMax: document.getElementById("yMax"), autoY: document.getElementById("autoY"),
    sampleCount: document.getElementById("sampleCount"),
    lineColor: document.getElementById("lineColor"), showPoints: document.getElementById("showPoints"), showGrid: document.getElementById("showGrid"),
    drawButton: document.getElementById("drawButton"), resetButton: document.getElementById("resetButton"),
    canvas: document.getElementById("chartCanvas"), canvasWrap: document.getElementById("canvasWrap"), tooltip: document.getElementById("tooltip"),
    chartTitle: document.getElementById("chartTitle"), chartSubtitle: document.getElementById("chartSubtitle"),
    statusBox: document.getElementById("statusBox"), statusText: document.getElementById("statusText"),
    tableXHeader: document.getElementById("tableXHeader"), tableYHeader: document.getElementById("tableYHeader"), dataTableBody: document.getElementById("dataTableBody")
  };

  const context = elements.canvas.getContext("2d");
  
  // 状态管理
  let chartState = {
    data: [], plot: null, cssWidth: 0, cssHeight: 0,
    xVariable: "I", yVariable: "U", fixedVariable: "R", xMin: 0, xMax: 5, yMin: 0, yMax: 50,
    circuitWidth: 0, sliderBox: null, dragging: false
  };

  function getFixedVariable(x, y) { return ["U", "I", "R"].find(v => v !== x && v !== y); }

  function calculateDependentValue(yVar, U, I, R) {
    if (yVar === "U") return I * R;
    if (yVar === "I") return R === 0 ? NaN : U / R;
    if (yVar === "R") return I === 0 ? NaN : U / I;
    return NaN;
  }

  function formatNumber(value) {
    if (!Number.isFinite(value)) return "无定义";
    const abs = Math.abs(value);
    if (abs !== 0 && (abs >= 1000000 || abs < 0.0001)) return value.toExponential(4);
    return new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 6 }).format(value);
  }

  function setStatus(message, isError = false) {
    elements.statusText.textContent = message;
    elements.statusBox.classList.toggle("error", isError);
    elements.statusBox.querySelector(".status-icon").textContent = isError ? "!" : "i";
  }

  function validateAxisSelection(changedAxis) {
    const x = elements.xVariable.value;
    const y = elements.yVariable.value;
    if (x !== y) return;
    const alts = ["U", "I", "R"].filter(v => v !== x);
    if (changedAxis === "x") elements.yVariable.value = alts[0];
    else elements.xVariable.value = alts[0];
  }

  function updateUnitLabels() {
    const x = elements.xVariable.value, y = elements.yVariable.value;
    document.querySelectorAll(".x-unit").forEach(el => el.textContent = variableInfo[x].unit);
    document.querySelectorAll(".y-unit").forEach(el => el.textContent = variableInfo[y].unit);
  }

  function updateQuickButtons(fixed) {
    elements.quickButtons.innerHTML = "";
    presets[fixed].forEach(v => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "quick-button";
      btn.textContent = formatNumber(v) + " " + variableInfo[fixed].unit;
      btn.onclick = () => { elements.fixedValue.value = v; drawChart(); };
      elements.quickButtons.appendChild(btn);
    });
  }

  function updateControls(changeRange = true) {
    const x = elements.xVariable.value, y = elements.yVariable.value, fixed = getFixedVariable(x, y);
    elements.fixedLabel.textContent = "固定" + variableInfo[fixed].name;
    elements.fixedSymbol.textContent = variableInfo[fixed].symbol;
    elements.fixedUnit.textContent = variableInfo[fixed].unit;

    if (changeRange) {
      const range = defaultRanges[x];
      elements.xMin.value = range[0]; elements.xMax.value = range[1];
      elements.fixedValue.value = { U: 12, I: 1, R: 10 }[fixed];
    }
    updateUnitLabels(); updateQuickButtons(fixed);
  }

  function generateData() {
    const x = elements.xVariable.value, y = elements.yVariable.value, fixed = getFixedVariable(x, y);
    const fixedVal = Number(elements.fixedValue.value);
    const xMin = Number(elements.xMin.value), xMax = Number(elements.xMax.value);
    let samples = Math.floor(Number(elements.sampleCount.value));

    if (xMax <= xMin) throw new Error("横轴最大值必须大于最小值。");
    if (!Number.isFinite(samples)) samples = 101;
    samples = Math.min(500, Math.max(20, samples));
    elements.sampleCount.value = samples;

    const data = [], step = (xMax - xMin) / (samples - 1);
    for (let i = 0; i < samples; i++) {
      const xv = i === samples - 1 ? xMax : xMin + step * i;
      const vals = { U: NaN, I: NaN, R: NaN };
      vals[x] = xv; vals[fixed] = fixedVal;
      const yv = calculateDependentValue(y, vals.U, vals.I, vals.R);
      data.push({ index: i + 1, x: xv, y: yv, valid: Number.isFinite(yv) });
    }
    return { data, xVariable: x, yVariable: y, fixedVariable: fixed, fixedValue: fixedVal, xMin, xMax };
  }

  function calculateYRange(data) {
    if (!elements.autoY.checked) {
      const min = Number(elements.yMin.value), max = Number(elements.yMax.value);
      if (max <= min) throw new Error("纵轴最大值必须大于最小值。");
      return [min, max];
    }
    const valid = data.filter(item => item.valid).map(item => item.y);
    if (!valid.length) throw new Error("当前参数无法产生有效数据，请调整数值范围。");

    let min = Math.min(...valid), max = Math.max(...valid);
    if (min === max) { min -= 1; max += 1; } 
    else {
      const pad = (max - min) * 0.08;
      min -= pad; max += pad;
    }
    if (min > 0 && min < max * 0.15) min = 0;
    elements.yMin.value = Number(min.toPrecision(8));
    elements.yMax.value = Number(max.toPrecision(8));
    return [min, max];
  }

  function niceNumber(range, round) {
    const exp = Math.floor(Math.log10(range)), frac = range / Math.pow(10, exp);
    let nice;
    if (round) nice = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
    else nice = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
    return nice * Math.pow(10, exp);
  }

  function createTicks(min, max, maxTicks = 8) {
    const range = niceNumber(max - min, false);
    const step = niceNumber(range / (maxTicks - 1), true);
    const niceMin = Math.floor(min / step) * step;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = niceMin; v <= niceMax + step * 0.5; v += step) {
      ticks.push(Number(v.toPrecision(12)));
      if (ticks.length > 50) break;
    }
    return ticks;
  }

  function resizeCanvas() {
    const rect = elements.canvasWrap.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    elements.canvas.width = Math.round(rect.width * dpr);
    elements.canvas.height = Math.round(rect.height * dpr);
    elements.canvas.style.width = rect.width + "px";
    elements.canvas.style.height = rect.height + "px";
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    chartState.cssWidth = rect.width; chartState.cssHeight = rect.height;
    // 左侧画电路图，占 40% 宽度
    chartState.circuitWidth = Math.max(200, rect.width * 0.4);
  }

  // ================= 绘制电路图 =================
  function drawCircuit() {
    const w = chartState.circuitWidth;
    const h = chartState.cssHeight;
    const fixed = getFixedVariable(elements.xVariable.value, elements.yVariable.value);
    const val = Number(elements.fixedValue.value);

    const p = { left: 40, right: w - 40, top: 50, bottom: h - 80 };
    if (p.right <= p.left) return;
    const cx = (p.left + p.right) / 2;

    // 导线
    context.strokeStyle = '#34495e'; context.lineWidth = 4; context.lineJoin = 'round';
    context.beginPath(); context.rect(p.left, p.top, p.right - p.left, p.bottom - p.top); context.stroke();

    // 电源
    context.fillStyle = '#f1c40f'; context.fillRect(p.left - 8, (p.top + p.bottom) / 2 - 20, 16, 40);
    context.strokeStyle = '#d35400'; context.lineWidth = 2; context.strokeRect(p.left - 8, (p.top + p.bottom) / 2 - 20, 16, 40);
    context.fillStyle = '#333'; context.font = '14px sans-serif'; context.textAlign = 'right';
    context.fillText('U', p.left - 15, (p.top + p.bottom) / 2 + 5);

    // 定值 R0
    context.fillStyle = '#ecf0f1'; context.strokeStyle = '#7f8c8d';
    context.fillRect(cx - 20, p.top - 8, 40, 16); context.strokeRect(cx - 20, p.top - 8, 40, 16);
    context.fillStyle = '#2c3e50'; context.font = '12px sans-serif'; context.textAlign = 'center';
    context.fillText('R₀=5Ω', cx, p.top - 15);

    // 滑动变阻器
    const sW = 100, sH = 16, sX = cx - sW / 2, sY = p.bottom - 8;
    const maxVal = fixed === 'R' ? 50 : (fixed === 'U' ? 24 : 5);
    const ratio = Math.max(0, Math.min(1, val / maxVal));
    const sliderPos = sX + ratio * sW;

    chartState.sliderBox = { x: sX, y: sY, w: sW, h: sH };

    context.fillStyle = '#ecf0f1'; context.strokeStyle = '#7f8c8d';
    context.fillRect(sX, sY, sW, sH); context.strokeRect(sX, sY, sW, sH);

    // 滑片
    context.fillStyle = chartState.dragging ? '#e74c3c' : '#3498db';
    context.beginPath();
    context.moveTo(sliderPos, sY);
    context.lineTo(sliderPos - 8, sY - 12);
    context.lineTo(sliderPos + 8, sY - 12);
    context.fill();

    context.fillStyle = '#2c3e50'; context.font = '12px sans-serif';
    let label = fixed === 'R' ? '变阻器' : (fixed === 'U' ? '电压源' : '恒流源');
    context.fillText(label + ' = ' + formatNumber(val) + variableInfo[fixed].unit, cx, sY + 30);
    context.fillStyle = '#888'; context.fillText('← 手指拖动 →', cx, sY - 35);
  }

  // ================= 绘制图表 =================
  function drawAxesAndGrid() {
    const width = chartState.cssWidth, height = chartState.cssHeight;
    
    // 图表必须避开左侧电路图区域
    const plot = {
      left: chartState.circuitWidth + 40,
      right: width - 24,
      top: 24,
      bottom: height - 65
    };
    plot.width = plot.right - plot.left;
    plot.height = plot.bottom - plot.top;
    chartState.plot = plot;

    const { xMin, xMax, yMin, yMax, xVariable, yVariable } = chartState;
    const xTicks = createTicks(xMin, xMax, width < 600 ? 5 : 9);
    const yTicks = createTicks(yMin, yMax, height < 450 ? 5 : 8);

    context.font = '12px "PingFang SC", sans-serif';
    context.lineWidth = 1;

    const xToPixel = v => plot.left + ((v - xMin) / (xMax - xMin)) * plot.width;
    const yToPixel = v => plot.bottom - ((v - yMin) / (yMax - yMin)) * plot.height;

    if (elements.showGrid.checked) {
      context.strokeStyle = "#e8edf4"; context.fillStyle = "#64748b";
      xTicks.forEach(v => {
        if (v < xMin - 1e-10 || v > xMax + 1e-10) return;
        const x = xToPixel(v);
        context.beginPath(); context.moveTo(x, plot.top); context.lineTo(x, plot.bottom); context.stroke();
        context.textAlign = "center"; context.textBaseline = "top"; context.fillText(formatNumber(v), x, plot.bottom + 10);
      });
      yTicks.forEach(v => {
        if (v < yMin - 1e-10 || v > yMax + 1e-10) return;
        const y = yToPixel(v);
        context.beginPath(); context.moveTo(plot.left, y); context.lineTo(plot.right, y); context.stroke();
        context.textAlign = "right"; context.textBaseline = "middle"; context.fillText(formatNumber(v), plot.left - 10, y);
      });
    }

    context.strokeStyle = "#64748b"; context.lineWidth = 1.3;
    context.beginPath(); context.moveTo(plot.left, plot.top); context.lineTo(plot.left, plot.bottom); context.lineTo(plot.right, plot.bottom); context.stroke();

    context.fillStyle = "#334155"; context.font = 'bold 13px "PingFang SC", sans-serif';
    context.textAlign = "center"; context.textBaseline = "bottom";
    context.fillText(`${variableInfo[xVariable].name} ${xVariable} (${variableInfo[xVariable].unit})`, plot.left + plot.width / 2, height - 10);
    
    context.save(); context.translate(plot.left - 35, plot.top + plot.height / 2); context.rotate(-Math.PI / 2);
    context.textAlign = "center"; context.textBaseline = "top";
    context.fillText(`${variableInfo[yVariable].name} ${yVariable} (${variableInfo[yVariable].unit})`, 0, 0); context.restore();
  }

  function drawCurve(highlightIndex = -1) {
    const { data, xMin, xMax, yMin, yMax, plot } = chartState;
    if (!plot) return;
    const xToPixel = v => plot.left + ((v - xMin) / (xMax - xMin)) * plot.width;
    const yToPixel = v => plot.bottom - ((v - yMin) / (yMax - yMin)) * plot.height;
    const color = elements.lineColor.value;

    context.save(); context.beginPath(); context.rect(plot.left, plot.top, plot.width, plot.height); context.clip();
    context.strokeStyle = color; context.lineWidth = 3; context.lineJoin = "round"; context.beginPath();

    let started = false;
    data.forEach(item => {
      if (!item.valid || item.y < yMin || item.y > yMax) { started = false; return; }
      const x = xToPixel(item.x), y = yToPixel(item.y);
      if (!started) { context.moveTo(x, y); started = true; } else { context.lineTo(x, y); }
    });
    context.stroke();

    if (elements.showPoints.checked) {
      context.fillStyle = color;
      data.forEach(item => {
        if (item.valid && item.y >= yMin && item.y <= yMax) {
          context.beginPath(); context.arc(xToPixel(item.x), yToPixel(item.y), 2.7, 0, Math.PI * 2); context.fill();
        }
      });
    }

    if (highlightIndex >= 0 && data[highlightIndex] && data[highlightIndex].valid) {
      const item = data[highlightIndex], x = xToPixel(item.x), y = yToPixel(item.y);
      context.strokeStyle = "rgba(37, 99, 235, 0.25)"; context.lineWidth = 1;
      context.beginPath(); context.moveTo(x, plot.top); context.lineTo(x, plot.bottom); context.stroke();
      context.beginPath(); context.moveTo(plot.left, y); context.lineTo(plot.right, y); context.stroke();
      context.fillStyle = "#ffffff"; context.strokeStyle = color; context.lineWidth = 3;
      context.beginPath(); context.arc(x, y, 6, 0, Math.PI * 2); context.fill(); context.stroke();
    }
    context.restore();
  }

  // ================= 渲染主控 =================
  function renderCanvas(highlightIndex = -1) {
    context.clearRect(0, 0, chartState.cssWidth, chartState.cssHeight);
    drawCircuit(); // 新增左侧
    drawAxesAndGrid(); // 右侧图表
    drawCurve(highlightIndex);
  }

  function updateInformation(result, validData) {
    const xInfo = variableInfo[result.xVariable], yInfo = variableInfo[result.yVariable], fixedInfo = variableInfo[result.fixedVariable];
    elements.chartTitle.textContent = `${yInfo.name}随${xInfo.name}变化曲线`;
    elements.chartSubtitle.textContent = `固定${fixedInfo.name} ${fixedInfo.symbol} = ${formatNumber(result.fixedValue)} ${fixedInfo.unit}`;
    elements.legendLine.style.background = elements.lineColor.value;
    elements.tableXHeader.textContent = `${xInfo.name} ${xInfo.symbol}（${xInfo.unit}）`;
    elements.tableYHeader.textContent = `${yInfo.name} ${yInfo.symbol}（${yInfo.unit}）`;
  }

  function renderTable(data, xVar, yVar) {
    elements.dataTableBody.innerHTML = "";
    const maxRows = 200;
    const showData = data.length <= maxRows ? data : data.filter((_, i) => i % Math.ceil(data.length / maxRows) === 0 || i === data.length - 1);
    const fragment = document.createDocumentFragment();
    showData.forEach(item => {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${item.index}</td><td>${formatNumber(item.x)} ${variableInfo[xVar].unit}</td><td>${item.valid ? formatNumber(item.y) + ' ' + variableInfo[yVar].unit : '无定义'}</td>`;
      fragment.appendChild(row);
    });
    elements.dataTableBody.appendChild(fragment);
  }

  function drawChart() {
    try {
      const result = generateData();
      const [yMin, yMax] = calculateYRange(result.data);
      const validData = result.data.filter(item => item.valid);
      chartState = { ...chartState, ...result, drawableData: validData, yMin, yMax };

      resizeCanvas();
      renderCanvas();
      updateInformation(result, validData);
      renderTable(result.data, result.xVariable, result.yVariable);
      
      const invalidCount = result.data.length - validData.length;
      setStatus(invalidCount > 0 ? `曲线已生成，${validData.length} 个有效点，跳过 ${invalidCount} 个无效点。` : `曲线已生成，共 ${validData.length} 个有效数据点。`);
    } catch (error) {
      setStatus(error.message || "绘图失败，请检查参数。", true);
    }
  }

  // ================= 交互事件 =================
  function handlePointerMove(event) {
    const rect = elements.canvas.getBoundingClientRect();
    const mx = event.clientX - rect.left, my = event.clientY - rect.top;

    // 拖拽滑动变阻器
    const s = chartState.sliderBox;
    if (s) {
      if (chartState.dragging) {
        let ratio = (mx - s.x) / s.w;
        ratio = Math.max(0, Math.min(1, ratio));
        const fixedVar = getFixedVariable(elements.xVariable.value, elements.yVariable.value);
        const maxVal = fixedVar === 'R' ? 50 : (fixedVar === 'U' ? 24 : 5);
        elements.fixedValue.value = (ratio * maxVal).toFixed(1);
        drawChart();
        return;
      }
      if (mx > s.x - 20 && mx < s.x + s.w + 20 && my > s.y - 20 && my < s.y + 20) {
        elements.canvas.style.cursor = 'pointer';
        return;
      } else {
        elements.canvas.style.cursor = 'default';
      }
    }

    // 图表悬停提示
    const p = chartState.plot;
    if (!p || mx < p.left || mx > p.right || my < p.top || my > p.bottom) {
      elements.tooltip.style.display = "none"; renderCanvas(); return;
    }
    const valX = chartState.xMin + ((mx - p.left) / p.width) * (chartState.xMax - chartState.xMin);
    let nearest = -1, minDist = Infinity;
    chartState.data.forEach((item, idx) => {
      if (!item.valid) return;
      const dist = Math.abs(item.x - valX);
      if (dist < minDist) { minDist = dist; nearest = idx; }
    });

    if (nearest >= 0) {
      const item = chartState.data[nearest];
      const xI = variableInfo[chartState.xVariable], yI = variableInfo[chartState.yVariable];
      elements.tooltip.innerHTML = `<strong>${xI.name}</strong>: ${formatNumber(item.x)} ${xI.unit}<br><strong>${yI.name}</strong>: ${formatNumber(item.y)} ${yI.unit}`;
      elements.tooltip.style.display = "block";
      let left = mx + 15, top = my - 20;
      if (left + 180 > rect.width) left = mx - 180 - 12;
      if (top + 70 > rect.height) top = rect.height - 70 - 8;
      if (top < 8) top = 8;
      elements.tooltip.style.left = left + "px"; elements.tooltip.style.top = top + "px";
      renderCanvas(nearest);
    }
  }

  elements.canvas.addEventListener("pointerdown", e => {
    const rect = elements.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const s = chartState.sliderBox;
    if (s && mx > s.x - 20 && mx < s.x + s.w + 20 && my > s.y - 20 && my < s.y + 20) {
      chartState.dragging = true;
      handlePointerMove(e);
    }
  });
  elements.canvas.addEventListener("pointermove", handlePointerMove);
  elements.canvas.addEventListener("pointerup", () => chartState.dragging = false);
  elements.canvas.addEventListener("pointerleave", () => {
    chartState.dragging = false;
    elements.tooltip.style.display = "none";
    renderCanvas();
  });

  elements.xVariable.addEventListener("change", () => { validateAxisSelection("x"); updateControls(true); drawChart(); });
  elements.yVariable.addEventListener("change", () => { validateAxisSelection("y"); updateControls(false); drawChart(); });
  elements.autoY.addEventListener("change", () => { elements.yMin.disabled = elements.yMax.disabled = elements.autoY.checked; drawChart(); });
  elements.drawButton.addEventListener("click", drawChart);
  elements.resetButton.addEventListener("click", () => {
    elements.xVariable.value = "I"; elements.yVariable.value = "U";
    elements.fixedValue.value = "10"; elements.xMin.value = "0"; elements.xMax.value = "5";
    elements.sampleCount.value = "101"; elements.autoY.checked = true;
    elements.yMin.disabled = elements.yMax.disabled = true;
    elements.lineColor.value = "#2563eb"; elements.showPoints.checked = false; elements.showGrid.checked = true;
    updateControls(false); drawChart();
  });

  elements.lineColor.addEventListener("input", () => { renderCanvas(); });
  elements.showPoints.addEventListener("change", () => renderCanvas());
  elements.showGrid.addEventListener("change", () => renderCanvas());

  [elements.fixedValue, elements.xMin, elements.xMax, elements.yMin, elements.yMax, elements.sampleCount].forEach(input => {
    input.addEventListener("keydown", e => { if (e.key === "Enter") drawChart(); });
  });

  window.addEventListener("resize", () => {
    if (chartState.data.length) { resizeCanvas(); renderCanvas(); }
  });

  // 启动
  updateControls(false);
  resizeCanvas();
  drawChart();
</script>
</body>
</html>
