<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧姆定律 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>欧姆定律</h1>
<div class="lab">
<aside class="lab-side">
  <h3>控制面板</h3>
  <label>电源电压 U = <span id="uVal">6.0</span> V
    <input type="range" id="uRange" min="1" max="12" value="6" step="0.5">
  </label>
  <label>定值电阻 R₀ = 5.0 Ω（固定）</label>
  
  <div class="row" style="margin-top:16px;">
    <input type="checkbox" id="showChart" checked>
    <label for="showChart" style="margin:0; cursor:pointer; font-weight:bold;">显示 I-U 图像</label>
  </div>
  
  <div class="readout" id="readout"></div>
  <div style="font-size:12px; color:#888; margin-top:8px;">
    💡 提示：你可以直接用手指/鼠标在左侧画布上拖动滑动变阻器的滑片来改变电阻。
  </div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var U = 6, R = 10; // 初始滑动变阻器阻值
  var showChart = true;
  var isDragging = false;

  // 布局参数
  var leftW, rightW;
  var sliderBox = { x: 0, y: 0, w: 80, h: 20, px: 0 };

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
    leftW = showChart ? W * 0.45 : W;
    rightW = W - leftW;
    draw();
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var I = U / (5 + R); // R0=5，总电阻 = 5+R
    var U0 = I * 5;
    var Ur = I * R;

    // --- 左侧：实物电路图 ---
    var cx = leftW / 2;
    var cy = H / 2;
    var rectW = Math.min(leftW * 0.6, 240);
    var rectH = Math.min(H * 0.4, 160);
    var left = cx - rectW / 2, right = cx + rectW / 2;
    var top = cy - rectH / 2, bot = cy + rectH / 2;

    // 导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.rect(left, top, rectW, rectH); ctx.stroke();

    // 电源
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(left - 8, cy - 20, 16, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(left - 8, cy - 20, 16, 40);
    ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('U='+U+'V', left - 15, cy + 5);

    // 定值电阻
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 20, top - 10, 40, 20); ctx.strokeRect(cx - 20, top - 10, 40, 20);
    ctx.fillStyle = '#2c3e50'; ctx.textAlign = 'center';
    ctx.fillText('R₀=5Ω', cx, top - 20);

    // 滑动变阻器（在底部）
    var sLeft = cx - 50, sTop = bot - 10;
    sliderBox = { x: sLeft, y: sTop, w: 100, h: 20, px: sLeft + (R/30)*100 };
    
    // 变阻器主体
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(sLeft, sTop, 100, 20); ctx.strokeRect(sLeft, sTop, 100, 20);
    // 滑片
    ctx.fillStyle = isDragging ? '#e74c3c' : '#3498db';
    ctx.beginPath();
    ctx.moveTo(sliderBox.px, sTop);
    ctx.lineTo(sliderBox.px - 8, sTop - 15);
    ctx.lineTo(sliderBox.px + 8, sTop - 15);
    ctx.fill();
    ctx.fillStyle = '#2c3e50'; ctx.font = '12px sans-serif';
    ctx.fillText('滑动变阻器 R=' + R.toFixed(0) + 'Ω', cx, sTop + 35);

    // 电流粒子
    var speed = I * 0.5;
    drawParticles(left, top, rectW, rectH, speed);

    // --- 右侧：I-U 图像 ---
    if (showChart) {
      drawChart(U, I, leftW, 0, rightW, H);
    }

    document.getElementById('readout').innerHTML =
      '定值电阻 R₀ = 5 Ω<br>' +
      '滑动变阻器 R = <b>' + R.toFixed(0) + '</b> Ω<br>' +
      '总电阻 = <b>' + (R + 5) + '</b> Ω<br>' +
      '电流 I = U/R总 = <b>' + I.toFixed(2) + '</b> A<br>' +
      'R₀ 两端电压 = <b>' + U0.toFixed(2) + '</b> V';

    requestAnimationFrame(draw);
  }

  var offset = 0;
  function drawParticles(l, t, w, h, speed) {
    offset = (offset + speed) % 30;
    ctx.fillStyle = '#f39c12';
    for (var x = l; x < l + w; x += 30) { drawDot(x + offset, t); drawDot(x + offset, t + h); }
    for (var y = t; y < t + h; y += 30) { drawDot(l, y + offset); drawDot(l + w, y + offset); }
  }

  function drawDot(x, y) { ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill(); }

  function drawChart(curU, curI, px, py, pw, ph) {
    // 坐标系
    var pad = 40;
    var cw = pw - pad * 2, ch = ph - pad * 2;
    var originX = px + pad, originY = py + ph - pad;

    ctx.save();
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 1.5;
    // 坐标轴
    ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX + cw, originY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX, originY - ch); ctx.stroke();
    
    ctx.fillStyle = '#666'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('电压 U (V)', originX + cw/2, originY + 25);
    ctx.save(); ctx.translate(originX - 20, originY - ch/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('电流 I (A)', 0, 0); ctx.restore();

    // 画曲线 (I = U / 5)
    ctx.beginPath(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    for (var u = 0; u <= 12; u += 0.5) {
      var i = u / 5;
      var drawX = originX + (u / 12) * cw;
      var drawY = originY - (i / 3) * ch; // 最大电流假设为 3A
      if (u === 0) ctx.moveTo(drawX, drawY); else ctx.lineTo(drawX, drawY);
    }
    ctx.stroke();

    // 当前点
    var dotX = originX + (curU / 12) * cw;
    var dotY = originY - (curI / 3) * ch;
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(dotX, dotY, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.stroke();

    // 虚线
    ctx.strokeStyle = '#2563eb'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(dotX, originY); ctx.lineTo(dotX, dotY); ctx.lineTo(originX, dotY); ctx.stroke();
    ctx.restore();
  }

  // 交互：拖拽滑动变阻器
  function getPointer(e) {
    var rect = canvas.getBoundingClientRect();
    var touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  canvas.addEventListener('pointerdown', function(e) {
    var p = getPointer(e);
    // 扩大触摸热区
    if (p.x > sliderBox.x - 20 && p.x < sliderBox.x + sliderBox.w + 20 &&
        p.y > sliderBox.y - 30 && p.y < sliderBox.y + 20) {
      isDragging = true;
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var p = getPointer(e);
    var ratio = (p.x - sliderBox.x) / sliderBox.w;
    ratio = Math.max(0, Math.min(1, ratio));
    R = Math.round(ratio * 30); // 0~30欧
  });

  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);

  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U; });
  document.getElementById('showChart').addEventListener('change', function(e){ showChart = e.target.checked; resize(); });

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
