<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧姆定律 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>欧姆定律</h1>
<div class="lab">
<aside class="lab-side">
  <h3>控制面板</h3>
  <label>电源电压 U = <span id="uVal">6.0</span> V
    <input type="range" id="uRange" min="1" max="12" value="6" step="0.5">
  </label>
  <label>定值电阻 R₀ = 5.0 Ω（固定）</label>
  <div class="row" style="margin-top:16px;">
    <input type="checkbox" id="showChart" checked>
    <label for="showChart" style="margin:0; cursor:pointer; font-weight:bold;">显示 I-U 图像</label>
  </div>
  <div class="readout" id="readout"></div>
  <div style="font-size:12px; color:#888; margin-top:8px;">
    💡 提示：直接拖拽左侧的滑动变阻器滑片改变电阻。
  </div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var U = 6, R = 10;
  var showChart = true, isDragging = false;
  var leftW, sliderBox;
  var offset = 0;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
    leftW = showChart ? W * 0.45 : W;
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var I = U / (5 + R);
    var U0 = I * 5;
    var cx = leftW / 2, cy = H / 2;
    var rw = Math.min(leftW * 0.6, 240), rh = Math.min(H * 0.4, 160);
    var left = cx - rw / 2, right = cx + rw / 2, top = cy - rh / 2, bot = cy + rh / 2;

    // 导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.rect(left, top, rw, rh); ctx.stroke();

    // 电源
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(left - 4, cy - 20, 8, 15);
    ctx.fillRect(left - 8, cy + 5, 16, 8);
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('+', left - 12, cy - 10);
    ctx.fillText('-', left - 12, cy + 12);
    ctx.fillStyle = '#333'; ctx.fillText('U='+U+'V', left - 20, cy + 30);

    // R0
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
    ctx.fillRect(cx - 20, top - 8, 40, 16); ctx.strokeRect(cx - 20, top - 8, 40, 16);
    ctx.fillStyle = '#2c3e50'; ctx.textAlign = 'center'; ctx.fillText('R₀=5Ω', cx, top - 15);

    // 滑动变阻器
    var sLeft = cx - 50, sTop = bot - 8;
    sliderBox = { x: sLeft, y: sTop, w: 100, h: 16, px: sLeft + (R/30)*100 };
    ctx.fillStyle = '#ecf0f1'; ctx.strokeStyle = '#7f8c8d';
    ctx.fillRect(sLeft, sTop, 100, 16); ctx.strokeRect(sLeft, sTop, 100, 16);
    ctx.fillStyle = isDragging ? '#e74c3c' : '#3498db';
    ctx.beginPath();
    ctx.moveTo(sliderBox.px, sTop);
    ctx.lineTo(sliderBox.px - 8, sTop - 12);
    ctx.lineTo(sliderBox.px + 8, sTop - 12);
    ctx.fill();
    ctx.fillStyle = '#2c3e50'; ctx.fillText('R=' + R.toFixed(0) + 'Ω', cx, sTop + 30);

    // 电表
    drawMeter(left + rw*0.3, top - 40, 'A', I.toFixed(2) + 'A');

    // 粒子
    offset = (offset + I * 0.5) % 30;
    drawLineParticles(left, top, right, top, offset);
    drawLineParticles(right, top, right, bot, offset);
    drawLineParticles(right, bot, left, bot, offset);
    drawLineParticles(left, bot, left, top, offset);

    if (showChart) drawChart(U, I, leftW, 0, W - leftW, H);

    document.getElementById('readout').innerHTML =
      '总电阻 = <b>' + (R + 5) + ' Ω</b><br>' +
      '电流 I = <b>' + I.toFixed(2) + ' A</b><br>' +
      'R₀电压 = <b>' + U0.toFixed(2) + ' V</b>';

    requestAnimationFrame(draw);
  }

  function drawLineParticles(x1, y1, x2, y2, off) {
    var len = Math.hypot(x2 - x1, y2 - y1); if (len === 0) return;
    var dx = (x2 - x1) / len, dy = (y2 - y1) / len;
    ctx.fillStyle = '#f39c12';
    for (var d = 0; d <= len; d += 30) {
      var dist = (d + off) % len;
      ctx.beginPath(); ctx.arc(x1 + dx * dist, y1 + dy * dist, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMeter(cx, cy, label, val) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy);
    ctx.textBaseline = 'top'; ctx.fillText(val, cx, cy + 18);
  }

  function drawChart(curU, curI, px, py, pw, ph) {
    var pad = 40, cw = pw - pad * 2, ch = ph - pad * 2;
    var ox = px + pad, oy = py + ph - pad;
    ctx.save();
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + cw, oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - ch); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('U (V)', ox + cw/2, oy + 25);
    ctx.save(); ctx.translate(ox - 20, oy - ch/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('I (A)', 0, 0); ctx.restore();

    ctx.beginPath(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    for (var u = 0; u <= 12; u += 0.5) {
      var i = u / 5;
      var dx = ox + (u / 12) * cw;
      var dy = oy - (i / 3) * ch;
      if (u === 0) ctx.moveTo(dx, dy); else ctx.lineTo(dx, dy);
    }
    ctx.stroke();

    var dotX = ox + (curU / 12) * cw;
    var dotY = oy - (curI / 3) * ch;
    ctx.fillStyle = '#2563eb';
    ctx.beginPath(); ctx.arc(dotX, dotY, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  canvas.addEventListener('pointerdown', function(e) {
    var rect = canvas.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx > sliderBox.x - 20 && mx < sliderBox.x + sliderBox.w + 20 && my > sliderBox.y - 30 && my < sliderBox.y + 20) isDragging = true;
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!isDragging) return;
    var rect = canvas.getBoundingClientRect();
    var ratio = (e.clientX - rect.left - sliderBox.x) / sliderBox.w;
    R = Math.round(Math.max(0, Math.min(1, ratio)) * 30);
  });

  canvas.addEventListener('pointerup', () => isDragging = false);
  canvas.addEventListener('pointerleave', () => isDragging = false);

  document.getElementById('uRange').addEventListener('input', function(e){ U = parseFloat(e.target.value); document.getElementById('uVal').textContent = U; });
  document.getElementById('showChart').addEventListener('change', function(e){ showChart = e.target.checked; resize(); });

  window.addEventListener('resize', resize); resize(); draw();
})();
</script>
</body>
</html>
