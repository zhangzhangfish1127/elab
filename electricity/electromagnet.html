<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁铁 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>电磁铁</h1>
<div class="lab">
<aside class="lab-side">
  <h3>控制面板</h3>
  
  <div class="row" style="margin-bottom:12px;">
    <input type="checkbox" id="switchToggle" checked>
    <label for="switchToggle" style="margin:0; cursor:pointer; font-weight:bold;">闭合开关（通电）</label>
  </div>
  
  <button id="flipBtn" class="secondary" style="margin-bottom:16px;">🔄 切换电源正负极</button>

  <label>电流 I = <span id="iVal">1.0</span> A
    <input type="range" id="iRange" min="0.5" max="3" value="1" step="0.1">
  </label>
  
  <div class="row">
    <label style="margin:0; white-space:nowrap">线圈匝数</label>
    <select id="nSel">
      <option value="1">少 (50匝)</option>
      <option value="2" selected>中 (100匝)</option>
      <option value="3">多 (150匝)</option>
    </select>
  </div>

  <div class="readout" id="readout"></div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  
  var I = 1.0, N_level = 2, isClosed = true;
  var direction = 1; // 1 为正向，-1 为反向
  var pins = []; // 大头针物理对象
  
  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
    initPins();
  }

  function initPins() {
    pins = [];
    // 生成 20 根大头针备用
    for(var i=0; i<20; i++) {
      pins.push({
        x: W/2 - 30 + Math.random() * 60,
        y: H * 0.85 + Math.random() * 20,
        vy: 0,
        attached: false
      });
    }
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var strength = isClosed ? I * N_level : 0;
    var attachCount = Math.floor(strength * 5);
    var cx = W / 2, cy = H * 0.4;
    var coreW = 50, coreH = 140;

    // 导线与电源
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 200, H * 0.85); ctx.lineTo(cx - 200, cy); ctx.lineTo(cx - coreW / 2 - 20, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + coreW / 2 + 20, cy); ctx.lineTo(cx + 200, cy); ctx.lineTo(cx + 200, H * 0.85); ctx.stroke();
    
    // 电池（带正负极切换显示）
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(cx - 210, H * 0.85 - 20, 20, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(cx - 210, H * 0.85 - 20, 20, 40);
    ctx.fillStyle = '#333'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(direction === 1 ? '+' : '-', cx - 200, H * 0.85 - 25);
    ctx.fillText(direction === 1 ? '-' : '+', cx - 200, H * 0.85 + 30);

    // 铁芯
    ctx.fillStyle = '#95a5a6'; ctx.fillRect(cx - coreW / 2, cy - coreH / 2, coreW, coreH);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.strokeRect(cx - coreW / 2, cy - coreH / 2, coreW, coreH);

    // N/S 极标识
    if (isClosed) {
      ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 24px sans-serif';
      var topText = direction === 1 ? 'N' : 'S';
      var botText = direction === 1 ? 'S' : 'N';
      ctx.fillText(topText, cx - coreW - 20, cy - coreH / 2 + 20);
      ctx.fillText(botText, cx - coreW - 20, cy + coreH / 2);
    }

    // 线圈
    ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 4;
    var coils = 8 + N_level * 2, step = coreH / coils;
    for (var i = 0; i < coils; i++) {
      var y = cy - coreH / 2 + i * step + step / 2;
      ctx.beginPath(); ctx.ellipse(cx, y, coreW / 2 + 8, 6, 0, 0, Math.PI, false); ctx.stroke();
    }

    // 磁场线（根据方向画箭头）
    if (strength > 0.2) {
      ctx.strokeStyle = '#e74c3c'; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
      for (var m = 1; m <= 3; m++) {
        var r = 60 + m * 20;
        // 方向 1 从 N 到 S（向下），方向 -1 从下到上
        var startAngle = direction === 1 ? -Math.PI/2 : Math.PI/2;
        var endAngle = direction === 1 ? Math.PI/2 : -Math.PI/2;
        
        ctx.beginPath();
        ctx.moveTo(cx + coreW/2, cy + startAngle*30);
        ctx.bezierCurveTo(cx + r, cy + startAngle*40, cx + r, cy + endAngle*40, cx + coreW/2, cy + endAngle*30);
        ctx.stroke();
        
        // 箭头
        var ay = cy + (startAngle + endAngle)/2 * 30;
        var ax = cx + r;
        ctx.beginPath();
        if (direction === 1) { // 朝下
          ctx.moveTo(ax, ay+5); ctx.lineTo(ax-5, ay-5); ctx.lineTo(ax+5, ay-5);
        } else { // 朝上
          ctx.moveTo(ax, ay-5); ctx.lineTo(ax-5, ay+5); ctx.lineTo(ax+5, ay+5);
        }
        ctx.fillStyle = '#e74c3c'; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 物理引擎：处理大头针
    var baseY = cy + coreH / 2 + 10;
    pins.forEach(function(p, idx) {
      if (isClosed && idx < attachCount) {
        // 吸住
        p.attached = true;
        p.vy = 0;
        p.x += (cx - 25 + (idx % 8) * 8 - p.x) * 0.2; // 排布在底部
        p.y += (baseY + Math.floor(idx/8) * 12 - p.y) * 0.2;
      } else {
        // 掉落
        p.attached = false;
        p.vy += 0.5; // 重力加速度
        p.y += p.vy;
        if (p.y > H * 0.85) { // 落地
          p.y = H * 0.85 + Math.random() * 10;
          p.vy = 0;
        }
      }

      // 画大头针
      ctx.fillStyle = '#7f8c8d'; ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y + 10, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + 10); ctx.stroke();
    });

    document.getElementById('readout').innerHTML =
      '当前极性：<b>' + (direction === 1 ? '上N 下S' : '上S 下N') + '</b><br>' +
      '综合磁性 = <b>' + strength.toFixed(1) + '</b><br>' +
      '吸住大头针：<b>' + Math.min(attachCount, 20) + '</b> 根';

    requestAnimationFrame(draw);
  }

  document.getElementById('switchToggle').addEventListener('change', function(e) { isClosed = e.target.checked; });
  document.getElementById('flipBtn').addEventListener('click', function() { direction *= -1; });
  document.getElementById('iRange').addEventListener('input', function(e) { I = parseFloat(e.target.value); document.getElementById('iVal').textContent = I.toFixed(1); });
  document.getElementById('nSel').addEventListener('change', function(e) { N_level = parseInt(e.target.value); });

  window.addEventListener('resize', resize);
  resize(); draw();
})();
</script>
</body>
</html>
