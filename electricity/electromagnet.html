<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁铁 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>电磁铁</h1>
<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>因素</th><th>磁性强弱</th></tr></thead>
    <tbody>
      <tr class="active"><td>电流越大</td><td>磁性越强</td></tr>
      <tr class="active"><td>匝数越多</td><td>磁性越强</td></tr>
    </tbody>
  </table>
  <h3>控制面板</h3>
  <label>电流 I = <span id="iVal">1.0</span> A
    <input type="range" id="iRange" min="0" max="3" value="1" step="0.1">
  </label>
  <div class="row">
    <label style="margin:0;white-space:nowrap">线圈匝数</label>
    <select id="nSel">
      <option value="1">少 (50匝)</option>
      <option value="2" selected>中 (100匝)</option>
      <option value="3">多 (150匝)</option>
    </select>
  </div>
  <div class="readout" id="readout"></div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W, H;
  var I = 1.0, N_level = 2;

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height;
    draw();
  }

  function draw() {
    if (!W) return;
    ctx.clearRect(0, 0, W, H);

    var strength = I * N_level;
    var pinCount = Math.floor(strength * 4);
    var cx = W / 2, cy = H * 0.4;
    var coreW = 50, coreH = 140;

    // 导线
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 200, H * 0.8); ctx.lineTo(cx - 200, cy); ctx.lineTo(cx - coreW / 2 - 20, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + coreW / 2 + 20, cy); ctx.lineTo(cx + 200, cy); ctx.lineTo(cx + 200, H * 0.8);
    ctx.stroke();
    
    // 电池
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(cx - 210, H * 0.8 - 20, 20, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(cx - 210, H * 0.8 - 20, 20, 40);

    // 铁芯
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(cx - coreW / 2, cy - coreH / 2, coreW, coreH);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    ctx.strokeRect(cx - coreW / 2, cy - coreH / 2, coreW, coreH);

    // 画逼真的线圈（螺旋感）
    ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 4;
    var coils = 8 + N_level * 2;
    var step = coreH / coils;
    for (var i = 0; i < coils; i++) {
      var y = cy - coreH / 2 + i * step + step / 2;
      ctx.beginPath();
      // 模拟线从前面绕过
      ctx.ellipse(cx, y, coreW / 2 + 8, 6, 0, 0, Math.PI, false);
      ctx.stroke();
      // 侧面的线
      ctx.beginPath(); ctx.moveTo(cx - coreW/2 - 8, y); ctx.lineTo(cx - coreW/2 - 8, y + step); ctx.stroke();
    }

    // 画大头针
    ctx.fillStyle = '#7f8c8d'; ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 1;
    var baseY = cy + coreH / 2;
    for (var p = 0; p < pinCount; p++) {
      var row = Math.floor(p / 5);
      var col = p % 5;
      var px = cx - 20 + col * 10;
      var py = baseY + row * 15;
      // 针帽
      ctx.beginPath(); ctx.arc(px, py + 10, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      // 针身
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + 10); ctx.stroke();
    }

    // 磁场线（从顶部N极出来，绕一圈回到底部）
    if (strength > 0.2) {
      ctx.strokeStyle = App.getTheme().ray1;
      ctx.globalAlpha = Math.min(0.8, strength / 3);
      ctx.lineWidth = 2;
      for (var m = 1; m <= 3; m++) {
        var r = 60 + m * 25;
        // 右侧
        ctx.beginPath();
        ctx.moveTo(cx + coreW/2, cy - coreH/2 + 10);
        ctx.bezierCurveTo(cx + r, cy - coreH/2, cx + r, cy + coreH/2, cx + coreW/2, cy + coreH/2 - 10);
        ctx.stroke();
        // 左侧
        ctx.beginPath();
        ctx.moveTo(cx - coreW/2, cy - coreH/2 + 10);
        ctx.bezierCurveTo(cx - r, cy - coreH/2, cx - r, cy + coreH/2, cx - coreW/2, cy + coreH/2 - 10);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    document.getElementById('readout').innerHTML =
      '综合磁性强弱 = I × N = <b>' + strength.toFixed(1) + '</b><br>' +
      '当前吸引大头针约 <b>' + pinCount + '</b> 根<br>' +
      '<span style="color:#888">电流越大、匝数越多，磁性越强</span>';
  }

  document.getElementById('iRange').addEventListener('input', function(e) {
    I = parseFloat(e.target.value); document.getElementById('iVal').textContent = I.toFixed(1); draw();
  });
  document.getElementById('nSel').addEventListener('change', function(e) {
    N_level = parseInt(e.target.value); draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
