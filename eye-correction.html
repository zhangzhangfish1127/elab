<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼睛与视力矫正 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>眼睛与视力矫正</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>状态</th><th>平行光聚焦</th></tr></thead>
    <tbody>
      <tr data-case="normal"><td>正常眼</td><td>视网膜上</td></tr>
      <tr data-case="myopia"><td>近视眼</td><td>视网膜前</td></tr>
      <tr data-case="hyperopia"><td>远视眼</td><td>视网膜后</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div class="row">
    <label style="margin:0;white-space:nowrap">视力状态</label>
    <select id="modeSel">
      <option value="normal" selected>正常眼</option>
      <option value="myopia">近视眼</option>
      <option value="hyperopia">远视眼</option>
    </select>
  </div>
  <div class="row">
    <label style="margin:0;white-space:nowrap">观察物体</label>
    <select id="distSel">
      <option value="far">看远处</option>
      <option value="near">看近处</option>
    </select>
  </div>

  <label>晶状体曲度 = <span id="cVal">1.00</span>
    <input type="range" id="cRange" min="0.6" max="1.6" value="1" step="0.01">
  </label>

  <div class="row">
    <input type="checkbox" id="glassesChk">
    <label for="glassesChk" style="margin:0">佩戴矫正眼镜</label>
  </div>
  <label>眼镜度数 D = <span id="dVal">0</span>
    <input type="range" id="dRange" min="-40" max="40" value="0" step="1">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <div class="row">
    <input type="checkbox" id="playCurv">
    <label for="playCurv" style="margin:0">晶状体自动调节</label>
  </div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">切换视力、曲度、眼镜度数，观察焦点位置变化</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var R = 22;
  var lensX = -16;
  var retinaX = 20;
  var playing = false, playDir = 1, rafId = null;

  function getCurvature() { return parseFloat(document.getElementById('cRange').value); }
  function getPower() { return parseFloat(document.getElementById('dRange').value); }

  function calcFocusX(mode, c, D, dist) {
    var bias = mode === 'normal' ? 0 : mode === 'myopia' ? -6 : 6;
    // 曲度：c = 1 时正常；c 越大，晶状体越厚，焦点前移
    var curvEffect = -(c - 1.0) * 12;
    // 眼镜：D 正 = 凸透镜（焦点前移），D 负 = 凹透镜（焦点后移）
    var glassesOn = document.getElementById('glassesChk').checked;
    var glassEffect = glassesOn ? -D * 0.25 : 0;
    // 看远看近：看近物时入射光发散，需要更强会聚，焦点偏前
    var distBias = dist === 'near' ? -4 : 0;
    return retinaX + bias + curvEffect + glassEffect + distBias;
  }

  function draw() {
    var TH = App.getTheme();
    opt.clear();

    var mode = document.getElementById('modeSel').value;
    var dist = document.getElementById('distSel').value;
    var c = getCurvature();
    var D = getPower();
    var useGlasses = document.getElementById('glassesChk').checked;
    var focusX = calcFocusX(mode, c, D, dist);

    opt.drawAxis();

    var ctx = opt.ctx;
    var cpt = opt.toScreen(0, 0);
    var Rs = R * opt.scale;

    // 眼球
    ctx.save();
    ctx.fillStyle = 'rgba(240,248,255,0.6)';
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cpt[0], cpt[1], Rs, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 视网膜
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(cpt[0], cpt[1], Rs, -0.9, 0.9);
    ctx.stroke();
    ctx.restore();

    // 晶状体（厚度随曲度）
    var l = opt.toScreen(lensX, 0);
    var lensH = 11 * opt.scale;
    var lensW = (3 + (c - 1) * 8) * opt.scale;
    ctx.save();
    ctx.fillStyle = 'rgba(52,152,219,0.35)';
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(l[0], l[1], lensW, lensH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    opt.drawLabel(lensX, 10, '晶状体', '#2980b9');
    opt.drawLabel(retinaX - 2, R - 4, '视网膜', '#e74c3c');

    // 平行光（看远）或发散光（看近）
    var yUp = 5, yDn = -5;
    var startX = -55;
    if (dist === 'far') {
      // 平行光
      opt.drawArrowRay(startX, yUp, lensX, yUp, TH.ray1, 0.85);
      opt.drawArrowRay(startX, yDn, lensX, yDn, TH.ray1, 0.85);
      opt.drawRay(startX, 0, lensX, 0, TH.ray1);
    } else {
      // 发散光：从 (-55, 0) 附近一点发出
      var nearX = -55, nearY = 0;
      opt.drawArrowRay(nearX, nearY, lensX, yUp, TH.ray1, 0.85);
      opt.drawArrowRay(nearX, nearY, lensX, yDn, TH.ray1, 0.85);
      opt.drawArrowRay(nearX, nearY, lensX, 0, TH.ray1, 0.85);
    }

    // 出射光：从透镜到焦点，继续延伸
    var tailX = 32;
    var k1 = (0 - yUp) / (focusX - lensX);
    var yEndUp = k1 * (tailX - focusX);
    opt.drawRay(lensX, yUp, focusX, 0, TH.ray2);
    opt.drawRay(focusX, 0, tailX, yEndUp, TH.ray2);

    var k2 = (0 - yDn) / (focusX - lensX);
    var yEndDn = k2 * (tailX - focusX);
    opt.drawRay(lensX, yDn, focusX, 0, TH.ray2);
    opt.drawRay(focusX, 0, tailX, yEndDn, TH.ray2);

    // 眼镜
    if (useGlasses && Math.abs(D) > 0.5) {
      var gx = -30;
      var g = opt.toScreen(gx, 0);
      var gH = 10 * opt.scale;
      var gW = 3 * opt.scale;
      ctx.save();
      ctx.strokeStyle = '#9b59b6';
      ctx.fillStyle = 'rgba(155,89,182,0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (D < 0) {
        // 凹透镜
        ctx.moveTo(g[0] - gW, g[1] - gH);
        ctx.lineTo(g[0] + gW, g[1] - gH);
        ctx.quadraticCurveTo(g[0] - gW*0.6, g[1], g[0] + gW, g[1] + gH);
        ctx.lineTo(g[0] - gW, g[1] + gH);
        ctx.quadraticCurveTo(g[0] + gW*0.6, g[1], g[0] - gW, g[1] - gH);
      } else {
        // 凸透镜
        ctx.moveTo(g[0] - gW, g[1] - gH);
        ctx.quadraticCurveTo(g[0] + gW*2, g[1], g[0] - gW, g[1] + gH);
        ctx.quadraticCurveTo(g[0] - gW*2, g[1], g[0] - gW, g[1] - gH);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      opt.drawLabel(gx - 2, 13, D < 0 ? '凹透镜' : '凸透镜', '#9b59b6');
    }

    // 焦点
    opt.drawPoint(focusX, 0, '#e67e22', '聚焦点');

    // 表格高亮
    document.querySelectorAll('#caseTable tbody tr').forEach(function(tr) {
      tr.classList.toggle('active', tr.dataset.case === mode);
    });

    // 读数
    document.getElementById('cVal').textContent = c.toFixed(2);
    document.getElementById('cRange').value = c;
    document.getElementById('dVal').textContent = D;

    var modeText = mode === 'normal' ? '正常眼' : mode === 'myopia' ? '近视眼' : '远视眼';
    var focusDiff = focusX - retinaX;
    var focusText;
    if (Math.abs(focusDiff) < 1) focusText = '聚焦点正好在视网膜上 <b style="color:#27ae60">✓ 清晰</b>';
    else if (focusDiff < 0) focusText = '聚焦点在视网膜<b style="color:#e67e22">前方</b> → 模糊';
    else focusText = '聚焦点在视网膜<b style="color:#e67e22">后方</b> → 模糊';

    var glassText = '';
    if (mode === 'myopia' && (!useGlasses || D >= 0)) glassText = '建议佩戴<b>凹透镜</b>（负度数）';
    else if (mode === 'hyperopia' && (!useGlasses || D <= 0)) glassText = '建议佩戴<b>凸透镜</b>（正度数）';
    else if (useGlasses && Math.abs(focusDiff) < 1) glassText = '<b style="color:#27ae60">视力已矫正</b>';

    document.getElementById('readout').innerHTML =
      '当前：<b>' + modeText + '</b>　' + (dist === 'far' ? '看远处' : '看近处') + '<br>' +
      focusText + '<br>' + glassText;
  }

  document.getElementById('modeSel').addEventListener('change', function() {
    var mode = document.getElementById('modeSel').value;
    if (mode === 'normal') { document.getElementById('cRange').value = 1.0; document.getElementById('dRange').value = 0; document.getElementById('glassesChk').checked = false; }
    else if (mode === 'myopia') { document.getElementById('cRange').value = 1.3; document.getElementById('dRange').value = -15; }
    else { document.getElementById('cRange').value = 0.75; document.getElementById('dRange').value = 15; }
    draw();
  });
  document.getElementById('distSel').addEventListener('change', function() {
    var dist = document.getElementById('distSel').value;
    // 正常眼睛自动调节曲度
    if (document.getElementById('modeSel').value === 'normal') {
      document.getElementById('cRange').value = dist === 'far' ? 1.0 : 1.3;
    }
    draw();
  });
  document.getElementById('cRange').addEventListener('input', draw);
  document.getElementById('dRange').addEventListener('input', draw);
  document.getElementById('glassesChk').addEventListener('change', draw);
  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    document.getElementById('modeSel').value = 'normal';
    document.getElementById('distSel').value = 'far';
    document.getElementById('cRange').value = 1.0;
    document.getElementById('dRange').value = 0;
    document.getElementById('glassesChk').checked = false;
    document.getElementById('playCurv').checked = false;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value) * 0.005;
    var c = getCurvature();
    c += playDir * spd;
    if (c > 1.6) { c = 1.6; playDir = -1; }
    if (c < 0.6) { c = 0.6; playDir = 1; }
    document.getElementById('cRange').value = c.toFixed(2);
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      if (!document.getElementById('playCurv').checked) { alert('请先勾选"晶状体自动调节"'); return; }
      playing = true; playDir = 1;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
