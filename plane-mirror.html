<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平面镜成像 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>平面镜成像</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>项目</th><th>关系</th></tr></thead>
    <tbody>
      <tr class="active"><td>物距</td><td>= 像距</td></tr>
      <tr class="active"><td>物大小</td><td>= 像大小</td></tr>
      <tr class="active"><td>像的正倒</td><td>正立虚像</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>物距 u = <span id="uVal">25.0</span> cm
    <input type="range" id="uRange" min="5" max="50" value="25" step="0.5">
  </label>

  <div class="row">
    <input type="checkbox" id="showRay" checked>
    <label for="showRay" style="margin:0">显示光路</label>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <div class="row">
    <input type="checkbox" id="playCandle">
    <label for="playCandle" style="margin:0">蜡烛移动</label>
  </div>
  <div class="row">
    <label style="margin:0;white-space:nowrap">方向</label>
    <select id="playDir">
      <option value="away">远离镜面</option>
      <option value="toward">靠近镜面</option>
      <option value="pingpong" selected>来回</option>
    </select>
  </div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>

  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="legend">
      <span id="lgObj" style="--c:#e74c3c">物</span>
      <span id="lgImg" style="--c:#2980b9">虚像</span>
      <span id="lgRay" style="--c:#f39c12">光路</span>
    </div>
    <div class="hint">拖动蜡烛（左右改物距，上下改物高）</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();

  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var u = 25;
  var candleH = 12;
  var MIN_H = 4, MAX_H = 28;
  var playing = false, playDir = 1, rafId = null;
  var dragging = false, dragOffX = 0, dragOffY = 0;

  function draw() {
    var TH = App.getTheme();
    opt.clear();

    opt.drawVerticalMirror(0, 35, -35);

    // 物
    opt.drawCandle(-u, candleH, '#f5d76e', '#c9a227', TH.obj);
    opt.drawLabel(-u, candleH, '物', TH.obj);

    // 虚像
    opt.drawImageCandle(u, candleH, true);
    opt.drawLabel(u, candleH, '虚像', TH.img);

    // 物像连线
    opt.drawDashedRay(-u, candleH, 0, candleH, '#bbb');
    opt.drawDashedRay(0, candleH, u, candleH, '#bbb');

    // 光路
    if (document.getElementById('showRay').checked) {
      opt.drawArrowRay(-u, candleH, 0, candleH, TH.ray3, 0.5);
      opt.drawArrowRay(0, candleH, -u * 0.8, candleH + candleH * 0.6, TH.ray3, 0.5);
    }

    opt.drawPoint(0, 0, '#2c3e50', 'O');

    document.getElementById('lgObj').style.setProperty('--c', TH.obj);
    document.getElementById('lgImg').style.setProperty('--c', TH.img);
    document.getElementById('lgRay').style.setProperty('--c', TH.ray3);

    document.getElementById('uVal').textContent = u.toFixed(1);
    document.getElementById('uRange').value = u;

    document.getElementById('readout').innerHTML =
      '物距 = <b>' + u.toFixed(1) + '</b> cm<br>' +
      '像距 = <b>' + u.toFixed(1) + '</b> cm（与物距相等）<br>' +
      '像的性质：<b>正立、等大、虚像</b><br>' +
      '物像关于镜面对称';
  }

  document.getElementById('uRange').addEventListener('input', function(e) { u = parseFloat(e.target.value); draw(); });
  document.getElementById('showRay').addEventListener('change', draw);
  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });

  function startDrag(e) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, t.clientY - rect.top);
    var wx = w[0], wy = w[1];
    if (Math.abs(wx - (-u)) < 10 && wy > -3 && wy < candleH + 6) {
      dragging = true;
      dragOffX = wx - (-u);
      dragOffY = wy - candleH;
      stopPlay();
      e.preventDefault();
    }
  }
  function moveDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, t.clientY - rect.top);
    u = Math.max(5, Math.min(50, -(w[0] - dragOffX)));
    candleH = Math.max(MIN_H, Math.min(MAX_H, w[1] - dragOffY));
    u = Math.round(u * 10) / 10;
    candleH = Math.round(candleH * 10) / 10;
    draw();
  }
  function endDrag() { dragging = false; }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', endDrag);

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var mode = document.getElementById('playDir').value;
    var spd = parseFloat(document.getElementById('speedRange').value) * 0.4;
    var dir = mode === 'away' ? 1 : mode === 'toward' ? -1 : playDir;
    u += dir * spd;
    if (u > 50) { u = 50; if (mode === 'pingpong') playDir = -1; }
    if (u < 5)  { u = 5;  if (mode === 'pingpong') playDir = 1; }
    u = Math.round(u * 10) / 10;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      if (!document.getElementById('playCandle').checked) { alert('请先勾选"蜡烛移动"'); return; }
      playing = true; playDir = 1;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    u = 25; candleH = 12; playDir = 1;
    document.getElementById('playCandle').checked = false;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
