<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角函数图像 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 公式展示区专属样式 */
  .formula-box {
    font-size: 14px;
    padding: 10px;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #eef1f5;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .formula-box code {
    background: #edf1f7;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    color: #2563eb;
  }
  /* 局部两列布局 */
  .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>三角函数变化曲线图</h1>

<div class="lab">
<aside class="lab-side">
  <div class="formula-box" id="formulaText">正在加载...</div>

  <label>函数类型
    <select id="funcType">
      <option value="sin" selected>正弦 sin</option>
      <option value="cos">余弦 cos</option>
      <option value="tan">正切 tan</option>
      <option value="cot">余切 cot</option>
      <option value="sec">正割 sec</option>
      <option value="csc">余割 csc</option>
    </select>
  </label>

  <div class="grid-2col" style="margin-bottom:12px;">
    <label>振幅 A<input id="amplitude" type="number" value="1" step="0.1"></label>
    <label>角频率 ω<input id="omega" type="number" value="1" step="0.1"></label>
  </div>
  <div class="grid-2col" style="margin-bottom:12px;">
    <label>相位 φ<input id="phase" type="number" value="0" step="0.1"></label>
    <label>垂直位移 D<input id="vertical" type="number" value="0" step="0.1"></label>
  </div>

  <label>横轴单位
    <select id="xUnit">
      <option value="rad" selected>弧度</option>
      <option value="deg">度</option>
    </select>
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div class="grid-2col" style="margin-bottom:12px;">
    <label>横轴 Min<input id="xMin" type="number" value="-6.2832" step="0.1"></label>
    <label>横轴 Max<input id="xMax" type="number" value="6.2832" step="0.1"></label>
  </div>
  <div class="grid-2col">
    <label>纵轴 Min<input id="yMin" type="number" value="-3" step="0.1"></label>
    <label>纵轴 Max<input id="yMax" type="number" value="3" step="0.1"></label>
  </div>

  <div class="row" style="margin-top:16px; gap:8px;">
    <button id="autoY" style="flex:1; background:#edf4ff; color:#2563eb;">自动适配 Y</button>
    <button id="reset" style="flex:1;" class="secondary">重置默认</button>
  </div>
</aside>

<main class="lab-main">
  <div class="stage" style="padding:0; overflow:hidden;">
    <canvas id="plot" style="height:520px;"></canvas>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script>
(function () {
  if(window.App) App.injectTopbar();
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');
  let dpr = 1;

  const funcs = {
    sin: { label: '正弦', color: '#d6336c', fn: (x) => Math.sin(x) },
    cos: { label: '余弦', color: '#1c7ed6', fn: (x) => Math.cos(x) },
    tan: { label: '正切', color: '#2f9e44', fn: (x) => Math.tan(x) },
    cot: { label: '余切', color: '#e8590c', fn: (x) => 1 / Math.tan(x) },
    sec: { label: '正割', color: '#7048e8', fn: (x) => 1 / Math.cos(x) },
    csc: { label: '余割', color: '#0ca678', fn: (x) => 1 / Math.sin(x) }
  };

  function getVal(id, def) {
    const el = document.getElementById(id);
    if (!el) return def;
    const v = parseFloat(el.value);
    return Number.isFinite(v) ? v : def;
  }

  function computeY(type, x, A, omega, phi, D, unit) {
    const angle = unit === 'deg' ? x * Math.PI / 180 : x;
    const theta = omega * angle + phi;
    return A * funcs[type].fn(theta) + D;
  }

  function formatNumber(v) {
    if (v === 0 || Math.abs(v) < 1e-12) return '0';
    return parseFloat(v.toFixed(6)).toString();
  }

  function formatPi(v) {
    if (Math.abs(v) < 1e-10) return '0';
    const r = v / Math.PI;
    const denominators = [1, 2, 3, 4, 6];
    let bestNum = 0, bestDen = 1, bestErr = Infinity;

    for (const den of denominators) {
      const num = Math.round(r * den);
      const err = Math.abs(r - num / den);
      if (err < bestErr) { bestErr = err; bestNum = num; bestDen = den; }
    }
    if (bestErr < 0.01) {
      if (bestDen === 1) {
        if (bestNum === 1) return 'π';
        if (bestNum === -1) return '-π';
        if (bestNum === 0) return '0';
        return bestNum + 'π';
      } else {
        if (bestNum === 1) return 'π/' + bestDen;
        if (bestNum === -1) return '-π/' + bestDen;
        if (bestNum === 0) return '0';
        return bestNum + 'π/' + bestDen;
      }
    }
    return v.toFixed(2);
  }

  function formatXAxis(v, unit) {
    if (unit === 'deg') return parseFloat(v.toFixed(6)) + '°';
    return formatPi(v);
  }

  function niceYStep(range, target = 7) {
    const raw = range / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const residual = raw / mag;
    let nice;
    if (residual < 1.5) nice = 1;
    else if (residual < 3.5) nice = 2;
    else if (residual < 7.5) nice = 5;
    else nice = 10;
    return nice * mag;
  }

  function getYTicks(min, max) {
    const range = max - min;
    if (range <= 0) return [];
    const step = niceYStep(range);
    const start = Math.ceil(min / step - 1e-9) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(v);
    return ticks;
  }

  function getXTicks(min, max, unit) {
    const range = max - min;
    if (range <= 0) return [];
    let step;
    if (unit === 'deg') {
      const candidates = [10, 15, 30, 45, 60, 90, 120, 180, 360];
      step = candidates.find((s) => range / 8 <= s) || 360;
    } else {
      const candidates = [Math.PI/6, Math.PI/4, Math.PI/3, Math.PI/2, Math.PI, 2*Math.PI, 4*Math.PI, 8*Math.PI];
      step = candidates.find((s) => range / 8 <= s) || candidates[candidates.length - 1];
    }
    const start = Math.ceil(min / step - 1e-9) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(v);
    return ticks;
  }

  function updateFormula() {
    const type = document.getElementById('funcType').value;
    const A = getVal('amplitude', 1), omega = getVal('omega', 1);
    const phi = getVal('phase', 0), D = getVal('vertical', 0);
    const unit = document.getElementById('xUnit').value;

    const phiStr = phi === 0 ? '' : (phi > 0 ? ' + ' + phi : ' - ' + Math.abs(phi));
    const dStr = D === 0 ? '' : (D > 0 ? ' + ' + D : ' - ' + Math.abs(D));
    const xPart = unit === 'deg' ? 'πx/180' : 'x';
    const formula = `y = ${A}·${type}(${omega}${xPart}${phiStr})${dStr}`;

    document.getElementById('formulaText').innerHTML =
      `<span style="color:${funcs[type].color}; font-weight:600;">${funcs[type].label}</span><br>` +
      `表达式：<code>${formula}</code>`;
  }

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const margin = { top: 18, right: 28, bottom: 48, left: 68 };
    const plotW = w - margin.left - margin.right;
    const plotH = h - margin.top - margin.bottom;
    const plotLeft = margin.left, plotTop = margin.top;
    const plotRight = plotLeft + plotW, plotBottom = plotTop + plotH;

    ctx.clearRect(0, 0, w, h);
    if (plotW <= 0 || plotH <= 0) return;

    const type = document.getElementById('funcType').value;
    const A = getVal('amplitude', 1), omega = getVal('omega', 1);
    const phi = getVal('phase', 0), D = getVal('vertical', 0);
    const xUnit = document.getElementById('xUnit').value;
    const xMin = getVal('xMin', -2 * Math.PI), xMax = getVal('xMax', 2 * Math.PI);
    const yMin = getVal('yMin', -3), yMax = getVal('yMax', 3);

    if (xMin >= xMax || yMin >= yMax) {
      ctx.fillStyle = '#a00'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('范围设置有误：最小值需小于最大值', w / 2, h / 2);
      return;
    }

    updateFormula();

    const xRange = xMax - xMin, yRange = yMax - yMin;
    const xToPix = (x) => plotLeft + (x - xMin) / xRange * plotW;
    const yToPix = (y) => plotBottom - (y - yMin) / yRange * plotH;

    const xTicks = getXTicks(xMin, xMax, xUnit);
    const yTicks = getYTicks(yMin, yMax);

    // 网格
    ctx.strokeStyle = '#e5e9ef'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const t of xTicks) { const px = xToPix(t); ctx.moveTo(px, plotTop); ctx.lineTo(px, plotBottom); }
    for (const t of yTicks) { const py = yToPix(t); ctx.moveTo(plotLeft, py); ctx.lineTo(plotRight, py); }
    ctx.stroke();

    // 坐标轴
    const effXAxisY = (0 >= yMin && 0 <= yMax) ? yToPix(0) : (Math.abs(yMin) < Math.abs(yMax) ? plotBottom : plotTop);
    const yAxisX = (0 >= xMin && 0 <= xMax) ? xToPix(0) : (Math.abs(xMin) < Math.abs(xMax) ? plotLeft : plotRight);

    ctx.strokeStyle = '#7a8390'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(plotLeft, effXAxisY); ctx.lineTo(plotRight, effXAxisY);
    ctx.moveTo(yAxisX, plotTop); ctx.lineTo(yAxisX, plotBottom);
    ctx.stroke();

    // 刻度标签
    ctx.fillStyle = '#333'; ctx.font = '12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const t of xTicks) ctx.fillText(formatXAxis(t, xUnit), xToPix(t), plotBottom + 8);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const t of yTicks) ctx.fillText(formatNumber(t), plotLeft - 8, yToPix(t));

    // 标题
    ctx.save(); ctx.translate(16, plotTop + plotH / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#555';
    ctx.fillText('y', 0, 0); ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = '#555';
    ctx.fillText('x', plotRight - 14, plotBottom + 8);

    // 曲线
    ctx.save(); ctx.beginPath(); ctx.rect(plotLeft, plotTop, plotW, plotH); ctx.clip();
    ctx.beginPath();
    let drawing = false, prevY = null;
    const samples = Math.max(600, Math.ceil(plotW * 2));
    const stepX = xRange / samples;
    const maxJump = plotH * 1.5;

    for (let i = 0; i <= samples; i++) {
      const x = xMin + i * stepX;
      const yVal = computeY(type, x, A, omega, phi, D, xUnit);
      if (!Number.isFinite(yVal)) { drawing = false; continue; }
      const yPix = yToPix(yVal), xPix = xToPix(x);

      if (!drawing) { ctx.moveTo(xPix, yPix); drawing = true; }
      else if (Math.abs(yPix - prevY) > maxJump) { ctx.moveTo(xPix, yPix); }
      else { ctx.lineTo(xPix, yPix); }
      prevY = yPix;
    }
    ctx.strokeStyle = funcs[type].color; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke(); ctx.restore();
  }

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function autoYRange() {
    const type = document.getElementById('funcType').value;
    const A = getVal('amplitude', 1), omega = getVal('omega', 1);
    const phi = getVal('phase', 0), D = getVal('vertical', 0);
    const xUnit = document.getElementById('xUnit').value;
    const xMin = getVal('xMin', -2 * Math.PI), xMax = getVal('xMax', 2 * Math.PI);

    if (xMin >= xMax) { draw(); return; }
    const samples = 2000;
    let min = Infinity, max = -Infinity;
    for (let i = 0; i <= samples; i++) {
      const x = xMin + (xMax - xMin) * i / samples;
      const y = computeY(type, x, A, omega, phi, D, xUnit);
      if (Number.isFinite(y) && Math.abs(y) < 1000) {
        if (y < min) min = y;
        if (y > max) max = y;
      }
    }
    if (!Number.isFinite(min) || !Number.isFinite(max) || min > max) { min = -3; max = 3; }
    const pad = (max - min) * 0.15 || 1;
    document.getElementById('yMin').value = (min - pad).toFixed(4);
    document.getElementById('yMax').value = (max + pad).toFixed(4);
    draw();
  }

  function resetControls() {
    document.getElementById('funcType').value = 'sin';
    document.getElementById('amplitude').value = 1;
    document.getElementById('omega').value = 1;
    document.getElementById('phase').value = 0;
    document.getElementById('vertical').value = 0;
    document.getElementById('xUnit').value = 'rad';
    document.getElementById('xMin').value = (-2 * Math.PI).toFixed(4);
    document.getElementById('xMax').value = (2 * Math.PI).toFixed(4);
    document.getElementById('yMin').value = -3;
    document.getElementById('yMax').value = 3;
    draw();
  }

  function bindEvents() {
    const inputs = document.querySelectorAll('input, select');
    for (const el of inputs) {
      el.addEventListener('input', draw);
      el.addEventListener('change', draw);
    }
    document.getElementById('autoY').addEventListener('click', autoYRange);
    document.getElementById('reset').addEventListener('click', resetControls);
    window.addEventListener('resize', resizeCanvas);
  }

  window.addEventListener('DOMContentLoaded', () => {
    bindEvents();
    resizeCanvas();
  });
})();
</script>
</body>
</html>
