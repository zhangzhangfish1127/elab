<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参照物与相对运动 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>参照物与相对运动</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>参照物</th><th>观察结果</th></tr></thead>
    <tbody>
      <tr data-case="ground"><td>地面</td><td>两车各按自身速度运动</td></tr>
      <tr data-case="A"><td>车 A</td><td>B 以相对速度运动，A 静止</td></tr>
      <tr data-case="B"><td>车 B</td><td>A 以相对速度运动，B 静止</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div class="row">
    <label style="margin:0;white-space:nowrap">参照物</label>
    <select id="refSel">
      <option value="ground" selected>地面（树）</option>
      <option value="A">车 A</option>
      <option value="B">车 B</option>
    </select>
  </div>

  <label>车 A 速度 vA = <span id="vAVal">5.0</span> m/s
    <input type="range" id="vARange" min="-10" max="15" value="5" step="0.5">
  </label>
  <label>车 B 速度 vB = <span id="vBVal">10.0</span> m/s
    <input type="range" id="vBRange" min="-10" max="15" value="10" step="0.5">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">切换参照物，观察运动状态的"相对"变化</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var vA = 5, vB = 10;
  var t = 0;
  var playing = false, rafId = null;
  var xA = 0, xB = 0;    // 两车在世界中的位置（米）
  var treeX = 30;         // 树的位置（米）

  function pxPerMeter() { return Math.min(8, (opt.W - 100) / 80); }

  function getRef() {
    return document.getElementById('refSel').value;
  }

  // 相对位置（相对于参照物）
  function relPos(x, ref) {
    if (ref === 'ground') return x;
    if (ref === 'A') return x - xA;
    if (ref === 'B') return x - xB;
    return x;
  }
  function relVel(v, ref) {
    if (ref === 'ground') return v;
    if (ref === 'A') return v - vA;
    if (ref === 'B') return v - vB;
    return v;
  }

  function drawCar(cx, cy, color, label, v) {
    var ctx = opt.ctx;
    var w = 70, h = 34;
    ctx.save();
    var g = ctx.createLinearGradient(cx - w/2, 0, cx + w/2, 0);
    g.addColorStop(0, color);
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.fillRect(cx - w/2, cy - h, w, h);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - w/2, cy - h, w, h);
    // 车顶
    ctx.fillStyle = color;
    ctx.fillRect(cx - 22, cy - h - 14, 44, 14);
    // 车轮
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(cx - 20, cy, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 20, cy, 8, 0, Math.PI*2); ctx.fill();
    // 标签
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy - h/2);
    // 速度
    if (Math.abs(v) > 0.1) {
      var dir = v > 0 ? 1 : -1;
      var aLen = Math.min(60, Math.abs(v) * 4);
      ctx.strokeStyle = '#27ae60';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + dir * (w/2 + 6), cy - h/2);
      ctx.lineTo(cx + dir * (w/2 + 6 + aLen), cy - h/2);
      ctx.stroke();
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.moveTo(cx + dir * (w/2 + 6 + aLen), cy - h/2);
      ctx.lineTo(cx + dir * (w/2 + 6 + aLen - 12), cy - h/2 - 8);
      ctx.lineTo(cx + dir * (w/2 + 6 + aLen - 12), cy - h/2 + 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#27ae60';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('v=' + Math.abs(v).toFixed(1) + ' m/s', cx + dir * (w/2 + 6 + aLen + 4), cy - h/2 - 8);
    }
    ctx.restore();
  }

  function drawTree(cx, groundY) {
    var ctx = opt.ctx;
    ctx.save();
    // 树干
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(cx - 5, groundY - 50, 10, 50);
    // 树冠
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.arc(cx, groundY - 65, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx - 18, groundY - 55, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 18, groundY - 55, 18, 0, Math.PI * 2);
    ctx.fill();
    // 标签
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('树（地面）', cx, groundY - 92);
    ctx.restore();
  }

  function draw() {
    var ctx = opt.ctx;
    var W = opt.W, H = opt.H;
    opt.clear();

    var ref = getRef();
    var ppm = pxPerMeter();
    var centerX = W / 2;
    var groundY = H * 0.62;

    // 地面
    ctx.save();
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.fillStyle = 'rgba(127,140,141,0.08)';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.restore();

    // 坐标换算（世界坐标 → 屏幕）
    function worldToScreen(wx) {
      var refPos = 0;
      if (ref === 'A') refPos = xA;
      else if (ref === 'B') refPos = xB;
      // 相对位置
      var rel = wx - refPos;
      return centerX + rel * ppm;
    }

    // 参照物高亮
    ctx.save();
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    var refName = ref === 'ground' ? '地面（树）' : (ref === 'A' ? '车 A' : '车 B');
    ctx.fillStyle = '#3498db';
    ctx.fillText('参照物：' + refName, W/2, 30);
    ctx.restore();

    // 画树（永远画，但位置随参照物变）
    var treeScreen = worldToScreen(treeX);
    if (treeScreen > -60 && treeScreen < W + 60) {
      drawTree(treeScreen, groundY);
    }

    // 画车 A
    var aScreen = worldToScreen(xA);
    if (aScreen > -100 && aScreen < W + 100) {
      var va = relVel(vA, ref);
      drawCar(aScreen, groundY, '#e74c3c', 'A', va);
    }
    // 画车 B
    var bScreen = worldToScreen(xB);
    if (bScreen > -100 && bScreen < W + 100) {
      var vb = relVel(vB, ref);
      drawCar(bScreen, groundY + 80, '#2980b9', 'B', vb);
    }

    // 表格高亮
    document.querySelectorAll('#caseTable tbody tr').forEach(function (tr) {
      tr.classList.toggle('active', tr.dataset.case === ref);
    });

    // 侧栏
    document.getElementById('vAVal').textContent = vA.toFixed(1);
    document.getElementById('vBVal').textContent = vB.toFixed(1);
    document.getElementById('vARange').value = vA;
    document.getElementById('vBRange').value = vB;

    // 读数
    var relV = vB - vA;
    var line1 = '地面观察：';
    if (vA === 0 && vB === 0) line1 += '两车都静止';
    else line1 += 'A 速度 ' + vA.toFixed(1) + ' m/s，B 速度 ' + vB.toFixed(1) + ' m/s';

    var line2 = '';
    if (ref === 'ground') {
      line2 = 'A、B 相对地面各自运动';
    } else if (ref === 'A') {
      if (Math.abs(relV) < 0.1) line2 = 'A 看 B：<b>B 静止不动</b>';
      else line2 = 'A 看 B：B 以 <b>' + Math.abs(relV).toFixed(1) + ' m/s</b> 向' + (relV > 0 ? '右' : '左') + '运动';
    } else {
      if (Math.abs(relV) < 0.1) line2 = 'B 看 A：<b>A 静止不动</b>';
      else line2 = 'B 看 A：A 以 <b>' + Math.abs(relV).toFixed(1) + ' m/s</b> 向' + (relV < 0 ? '右' : '左') + '运动';
    }

    document.getElementById('readout').innerHTML =
      line1 + '<br>' + line2 + '<br>' +
      '<span style="font-size:12px;color:#888">' +
      'A、B 相对速度 = |vB - vA| = ' + Math.abs(relV).toFixed(1) + ' m/s</span>';
  }

  document.getElementById('refSel').addEventListener('change', function(){ draw(); });
  document.getElementById('vARange').addEventListener('input', function(e){ vA = parseFloat(e.target.value); draw(); });
  document.getElementById('vBRange').addEventListener('input', function(e){ vB = parseFloat(e.target.value); draw(); });
  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    xA = 0; xB = -20; t = 0;
    document.getElementById('refSel').value = 'ground';
    document.getElementById('vARange').value = 5;
    document.getElementById('vBRange').value = 10;
    vA = 5; vB = 10;
    stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value);
    var dt = 0.03 * spd;
    xA += vA * dt;
    xB += vB * dt;
    // 让两车保持在视野内
    var ref = getRef();
    var refPos = ref === 'A' ? xA : (ref === 'B' ? xB : 0);
    if (xA - refPos > 40) { xA -= 40; xB -= 40; }
    if (xB - refPos > 40) { xA -= 40; xB -= 40; }
    if (xA - refPos < -40) { xA += 40; xB += 40; }
    if (xB - refPos < -40) { xA += 40; xB += 40; }
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  xA = 0; xB = -20;
  draw();
})();
</script>
</body>
</html>
