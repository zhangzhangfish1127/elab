<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凸透镜成像 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html" data-i18n="common.home">← 返回主页</a>
<h1 data-i18n="cv.title">凸透镜成像</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>条件</th><th>像的性质</th></tr></thead>
    <tbody>
      <tr data-case="1"><td>1</td><td>u &gt; 2f</td><td>倒立、缩小、实像</td></tr>
      <tr data-case="2"><td>2</td><td>u = 2f</td><td>倒立、等大、实像</td></tr>
      <tr data-case="3"><td>3</td><td>f &lt; u &lt; 2f</td><td>倒立、放大、实像</td></tr>
      <tr data-case="4"><td>4</td><td>u = f</td><td>不成像</td></tr>
      <tr data-case="5"><td>5</td><td>u &lt; f</td><td>正立、放大、虚像</td></tr>
    </tbody>
  </table>

  <h3 data-i18n="common.panel">控制面板</h3>

  <label>焦距 f = <span id="fVal">10.0</span> cm
    <input type="range" id="fRange" min="4" max="20" value="10" step="0.5">
  </label>
  <label>物距 u = <span id="uVal">25.0</span> cm
    <input type="range" id="uRange" min="3" max="80" value="25" step="0.5">
  </label>
  <label>像距 v = <span id="vVal">—</span> cm
    <input type="range" id="vRange" min="-80" max="80" value="0" step="0.5" disabled>
  </label>
  <div class="row"><input type="checkbox" id="screenToggle" checked><label for="screenToggle" style="margin:0">显示光屏</label></div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <div style="font-size:13px;color:#666;margin-bottom:8px" data-i18n="common.playMode">播放模式</div>
  <div class="row"><input type="checkbox" id="playCandle"><label for="playCandle" style="margin:0">蜡烛动</label></div>
  <div class="row"><input type="checkbox" id="playScreen"><label for="playScreen" style="margin:0">光屏动</label></div>
  <div class="row">
    <label style="margin:0;white-space:nowrap" data-i18n="common.direction">方向</label>
    <select id="playDir">
      <option value="toward">靠近透镜</option>
      <option value="away">远离透镜</option>
      <option value="pingpong" selected>来回</option>
    </select>
  </div>
  <label><span data-i18n="common.speed">速度</span> = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>

  <button id="playBtn" data-i18n="common.play">▶ 播放</button>
  <button id="resetBtn" class="secondary" data-i18n="common.reset">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="legend">
      <span id="lgP1" style="--c:#f39c12">平行主光轴 → 过焦点 F'</span>
      <span id="lgP2" style="--c:#27ae60">过光心 → 方向不变</span>
      <span id="lgImg" style="--c:#2980b9">像</span>
    </div>
    <div class="hint">拖动蜡烛或光屏，观察像的变化</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  App.applyLang();

  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 4 });

  var f = 10;
  var u = 25;
  var candleH = 12;
  var screenX = 30;
  var screenH = 40;
  var drawRange = 90;
  var EPS = 0.5;
  var showScreen = true;
  var dragging = null;
  var playing = false;
  var playDirVal = 1;
  var rafId = null;

  function getImage() {
    if (u <= 0) return null;
    return window.convexLensImage(u, f);
  }
  function getCase(u, f) {
    if (Math.abs(u - f) < EPS) return 4;
    if (u < f) return 5;
    if (Math.abs(u - 2 * f) < EPS) return 2;
    if (u < 2 * f) return 3;
    return 1;
  }
  function highlightCase(c) {
    document.querySelectorAll('#caseTable tbody tr').forEach(function(tr) {
      tr.classList.toggle('active', tr.dataset.case === String(c));
    });
  }

  function draw() {
    var TH = App.getTheme();
    opt.clear();
    opt.drawAxis();

    var lensHeight = Math.min(f * 3, 55);
    opt.drawLens(0, lensHeight, 'convex');

    opt.drawPoint(f, 0, '#e67e22', "F'");
    opt.drawPoint(-f, 0, '#e67e22', 'F');
    opt.drawPoint(2*f, 0, '#e67e22', "2F'");
    opt.drawPoint(-2*f, 0, '#e67e22', '2F');

    var img = getImage();

    if (showScreen) {
      var sX = screenX, highlight = false;
      if (img && img.imageType === 'real' && isFinite(img.v)) { sX = img.v; highlight = true; }
      opt.drawScreen(sX, screenH, highlight);
      opt.drawLabel(sX, screenH / 2, '光屏', '#7f8c8d');
    }

    var candleX = -u;
    opt.drawCandle(candleX, candleH);
    opt.drawLabel(candleX, candleH, '物', TH.obj);

    if (img && isFinite(img.v)) {
      var topX = candleX, topY = candleH, v = img.v;
      var imgTopY = candleH * img.m;
      opt.drawRay(topX, topY, 0, topY, TH.ray3);
      opt.drawRay(0, topY, v, imgTopY, TH.ray3);
      opt.drawRay(topX, topY, 0, 0, TH.ray2);
      opt.drawRay(0, 0, v, imgTopY, TH.ray2);
      if (img.imageType === 'virtual') {
        opt.drawDashedRay(0, topY, v, imgTopY, TH.ray3);
        opt.drawDashedRay(0, 0, v, imgTopY, TH.ray2);
      }
      if (Math.abs(v) < drawRange + 60) {
        if (img.imageType === 'real') {
          opt.drawImageCandle(v, imgTopY, false);
          opt.drawLabel(v, imgTopY, '实像', TH.img);
        } else {
          opt.drawImageCandle(v, imgTopY, true);
          opt.drawLabel(v, imgTopY, '虚像', TH.img);
        }
      }
    } else {
      var tX = candleX, tY = candleH;
      opt.drawRay(tX, tY, 0, tY, TH.ray3);
      opt.drawRay(0, tY, drawRange, tY, TH.ray3);
      opt.drawRay(tX, tY, 0, 0, TH.ray2);
      opt.drawRay(0, 0, drawRange, tY * 0.5, TH.ray2);
    }

    highlightCase(getCase(u, f));

    document.getElementById('uVal').textContent = u.toFixed(1);
    document.getElementById('uRange').value = u;
    document.getElementById('fVal').textContent = f.toFixed(1);
    document.getElementById('fRange').value = f;

    var vLab = document.getElementById('vVal');
    var vEl = document.getElementById('vRange');
    if (img && isFinite(img.v)) {
      vLab.textContent = img.v.toFixed(1);
      vEl.value = Math.max(-80, Math.min(80, img.v));
    } else {
      vLab.textContent = '∞'; vEl.value = 0;
    }

    // 图例颜色
    document.getElementById('lgP1').style.setProperty('--c', TH.ray3);
    document.getElementById('lgP2').style.setProperty('--c', TH.ray2);
    document.getElementById('lgImg').style.setProperty('--c', TH.img);

    // 读数
    var info = document.getElementById('readout');
    if (!img || !isFinite(img.v)) {
      info.innerHTML = '物距 u = <b>' + u.toFixed(1) + '</b> cm　焦距 f = <b>' + f + '</b> cm<br><b>不成像</b>（物体在焦点上，出射光平行）';
    } else {
      var typeText = img.imageType === 'real' ? '倒立实像' : '正立虚像';
      var mAbs = Math.abs(img.m);
      var sizeText = mAbs > 1.01 ? '放大' : mAbs < 0.99 ? '缩小' : '等大';
      var where = img.imageType === 'real' ? '透镜右侧' : '透镜左侧（与物同侧）';
      info.innerHTML =
        'u = <b>' + u.toFixed(1) + '</b> cm　f = <b>' + f + '</b> cm<br>' +
        'v = <b>' + img.v.toFixed(1) + '</b> cm（' + where + '）<br>' +
        '|m| = <b>' + mAbs.toFixed(2) + '</b><br>' +
        '性质：<b>' + typeText + '、' + sizeText + '</b>';
    }
  }

  // 拖动
  function startDrag(e) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, t.clientY - rect.top);
    if (Math.abs(w[0] - (-u)) < 8 && w[1] > -5) dragging = 'candle';
    else if (showScreen && Math.abs(w[0] - screenX) < 6) dragging = 'screen';
  }
  function moveDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    var w = opt.toWorld(t.clientX - rect.left, 0);
    if (dragging === 'candle') u = Math.max(3, Math.min(80, -w[0]));
    else if (dragging === 'screen') screenX = Math.max(2, Math.min(drawRange, w[0]));
    draw();
  }
  function endDrag() { dragging = null; }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', endDrag);

  document.getElementById('fRange').addEventListener('input', function(e) { f = parseFloat(e.target.value); draw(); });
  document.getElementById('uRange').addEventListener('input', function(e) { u = parseFloat(e.target.value); draw(); });
  document.getElementById('screenToggle').addEventListener('change', function(e) { showScreen = e.target.checked; draw(); });
  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    f = 10; u = 25; screenX = 30;
    document.getElementById('playCandle').checked = false;
    document.getElementById('playScreen').checked = false;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = App.t('common.play');
  }

  function tick() {
    if (!playing) return;
    var playCandle = document.getElementById('playCandle').checked;
    var playScreen = document.getElementById('playScreen').checked;
    var dirMode = document.getElementById('playDir').value;
    var speedMul = parseFloat(document.getElementById('speedRange').value);
    var speed = 0.4 * speedMul;
    if (!playCandle && !playScreen) { stopPlay(); return; }

    var dir = playDirVal;
    if (dirMode === 'toward') dir = 1;
    else if (dirMode === 'away') dir = -1;

    if (playCandle) {
      u -= dir * speed;
      if (u > 80) { u = 80; if (dirMode === 'pingpong') playDirVal = 1; }
      if (u < 3)  { u = 3;  if (dirMode === 'pingpong') playDirVal = -1; }
    }
    if (playScreen) {
      screenX -= dir * speed;
      if (screenX > drawRange) { screenX = drawRange; if (dirMode === 'pingpong') playDirVal = 1; }
      if (screenX < 2)         { screenX = 2;         if (dirMode === 'pingpong') playDirVal = -1; }
    }
    u = Math.round(u * 10) / 10;
    screenX = Math.round(screenX * 10) / 10;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      var playCandle = document.getElementById('playCandle').checked;
      var playScreen = document.getElementById('playScreen').checked;
      if (!playCandle && !playScreen) { alert('请至少勾选"蜡烛动"或"光屏动"'); return; }
      playing = true; playDirVal = 1;
      document.getElementById('playBtn').textContent = App.t('common.pause');
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('langchange', function() {
    document.getElementById('playBtn').textContent = playing ? App.t('common.pause') : App.t('common.play');
  });
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });

  draw();
})();
</script>
</body>
</html>
