<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水中鱼虚像与全反射 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 警告标签样式 */
  .warning-badge {
    background: #ef4444; color: #fff; font-weight: bold;
    padding: 4px 12px; border-radius: 16px; font-size: 13px;
    display: inline-block; text-align: center;
    margin-top: 8px;
  }
  
  /* 图例专属样式 */
  .legend-box {
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    font-size: 12px; padding: 10px; background: #f8fafc;
    border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 16px;
  }
  .legend-box span { display: flex; align-items: center; gap: 4px; color: #475569;}
  .legend-box .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
  
  /* Canvas 容器，允许在画布外正常滑动 */
  .canvas-container {
    width: 100%;
    background: #fff;
    border-radius: 8px;
  }
  canvas { 
    display: block; 
    width: 100%; 
    aspect-ratio: 4/3; 
    touch-action: none; /* 只在这个画布上禁止默认触摸 */
    cursor: grab; 
  }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>水中鱼虚像与全反射</h1>

<div class="lab">
<aside class="lab-side">
  <!-- 顶部规律表格 -->
  <table class="case-table">
    <thead>
      <tr><th>现象</th><th>原因</th></tr>
    </thead>
    <tbody>
      <tr class="active"><td>虚像变浅</td><td>光从水射入空气发生折射</td></tr>
      <tr class="active"><td>视深 &lt; 实际深</td><td>折射光线的反向延长线相交</td></tr>
      <tr class="active"><td>全反射</td><td>入射角大于临界角（无折射光）</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  
  <label>水的折射率 n = <span id="n1Value">1.33</span>
    <input type="range" id="n1Slider" min="1.00" max="2.00" step="0.01" value="1.33">
  </label>

  <label>两条光线夹角 = <span id="angleDisplay">45.0</span>°
    <input type="range" id="angleSlider" min="2" max="170" step="0.5" value="45">
  </label>

  <div class="row" style="margin-bottom:12px;">
    <label style="margin:0; width:60px;">拖动模式</label>
    <select id="modeSelect" style="flex:1;">
      <option value="symmetric">对称变化</option>
      <option value="fixA">固定 A 点</option>
      <option value="fixB" selected>固定 B 点 (人眼)</option>
    </select>
  </div>

  <button id="resetBtn" class="secondary" style="margin-top:10px;">↺ 重置</button>

  <div id="warningContainer"></div>

  <div class="legend-box">
    <span><span class="dot" style="background:#f59e0b;"></span> 鱼</span>
    <span><span class="dot" style="background:#0ea5e9;"></span> 虚像</span>
    <span><span class="dot" style="background:#e74c3c;"></span> 入射光</span>
    <span><span class="dot" style="background:#27ae60;"></span> 折射光</span>
    <span><span class="dot" style="background:#f39c12;"></span> 延长线</span>
    <span style="color:#2c3e50;">👀 人眼</span>
  </div>
  
  <div style="font-size:12px; color:#888; margin-top:10px; line-height:1.5;">
    💡 <b>操作提示：</b><br>
    你可以直接用手指在右侧画布中拖拽鱼（🐠）或者水面上的入射点（A、B），观察光路变化。
  </div>
</aside>

<main class="lab-main">
  <div class="stage" style="padding:16px; background:#fff;">
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish · <a href="../about.html">简介</a> · <a href="../feedback.html">反馈</a> · <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script>
(function() {
  if(window.App) App.injectTopbar();
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  // 逻辑坐标系的固定尺寸
  const W = 800, H = 600;
  const WATER_Y = 300;
  const NORMAL_X = 300;
  const CENTER_X = 450;

  // 物理对象状态
  let fish = { x: 400, y: 460 };
  let pointA = { x: 350, y: WATER_Y };
  let pointB = { x: 550, y: WATER_Y };
  let n1 = 1.33;
  const n2 = 1.0;

  let mode = 'fixB';
  let dragTarget = null;
  let dragOffset = { x: 0, y: 0 };

  // UI 元素
  const n1Slider = document.getElementById('n1Slider');
  const n1Value = document.getElementById('n1Value');
  const angleSlider = document.getElementById('angleSlider');
  const angleDisplay = document.getElementById('angleDisplay');
  const modeSelect = document.getElementById('modeSelect');
  const resetBtn = document.getElementById('resetBtn');
  const warningContainer = document.getElementById('warningContainer');

  // --- 物理计算 ---
  function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

  function refractDirection(P, I, n1, n2) {
    const dx = I.x - P.x, dy = I.y - P.y;
    const len = Math.hypot(dx, dy);
    if (len < 1e-6) return null;
    const sinTheta1 = Math.abs(dx) / len;
    const ratio = n1 / n2;
    const sinTheta2 = ratio * sinTheta1;
    if (sinTheta2 > 1.0) return null; // 全反射
    const cosTheta2 = Math.sqrt(1 - sinTheta2 * sinTheta2);
    const dirX = dx > 0 ? 1 : -1;
    return { x: dirX * sinTheta2, y: -cosTheta2 };
  }

  function lineIntersection(P1, D1, P2, D2) {
    const det = D1.x * D2.y - D1.y * D2.x;
    if (Math.abs(det) < 1e-12) return null;
    const t = ((P2.x - P1.x) * D2.y - (P2.y - P1.y) * D2.x) / det;
    return { x: P1.x + t * D1.x, y: P1.y + t * D1.y, t: t };
  }

  function computeVirtualImage(P, A, B, n1, n2) {
    const dirA = refractDirection(P, A, n1, n2);
    const dirB = refractDirection(P, B, n1, n2);
    if (!dirA || !dirB) return null;
    const D1 = { x: -dirA.x, y: -dirA.y };
    const D2 = { x: -dirB.x, y: -dirB.y };
    const inter = lineIntersection(A, D1, B, D2);
    if (!inter || inter.y < WATER_Y || inter.t < 0) return null;
    return inter;
  }

  function getCurrentAngle() {
    const v1 = { x: pointA.x - fish.x, y: pointA.y - fish.y };
    const v2 = { x: pointB.x - fish.x, y: pointB.y - fish.y };
    const dot = v1.x * v2.x + v1.y * v2.y;
    const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
    if (mag1 < 1 || mag2 < 1) return 0;
    return Math.acos(Math.min(1, Math.max(-1, dot / (mag1 * mag2)))) * 180 / Math.PI;
  }

  function setAngle(targetDeg) {
    targetDeg = Math.min(170, Math.max(2, targetDeg));
    const P = fish;
    const depth = P.y - WATER_Y;
    if (depth < 10) return;

    if (mode === 'symmetric') {
      let d = depth * Math.tan(targetDeg / 2 * Math.PI / 180);
      let newA = CENTER_X - d, newB = CENTER_X + d;
      if (newA < 5) { newA = 5; newB = CENTER_X + (CENTER_X - newA); }
      if (newB > W - 5) { newB = W - 5; newA = CENTER_X - (newB - CENTER_X); }
      pointA.x = newA; pointB.x = newB;
    } else if (mode === 'fixA') {
      let lo = Math.max(5, pointB.x - 200), hi = Math.min(W - 5, pointB.x + 200), best = pointB.x;
      for (let i = 0; i < 40; i++) {
        let mid = (lo + hi) / 2;
        let v1 = { x: pointA.x - P.x, y: pointA.y - P.y };
        let v2 = { x: mid - P.x, y: WATER_Y - P.y };
        let dot = v1.x * v2.x + v1.y * v2.y;
        let angle = Math.acos(Math.min(1, Math.max(-1, dot / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y))))) * 180 / Math.PI;
        if (angle < targetDeg) lo = mid; else hi = mid;
        best = mid;
        if (Math.abs(angle - targetDeg) < 0.1 || hi - lo < 0.5) break;
      }
      pointB.x = Math.min(W - 5, Math.max(5, best));
      if (Math.abs(pointB.x - pointA.x) < 15) pointB.x = pointB.x > pointA.x ? pointA.x + 25 : pointA.x - 25;
    } else if (mode === 'fixB') {
      let lo = Math.max(5, pointA.x - 200), hi = Math.min(W - 5, pointA.x + 200), best = pointA.x;
      for (let i = 0; i < 40; i++) {
        let mid = (lo + hi) / 2;
        let v1 = { x: mid - P.x, y: WATER_Y - P.y };
        let v2 = { x: pointB.x - P.x, y: pointB.y - P.y };
        let dot = v1.x * v2.x + v1.y * v2.y;
        let angle = Math.acos(Math.min(1, Math.max(-1, dot / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y))))) * 180 / Math.PI;
        if (angle < targetDeg) lo = mid; else hi = mid;
        best = mid;
        if (Math.abs(angle - targetDeg) < 0.1 || hi - lo < 0.5) break;
      }
      pointA.x = Math.min(W - 5, Math.max(5, best));
      if (Math.abs(pointA.x - pointB.x) < 15) pointA.x = pointA.x < pointB.x ? pointB.x - 25 : pointB.x + 25;
    }
    pointA.y = WATER_Y; pointB.y = WATER_Y;
    draw();
  }

  // --- 渲染 ---
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const TH = App.getTheme(); // 获取无障碍配色

    // 1. 画空气 (纯白背景)
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, WATER_Y);

    // 2. 画水 (极浅的灰色)
    ctx.fillStyle = '#f0f4f8'; ctx.fillRect(0, WATER_Y, W, H - WATER_Y);

    // 3. 画水面 (统一用正常线条颜色)
    ctx.beginPath(); ctx.moveTo(0, WATER_Y); ctx.lineTo(W, WATER_Y);
    ctx.strokeStyle = TH.normal; ctx.lineWidth = 2; ctx.stroke();

    // 4. 画参考线
    ctx.beginPath(); ctx.setLineDash([6, 8]); ctx.moveTo(NORMAL_X, 0); ctx.lineTo(NORMAL_X, H);
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif';
    ctx.fillText('法线(参考)', NORMAL_X - 28, 20);

    // 5. 计算物理量
    const dirA = refractDirection(fish, pointA, n1, n2);
    const dirB = refractDirection(fish, pointB, n1, n2);
    const virtual = computeVirtualImage(fish, pointA, pointB, n1, n2);
    const hasRefraction = (dirA !== null && dirB !== null);
    const hasVirtual = (virtual !== null && virtual.y > WATER_Y);

    if (!hasRefraction || !hasVirtual) warningContainer.innerHTML = '<span class="warning-badge">⚠️ 发生全反射 / 无虚像</span>';
    else warningContainer.innerHTML = '';

    // 6. 画入射光 (ray1)
    ctx.beginPath(); ctx.moveTo(fish.x, fish.y); ctx.lineTo(pointA.x, pointA.y);
    ctx.strokeStyle = TH.ray1; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fish.x, fish.y); ctx.lineTo(pointB.x, pointB.y); ctx.stroke();

    // 7. 画折射光 (ray2) 与眼睛
    if (dirB) {
      const eyeDist = 200;
      const eyePos = { x: pointB.x + dirB.x * eyeDist, y: pointB.y + dirB.y * eyeDist };
      ctx.beginPath(); ctx.moveTo(pointB.x, pointB.y); ctx.lineTo(eyePos.x, eyePos.y);
      ctx.strokeStyle = TH.ray2; ctx.lineWidth = 3; ctx.stroke();
      
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#333';
      ctx.fillText('👀', eyePos.x - 14, eyePos.y + 8);
      ctx.fillStyle = TH.ray2; ctx.font = 'bold 12px sans-serif'; ctx.fillText('人眼', eyePos.x - 14, eyePos.y - 16);
    }
    if (dirA) {
      ctx.beginPath(); ctx.moveTo(pointA.x, pointA.y); ctx.lineTo(pointA.x + dirA.x * 300, pointA.y + dirA.y * 300);
      ctx.strokeStyle = TH.ray2; ctx.lineWidth = 3; ctx.stroke();
    } else {
      // 全反射警告点
      ctx.beginPath(); ctx.arc(pointA.x, pointA.y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#ef4444'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('⚠️', pointA.x - 8, pointA.y - 12);
    }

    // 8. 画反向延长线 (ray3虚线)
    if (dirA && hasRefraction) {
      ctx.beginPath(); ctx.setLineDash([6, 8]); ctx.moveTo(pointA.x, pointA.y); ctx.lineTo(pointA.x - dirA.x * 350, pointA.y - dirA.y * 350);
      ctx.strokeStyle = TH.ray3; ctx.lineWidth = 2; ctx.stroke();
      ctx.setLineDash([]); 
    }
    if (dirB && hasRefraction) {
      ctx.beginPath(); ctx.setLineDash([6, 8]); ctx.moveTo(pointB.x, pointB.y); ctx.lineTo(pointB.x - dirB.x * 350, pointB.y - dirB.y * 350);
      ctx.strokeStyle = TH.ray3; ctx.lineWidth = 2; ctx.stroke();
      ctx.setLineDash([]); 
    }

    // 9. 画虚像
    if (hasVirtual) {
      ctx.save(); ctx.translate(virtual.x, virtual.y); ctx.scale(1.2, 1.2);
      ctx.strokeStyle = TH.img; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 14, 0, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(-34, -12); ctx.lineTo(-34, 12); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(10, -4, 3, 0, 2 * Math.PI); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();

      ctx.fillStyle = TH.img; ctx.font = 'bold 14px sans-serif';
      ctx.fillText('✨ 虚像', virtual.x + 28, virtual.y - 12);
      
      const realDepth = (WATER_Y - fish.y).toFixed(0), imgDepth = (WATER_Y - virtual.y).toFixed(0);
      ctx.fillStyle = '#333'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`视深: ${imgDepth} px (实际深: ${realDepth} px)`, 20, 40);
    }

    // 10. 画实物鱼 (obj)
    ctx.save(); ctx.translate(fish.x, fish.y);
    ctx.fillStyle = '#fcd34d'; ctx.strokeStyle = TH.obj; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 15, 0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-38, -14); ctx.lineTo(-38, 14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(12, -4, 4, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();

    ctx.fillStyle = TH.obj; ctx.font = 'bold 14px sans-serif';
    ctx.fillText('🐠 实际鱼', fish.x + 30, fish.y - 10);

    // 11. 画 A/B 节点
    [pointA, pointB].forEach((pt, i) => {
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
      ctx.fillStyle = TH.img; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#333'; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(i === 0 ? 'A' : 'B', pt.x - 8, pt.y + (i === 0 ? -16 : 24));
    });

    // 更新侧边滑块
    const currentAngle = getCurrentAngle();
    angleDisplay.textContent = currentAngle.toFixed(1);
    angleSlider.value = Math.min(170, Math.max(2, currentAngle));
  }

  // --- 交互事件（防止滑动冲突） ---
  function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX;
    const clientY = e.clientY;
    return {
      x: (clientX - rect.left) / rect.width * W,
      y: (clientY - rect.top) / rect.height * H
    };
  }

  canvas.addEventListener('pointerdown', function(e) {
    const pt = getPointerPos(e);
    if (dist(pt, fish) < 40) {
      dragTarget = 'fish'; 
      dragOffset = { x: fish.x - pt.x, y: fish.y - pt.y }; 
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (dist(pt, pointA) < 30) { dragTarget = 'A'; canvas.setPointerCapture(e.pointerId); return; }
    if (dist(pt, pointB) < 30) { dragTarget = 'B'; canvas.setPointerCapture(e.pointerId); return; }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!dragTarget) return;
    const pt = getPointerPos(e);

    if (dragTarget === 'fish') {
      fish.x = Math.min(W - 10, Math.max(10, pt.x + dragOffset.x));
      fish.y = Math.min(H - 10, Math.max(WATER_Y + 20, pt.y + dragOffset.y));
    } else if (dragTarget === 'A') {
      pointA.x = Math.min(W - 5, Math.max(5, pt.x));
      if (Math.abs(pointA.x - pointB.x) < 10) pointA.x = pointA.x < pointB.x ? pointB.x - 20 : pointB.x + 20;
    } else if (dragTarget === 'B') {
      pointB.x = Math.min(W - 5, Math.max(5, pt.x));
      if (Math.abs(pointA.x - pointB.x) < 10) pointB.x = pointB.x > pointA.x ? pointA.x + 20 : pointA.x - 20;
    }
    draw();
  });

  canvas.addEventListener('pointerup', function(e) {
    dragTarget = null;
    canvas.releasePointerCapture(e.pointerId);
  });

  // --- 控件事件 ---
  n1Slider.addEventListener('input', function() { 
    n1 = parseFloat(this.value); 
    n1Value.textContent = n1.toFixed(2); 
    draw(); 
  });
  
  modeSelect.addEventListener('change', function() { 
    mode = this.value; 
    draw(); 
  });

  angleSlider.addEventListener('input', function() { 
    setAngle(parseFloat(this.value)); 
  });

  resetBtn.addEventListener('click', () => {
    fish = { x: 400, y: 460 }; 
    pointA = { x: 350, y: WATER_Y }; 
    pointB = { x: 550, y: WATER_Y };
    n1 = 1.33; 
    n1Slider.value = '1.33'; 
    n1Value.textContent = '1.33';
    mode = 'fixB'; 
    modeSelect.value = 'fixB'; 
    draw();
  });

  window.addEventListener('themechange', draw); // 无障碍切换联动
  window.addEventListener('resize', resizeCanvas);
  
  resizeCanvas();
})();
</script>
</body>
</html>
