<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光的色散 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .color-chips {
    display: flex; flex-wrap: wrap; gap: 6px 12px;
    font-size: 13px; margin-bottom: 8px;
  }
  .color-chips label {
    display: inline-flex; align-items: center; gap: 3px;
    cursor: pointer;
  }
  .color-chips input {
    width: 14px; height: 14px; margin: 0;
  }
  .chip-btns { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip-btns button {
    flex: 1; padding: 4px 8px; font-size: 12px;
    border-radius: 6px; border: none;
    background: #3498db; color: #fff; cursor: pointer;
  }
  .chip-btns button.secondary { background: #ecf0f1; color: #2c3e50; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>光的色散</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>颜色</th><th>折射率</th><th>偏折</th></tr></thead>
    <tbody>
      <tr data-c="0"><td style="color:#e74c3c;font-weight:700">■ 红</td><td>1.50</td><td>最小</td></tr>
      <tr data-c="1"><td style="color:#e67e22;font-weight:700">■ 橙</td><td>1.51</td><td>较小</td></tr>
      <tr data-c="2"><td style="color:#f1c40f;font-weight:700">■ 黄</td><td>1.52</td><td>小</td></tr>
      <tr data-c="3"><td style="color:#27ae60;font-weight:700">■ 绿</td><td>1.53</td><td>中</td></tr>
      <tr data-c="4"><td style="color:#3498db;font-weight:700">■ 蓝</td><td>1.54</td><td>大</td></tr>
      <tr data-c="5"><td style="color:#2c3e80;font-weight:700">■ 靛</td><td>1.545</td><td>较大</td></tr>
      <tr data-c="6"><td style="color:#8e44ad;font-weight:700">■ 紫</td><td>1.55</td><td>最大</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>入射角 θ = <span id="aVal">45.0</span>°
    <input type="range" id="aRange" min="15" max="75" value="45" step="1">
  </label>

  <div style="font-size:13px;color:#666;margin-bottom:4px">显示色光</div>
  <div class="color-chips" id="colorChips">
    <label><input type="checkbox" data-c="0" checked>红</label>
    <label><input type="checkbox" data-c="1" checked>橙</label>
    <label><input type="checkbox" data-c="2" checked>黄</label>
    <label><input type="checkbox" data-c="3" checked>绿</label>
    <label><input type="checkbox" data-c="4" checked>蓝</label>
    <label><input type="checkbox" data-c="5" checked>靛</label>
    <label><input type="checkbox" data-c="6" checked>紫</label>
  </div>
  <div class="chip-btns">
    <button id="selAllBtn">全选</button>
    <button id="selNoneBtn" class="secondary">清空</button>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <div class="row">
    <input type="checkbox" id="playAngle" checked>
    <label for="playAngle" style="margin:0">入射角自动变化</label>
  </div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="5" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">拖滑块改入射角，勾选复选框只看指定色光</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 3 });

  var angle = 45;
  var playing = false, playDir = 1, rafId = null;

  var SPECTRUM = [
    { name: '红', color: '#e74c3c', n: 1.500 },
    { name: '橙', color: '#e67e22', n: 1.510 },
    { name: '黄', color: '#f1c40f', n: 1.520 },
    { name: '绿', color: '#27ae60', n: 1.530 },
    { name: '蓝', color: '#3498db', n: 1.540 },
    { name: '靛', color: '#2c3e80', n: 1.545 },
    { name: '紫', color: '#8e44ad', n: 1.550 }
  ];

  var PRISM = {
    top:   [0, 12],
    left:  [-11, -7],
    right: [11, -7]
  };

  function getEnabled() {
    var arr = [];
    document.querySelectorAll('#colorChips input').forEach(function(cb) {
      arr.push(cb.checked);
    });
    return arr;
  }

  function drawTriangle() {
    var ctx = opt.ctx;
    var p0 = opt.toScreen(PRISM.top[0], PRISM.top[1]);
    var p1 = opt.toScreen(PRISM.right[0], PRISM.right[1]);
    var p2 = opt.toScreen(PRISM.left[0], PRISM.left[1]);
    ctx.save();
    ctx.fillStyle = 'rgba(200,230,250,0.35)';
    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.lineTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    opt.clear();
    drawTriangle();

    var entry = [
      (PRISM.top[0] + PRISM.left[0]) / 2,
      (PRISM.top[1] + PRISM.left[1]) / 2
    ];
    var exit = [
      (PRISM.top[0] + PRISM.right[0]) / 2,
      (PRISM.top[1] + PRISM.right[1]) / 2
    ];

    // ============ 入射光：从左上进入，起点随入射角变化 ============
    var radIn = angle * Math.PI / 180;
    var inLen = 30;
    var startX = entry[0] - inLen * Math.sin(radIn);
    var startY = entry[1] + inLen * Math.cos(radIn);

    // 白色入射光（带黑边）
    opt.drawRay(startX, startY, entry[0], entry[1], '#000', 3.5);
    opt.drawRay(startX, startY, entry[0], entry[1], '#fff', 1.8);

    // 棱镜内光路（用淡色虚线概略）
    opt.drawDashedRay(entry[0], entry[1], exit[0], exit[1], '#aaa', 1);

    // ============ 出射光：方向随入射角 + 颜色变化 ============
    var enabled = getEnabled();
    var outLen = 40;

    // 出射角模型：
    //   基准角 45°（向右下方）
    //   入射角越大 → 出射更向下（偏折更明显）
    //   折射率越大 → 出射更向下（色散）
    for (var i = 0; i < SPECTRUM.length; i++) {
      if (!enabled[i]) continue;
      var s = SPECTRUM[i];

      var thetaDeg = 45 + (angle - 45) * 0.5 + (s.n - 1.500) * 400;
      var thetaRad = thetaDeg * Math.PI / 180;

      // 出射点稍微按颜色分离，让视觉上更清楚
      var spread = (s.n - 1.500) * 30;
      var ex = exit[0];
      var ey = exit[1] + spread;

      var outEndX = ex + outLen * Math.cos(thetaRad);
      var outEndY = ey - outLen * Math.sin(thetaRad);

      opt.drawRay(ex, ey, outEndX, outEndY, s.color, 1.8);
    }

    opt.drawLabel(startX + 1, startY + 2, '白光', '#333');

    // ============ 表格高亮 ============
    document.querySelectorAll('#caseTable tbody tr').forEach(function(tr) {
      var idx = parseInt(tr.dataset.c);
      if (enabled[idx]) { tr.classList.add('active'); tr.classList.remove('disabled'); }
      else { tr.classList.remove('active'); tr.classList.add('disabled'); }
    });

    // ============ 侧栏读数 ============
    document.getElementById('aVal').textContent = angle.toFixed(1);
    document.getElementById('aRange').value = angle;

    var cnt = enabled.filter(Boolean).length;
    var info = document.getElementById('readout');
    if (cnt === 7) {
      info.innerHTML = '入射角 θ = <b>' + angle.toFixed(1) + '°</b><br>' +
        '白光分解为 <b>红橙黄绿蓝靛紫</b> 七色光<br>' +
        '<span style="font-size:12px;color:#888">紫光偏折最多（最下方）；红光偏折最少（最上方）</span>';
    } else if (cnt === 0) {
      info.innerHTML = '入射角 θ = <b>' + angle.toFixed(1) + '°</b><br>' +
        '未选择任何色光<br><span style="font-size:12px;color:#888">勾选上方复选框显示色光</span>';
    } else {
      var names = [];
      for (var j = 0; j < 7; j++) if (enabled[j]) names.push(SPECTRUM[j].name);
      info.innerHTML = '入射角 θ = <b>' + angle.toFixed(1) + '°</b><br>' +
        '显示色光：<b>' + names.join('、') + '</b>';
    }
  }

  // ============ 事件绑定 ============
  document.getElementById('aRange').addEventListener('input', function(e) {
    angle = parseFloat(e.target.value); draw();
  });
  document.querySelectorAll('#colorChips input').forEach(function(cb) {
    cb.addEventListener('change', draw);
  });
  document.getElementById('selAllBtn').addEventListener('click', function() {
    document.querySelectorAll('#colorChips input').forEach(function(cb) { cb.checked = true; });
    draw();
  });
  document.getElementById('selNoneBtn').addEventListener('click', function() {
    document.querySelectorAll('#colorChips input').forEach(function(cb) { cb.checked = false; });
    draw();
  });

  document.getElementById('speedRange').addEventListener('input', function(e) {
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function() {
    angle = 45; playDir = 1;
    document.querySelectorAll('#colorChips input').forEach(function(cb) { cb.checked = true; });
    document.getElementById('playAngle').checked = true;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value) * 0.4;
    angle += playDir * spd;
    if (angle > 75) { angle = 75; playDir = -1; }
    if (angle < 15) { angle = 15; playDir = 1; }
    angle = Math.round(angle * 10) / 10;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function() {
    if (playing) stopPlay();
    else {
      if (!document.getElementById('playAngle').checked) { alert('请先勾选"入射角自动变化"'); return; }
      playing = true; playDir = 1;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function() { opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
