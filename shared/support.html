<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支持我们 · 初中科学动态实验室</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .page {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      line-height: 1.9;
      font-size: 15px;
      color: #444;
    }
    .page h2 {
      color: #2c3e50;
      margin-top: 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .page h3 {
      color: #3498db;
      font-size: 16px;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    .ways {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .way {
      background: #f8f9fb;
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
    }
    .way b { color: #2c3e50; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回主页</a>
  <h1>初中科学动态实验室</h1>

  <div class="page">
    <h2>支持我们</h2>
    <p>
      本站是个人业余时间做的公益教学项目，永久免费、无广告。
      如果它对你有帮助，以下几种方式都是很好的支持。
    </p>

    <div class="ways">
      <div class="way">
        <b>分享给需要的人</b>
        转给同事、同学、家长，让更多人用上，就是最大的支持。
      </div>
      <div class="way">
        <b>提交反馈与建议</b>
        告诉我哪里不好用、哪里讲错了，帮它变得更好。
      </div>
      <div class="way">
        <b>贡献代码或实验</b>
        如果你也懂前端，欢迎一起做新的实验页面。
      </div>
      <div class="way">
        <b>赞赏支持</b>
        如果愿意，可以通过邮箱联系我。你的心意会用在服务器与素材上。
      </div>
    </div>

    <h3>特别感谢</h3>
    <p>
      感谢所有使用、反馈、分享这个项目的老师和同学。
      你们的反馈让每一个实验都变得更好。
    </p>
  </div>

  <script src="shared/footer.js"></script>
</body>
</html>
