<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹簧振子 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>弹簧振子</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>位置</th><th>能量</th></tr></thead>
    <tbody>
      <tr class="active"><td>最远点</td><td>Ep 最大，v = 0</td></tr>
      <tr class="active"><td>平衡位置</td><td>Ep = 0，v 最大</td></tr>
      <tr class="active"><td>任意位置</td><td>Ep + Ek 恒定</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>振幅 A = <span id="aVal">8.0</span> cm
    <input type="range" id="aRange" min="2" max="15" value="8" step="0.5">
  </label>
  <label>劲度系数 k = <span id="kVal">20</span> N/m
    <input type="range" id="kRange" min="5" max="80" value="20" step="1">
  </label>
  <label>质量 m = <span id="mVal">1.0</span> kg
    <input type="range" id="mRange" min="0.2" max="5" value="1" step="0.1">
  </label>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">看弹簧形变与滑块速度的相互转换</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var A = 8;          // cm
  var k = 20;         // N/m
  var m = 1.0;        // kg
  var t = 0;
  var playing = false, rafId = null;

  function getState() {
    var omega = Math.sqrt(k / m);
    var xCm = A * Math.cos(omega * t);  // cm
    var vCm = -A * omega * Math.sin(omega * t); // cm/s
    var xM = xCm / 100;
    var vM = vCm / 100;
    var Ep = 0.5 * k * xM * xM;
    var Ek = 0.5 * m * vM * vM;
    var Etotal = 0.5 * k * (A / 100) * (A / 100);
    return { x: xCm, v: vCm, Ep: Ep, Ek: Ek, total: Etotal, omega: omega };
  }

  function draw() {
    var ctx = opt.ctx;
    var W = opt.W, H = opt.H;
    opt.clear();
    var s = getState();

    // 弹簧中轴
    var axisY = H * 0.55;
    var wallX = W * 0.12;
    var eqX = W * 0.5;   // 平衡位置
    var scale = (W * 0.28) / A;  // 每 cm 像素

    // 墙壁
    ctx.save();
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(wallX - 20, axisY - 80, 20, 160);
    // 斜条纹
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 1;
    for (var i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.moveTo(wallX - 20, axisY - 80 + i * 10);
      ctx.lineTo(wallX, axisY - 80 + i * 10 + 10);
      ctx.stroke();
    }
    ctx.restore();

    // 滑块位置
    var sliderX = eqX + s.x * scale;
    var sliderW = 36;
    var sliderH = 50;

    // 弹簧（从墙壁到滑块左边缘）
    var springStart = wallX;
    var springEnd = sliderX - sliderW / 2;
    var springLen = springEnd - springStart;
    var coils = 14;
    ctx.save();
    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    var sx = springStart;
    ctx.moveTo(sx, axisY);
    var step = springLen / (coils * 2);
    for (var c = 0; c < coils * 2; c++) {
      sx += step;
      var py = (c % 2 === 0) ? axisY - 14 : axisY + 14;
      ctx.lineTo(sx, py);
    }
    ctx.lineTo(springEnd, axisY);
    ctx.stroke();
    ctx.restore();

    // 滑块
    ctx.save();
    var grad = ctx.createLinearGradient(sliderX - sliderW / 2, 0, sliderX + sliderW / 2, 0);
    grad.addColorStop(0, '#e67e22');
    grad.addColorStop(1, '#c0392b');
    ctx.fillStyle = grad;
    ctx.fillRect(sliderX - sliderW / 2, axisY - sliderH / 2, sliderW, sliderH);
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2;
    ctx.strokeRect(sliderX - sliderW / 2, axisY - sliderH / 2, sliderW, sliderH);
    ctx.restore();

    // 平衡位置虚线
    ctx.save();
    ctx.strokeStyle = '#27ae60';
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(eqX, axisY - 90);
    ctx.lineTo(eqX, axisY + 90);
    ctx.stroke();
    ctx.fillStyle = '#27ae60';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('平衡位置', eqX, axisY - 100);
    ctx.restore();

    // 位移标注
    ctx.save();
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(eqX, axisY + 70);
    ctx.lineTo(sliderX, axisY + 70);
    ctx.stroke();
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x = ' + s.x.toFixed(1) + ' cm', (eqX + sliderX) / 2, axisY + 86);
    ctx.restore();

    // 速度箭头
    if (Math.abs(s.v) > 0.1) {
      var dir = s.v > 0 ? 1 : -1;
      var arrowLen = Math.min(50, Math.abs(s.v) * 3);
      ctx.save();
      ctx.strokeStyle = '#27ae60';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sliderX + dir * sliderW / 2, axisY);
      ctx.lineTo(sliderX + dir * (sliderW / 2 + arrowLen), axisY);
      ctx.stroke();
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.moveTo(sliderX + dir * (sliderW / 2 + arrowLen), axisY);
      ctx.lineTo(sliderX + dir * (sliderW / 2 + arrowLen - 12), axisY - 8);
      ctx.lineTo(sliderX + dir * (sliderW / 2 + arrowLen - 12), axisY + 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 能量条
    var rx = W * 0.15;
    var barY = H - 50;
    var barW = W * 0.7;
    var barH = 22;

    ctx.save();
    ctx.fillStyle = '#fafbfc';
    ctx.strokeStyle = '#ddd';
    ctx.fillRect(rx, barY, barW, barH);
    ctx.strokeRect(rx, barY, barW, barH);
    ctx.restore();

    var EpFrac = s.total > 0 ? s.Ep / s.total : 0;
    var EkFrac = s.total > 0 ? s.Ek / s.total : 0;
    var EpW = barW * EpFrac;
    var EkW = barW * EkFrac;

    ctx.save();
    ctx.fillStyle = '#3498db';
    ctx.fillRect(rx, barY, EpW, barH);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(rx + EpW, barY, EkW, barH);
    ctx.strokeStyle = '#95a5a6';
    ctx.strokeRect(rx, barY, barW, barH);
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#fff';
    if (EpW > 40) { ctx.textAlign = 'left'; ctx.fillText('弹性势能', rx + 6, barY + 16); }
    if (EkW > 40) { ctx.textAlign = 'left'; ctx.fillText('动能', rx + EpW + 6, barY + 16); }
    ctx.restore();

    // 侧栏
    document.getElementById('aVal').textContent = A.toFixed(1);
    document.getElementById('kVal').textContent = k;
    document.getElementById('mVal').textContent = m.toFixed(1);
    document.getElementById('aRange').value = A;
    document.getElementById('kRange').value = k;
    document.getElementById('mRange').value = m;

    var period = 2 * Math.PI * Math.sqrt(m / k);
    document.getElementById('readout').innerHTML =
      '位移 x = <b>' + s.x.toFixed(2) + '</b> cm<br>' +
      '速度 v = <b>' + s.v.toFixed(2) + '</b> cm/s<br>' +
      'Ep = <b>' + (s.Ep * 1000).toFixed(2) + '</b> mJ<br>' +
      'Ek = <b>' + (s.Ek * 1000).toFixed(2) + '</b> mJ<br>' +
      '周期 T = <b>' + period.toFixed(2) + '</b> s<br>' +
      '总能量 = <b>' + (s.total * 1000).toFixed(2) + '</b> mJ';
  }

  document.getElementById('aRange').addEventListener('input', function(e){ A = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('kRange').addEventListener('input', function(e){ k = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('mRange').addEventListener('input', function(e){ m = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){ t = 0; stopPlay(); draw(); });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value);
    t += 0.02 * spd;
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
