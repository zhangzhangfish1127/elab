<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动图像与平均速度 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 隐藏/显示不同模式的控件 */
  .mode-controls { display: none; }
  .mode-controls.active { display: block; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>运动图像与平均速度</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>模式</th><th>内容</th></tr></thead>
    <tbody>
      <tr data-case="graph" class="active"><td>图像生成</td><td>自由组合 v-t / s-t 图</td></tr>
      <tr data-case="uniform"><td>匀速直线</td><td>小车动画 + 双图同步</td></tr>
      <tr data-case="average"><td>平均速度</td><td>等路程 / 等时间对比</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div class="row">
    <label style="margin:0;white-space:nowrap">选择模式</label>
    <select id="modeSel">
      <option value="graph" selected>图像生成</option>
      <option value="uniform">匀速直线运动</option>
      <option value="average">平均速度</option>
    </select>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

  <!-- 模式 1：图像生成 -->
  <div class="mode-controls active" id="ctrl-graph">
    <div class="row">
      <label style="margin:0;white-space:nowrap">运动类型</label>
      <select id="gType">
        <option value="uniform">匀速直线</option>
        <option value="accel" selected>匀加速直线</option>
        <option value="mix">先加速后匀速</option>
      </select>
    </div>
    <label>初速度 v₀ = <span id="gV0Val">0.0</span> m/s
      <input type="range" id="gV0" min="0" max="10" value="0" step="0.5">
    </label>
    <label>加速度 a = <span id="gAVal">2.0</span> m/s²
      <input type="range" id="gA" min="0" max="5" value="2" step="0.2">
    </label>
    <label>总时间 T = <span id="gTVal">10</span> s
      <input type="range" id="gT" min="5" max="20" value="10" step="1">
    </label>
    <div class="row">
      <label style="margin:0;white-space:nowrap">横轴</label>
      <select id="gX">
        <option value="t" selected>t (s)</option>
        <option value="v">v (m/s)</option>
        <option value="s">s (m)</option>
      </select>
    </div>
    <div class="row">
      <label style="margin:0;white-space:nowrap">纵轴</label>
      <select id="gY">
        <option value="v" selected>v (m/s)</option>
        <option value="s">s (m)</option>
        <option value="t">t (s)</option>
      </select>
    </div>
  </div>

  <!-- 模式 2：匀速直线运动 -->
  <div class="mode-controls" id="ctrl-uniform">
    <label>速度 v = <span id="uVVal">5.0</span> m/s
      <input type="range" id="uV" min="0.5" max="20" value="5" step="0.5">
    </label>
    <label>总时间 T = <span id="uTVal">10</span> s
      <input type="range" id="uT" min="4" max="20" value="10" step="1">
    </label>
  </div>

  <!-- 模式 3：平均速度 -->
  <div class="mode-controls" id="ctrl-average">
    <div class="row">
      <label style="margin:0;white-space:nowrap">运动方式</label>
      <select id="aMode">
        <option value="halfDist" selected>等路程</option>
        <option value="halfTime">等时间</option>
      </select>
    </div>
    <label>前半段 v₁ = <span id="aV1Val">4.0</span> m/s
      <input type="range" id="aV1" min="1" max="20" value="4" step="0.5">
    </label>
    <label>后半段 v₂ = <span id="aV2Val">6.0</span> m/s
      <input type="range" id="aV2" min="1" max="20" value="6" step="0.5">
    </label>
    <label>总路程 S = <span id="aSVal">100</span> m
      <input type="range" id="aS" min="20" max="300" value="100" step="10">
    </label>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint" id="hint">切换模式，观察不同的运动图像</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  // 全局状态
  var currentMode = 'graph';
  var playing = false;
  var rafId = null;
  var tNow = 0;

  // 模式 1 数据
  var gType = 'accel', gV0 = 0, gA = 2, gT = 10;

  // 模式 2 数据
  var uV = 5, uT = 10;

  // 模式 3 数据
  var aMode = 'halfDist', aV1 = 4, aV2 = 6, aS = 100;

  function setMode(m) {
    currentMode = m;
    tNow = 0;
    stopPlay();
    // 切换控件显示
    document.querySelectorAll('.mode-controls').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById('ctrl-' + m).classList.add('active');
    // 切换表格高亮
    document.querySelectorAll('.case-table tbody tr').forEach(function(tr){
      tr.classList.toggle('active', tr.dataset.case === m);
    });
    // 提示语
    var hints = {
      graph: '选择横纵轴，观察曲线形状变化',
      uniform: '小车匀速前进，s-t 图为斜线，v-t 图为水平线',
      average: '对比"真实平均速度"和"速度平均值"'
    };
    document.getElementById('hint').textContent = hints[m];
    draw();
  }

  // ===== 模式 1：图像生成 =====
  function getGraphData(t) {
    if (gType === 'uniform') return { t: t, v: gV0, s: gV0 * t };
    if (gType === 'accel') {
      var v = gV0 + gA * t;
      var s = gV0 * t + 0.5 * gA * t * t;
      return { t: t, v: v, s: s };
    }
    // mix
    var t1 = gT / 2;
    if (t <= t1) {
      return { t: t, v: gV0 + gA * t, s: gV0 * t + 0.5 * gA * t * t };
    }
    var vHalf = gV0 + gA * t1;
    var sHalf = gV0 * t1 + 0.5 * gA * t1 * t1;
    return { t: t, v: vHalf, s: sHalf + vHalf * (t - t1) };
  }

  function drawGraphMode() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    var xVar = document.getElementById('gX').value;
    var yVar = document.getElementById('gY').value;
    if (xVar === yVar) {
      ctx.fillStyle = '#e67e22';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('横纵轴不能选同一个变量', W/2, H/2);
      return;
    }
    var pts = [];
    var xMax = 0, yMax = 0;
    for (var i = 0; i <= 240; i++) {
      var t = gT * i / 240;
      var p = getGraphData(t);
      pts.push(p);
      if (p[xVar] > xMax) xMax = p[xVar];
      if (p[yVar] > yMax) yMax = p[yVar];
    }
    xMax = niceMax(xMax); yMax = niceMax(yMax);

    var X0 = 60, Y0 = 30, X1 = W - 30, Y1 = H - 55;
    function w2s(x, y) { return [X0 + (x/xMax)*(X1-X0), Y1 - (y/yMax)*(Y1-Y0)]; }

    // 背景、网格、轴、刻度
    ctx.save();
    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(X0, Y0, X1 - X0, Y1 - Y0);
    ctx.strokeStyle = '#e8ecef';
    for (var i2 = 0; i2 <= 5; i2++) {
      var px = X0 + (X1-X0)*i2/5, py = Y0 + (Y1-Y0)*i2/5;
      ctx.beginPath(); ctx.moveTo(px, Y0); ctx.lineTo(px, Y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X0, py); ctx.lineTo(X1, py); ctx.stroke();
    }
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(X0, Y1); ctx.lineTo(X1, Y1); ctx.stroke();

    ctx.fillStyle = '#555'; ctx.font = '12px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (var j = 0; j <= 5; j++) { ctx.fillText(fmt(yMax*j/5), X0-6, Y1-(Y1-Y0)*j/5); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (var k = 0; k <= 5; k++) { ctx.fillText(fmt(xMax*k/5), X0+(X1-X0)*k/5, Y1+6); }
    ctx.fillStyle = '#333'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText((xVar==='t'?'时间 t/s':xVar==='v'?'速度 v/(m/s)':'路程 s/m'), (X0+X1)/2, Y1+28);
    ctx.save(); ctx.translate(18, (Y0+Y1)/2); ctx.rotate(-Math.PI/2);
    ctx.fillText((yVar==='t'?'时间 t/s':yVar==='v'?'速度 v/(m/s)':'路程 s/m'), 0, 0);
    ctx.restore();
    ctx.restore();

    // 曲线
    ctx.save();
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.beginPath();
    pts.forEach(function(p, i) {
      var sp = w2s(p[xVar], p[yVar]);
      if (i === 0) ctx.moveTo(sp[0], sp[1]); else ctx.lineTo(sp[0], sp[1]);
    });
    ctx.stroke(); ctx.restore();

    // 动点
    var nowData = getGraphData(tNow);
    var np = w2s(nowData[xVar], nowData[yVar]);
    ctx.save();
    ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(np[0], np[1], 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();

    var endData = getGraphData(gT);
    document.getElementById('readout').innerHTML =
      '当前 t = <b>' + tNow.toFixed(2) + '</b> s<br>' +
      'v = <b>' + nowData.v.toFixed(2) + '</b> m/s　s = <b>' + nowData.s.toFixed(2) + '</b> m<br>' +
      '终态：v=' + endData.v.toFixed(1) + ' m/s，s=' + endData.s.toFixed(1) + ' m';
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    var exp = Math.floor(Math.log10(v)), base = Math.pow(10, exp), n = v / base;
    if (n <= 1) return 1*base; if (n <= 2) return 2*base; if (n <= 2.5) return 2.5*base;
    if (n <= 5) return 5*base; return 10*base;
  }
  function fmt(n) {
    if (n === 0) return '0';
    if (Math.abs(n) >= 100) return Math.round(n).toString();
    if (Math.abs(n) >= 10) return n.toFixed(0);
    if (Math.abs(n) >= 1) return n.toFixed(1);
    return n.toFixed(2);
  }

  // ===== 模式 2：匀速直线运动 =====
  function drawUniformMode() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    var totalS = uV * uT;
    var sceneH = H * 0.28, trackY = sceneH - 10, marginX = 60;
    var ppm = (W - marginX * 2) / totalS;

    // 上半部：场景
    ctx.save(); ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marginX, trackY); ctx.lineTo(W - marginX, trackY); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = '#888'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    var step = totalS > 100 ? 50 : (totalS > 50 ? 20 : 10);
    for (var m = 0; m <= totalS; m += step) {
      var px = marginX + m * ppm;
      ctx.beginPath(); ctx.moveTo(px, trackY); ctx.lineTo(px, trackY + 5); ctx.stroke();
      ctx.fillText(m, px, trackY + 18);
    }
    ctx.fillStyle = '#333'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('路程 s / m', W/2, trackY + 36); ctx.restore();

    var nowS = uV * tNow, carX = marginX + nowS * ppm, carW = 50, carH = 26;
    ctx.save();
    var g = ctx.createLinearGradient(carX - carW/2, 0, carX + carW/2, 0);
    g.addColorStop(0, '#3498db'); g.addColorStop(1, '#2980b9');
    ctx.fillStyle = g; ctx.fillRect(carX - carW/2, trackY - carH, carW, carH);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.strokeRect(carX - carW/2, trackY - carH, carW, carH);
    ctx.fillStyle = '#2980b9'; ctx.fillRect(carX - 16, trackY - carH - 10, 32, 10);
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(carX - 14, trackY, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(carX + 14, trackY, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    if (uV > 0) {
      ctx.save(); ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(carX + carW/2 + 6, trackY - carH/2); ctx.lineTo(carX + carW/2 + 36, trackY - carH/2); ctx.stroke();
      ctx.fillStyle = '#27ae60'; ctx.beginPath();
      ctx.moveTo(carX + carW/2 + 36, trackY - carH/2);
      ctx.lineTo(carX + carW/2 + 26, trackY - carH/2 - 6);
      ctx.lineTo(carX + carW/2 + 26, trackY - carH/2 + 6);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // 下半部：s-t 和 v-t 图
    var plotTop = sceneH + 30, plotBot = H - 50;
    var stX0 = 60, stX1 = W * 0.48, vtX0 = W * 0.58, vtX1 = W - 30;
    drawMiniGraph(stX0, plotTop, stX1, plotBot, totalS, 's');
    drawMiniGraph(vtX0, plotTop, vtX1, plotBot, uV, 'v');

    ctx.save(); ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('s-t 图', (stX0 + stX1)/2, plotTop - 8);
    ctx.fillText('v-t 图', (vtX0 + vtX1)/2, plotTop - 8); ctx.restore();

    document.getElementById('readout').innerHTML =
      '当前时间 t = <b>' + tNow.toFixed(2) + '</b> s<br>' +
      '已走路程 s = <b>' + nowS.toFixed(2) + '</b> m<br>' +
      '瞬时速度 v = <b>' + uV.toFixed(2) + '</b> m/s（恒定）';
  }

  function drawMiniGraph(x0, y0, x1, y1, yMax, type) {
    var ctx = opt.ctx, W = x1 - x0, H = y1 - y0;
    ctx.save(); ctx.fillStyle = '#fafbfc'; ctx.fillRect(x0, y0, W, H); ctx.restore();
    ctx.save(); ctx.strokeStyle = '#e8ecef'; ctx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var gx = x0 + W*i/4, gy = y0 + H*i/4;
      ctx.beginPath(); ctx.moveTo(gx, y0); ctx.lineTo(gx, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x1, gy); ctx.stroke();
    }
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = '#666'; ctx.font = '11px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (var k = 0; k <= 4; k++) ctx.fillText((uT*k/4).toFixed(0), x0+W*k/4, y1+4);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    for (var j = 0; j <= 4; j++) ctx.fillText((yMax*j/4).toFixed(0), x0-4, y1-H*j/4);
    ctx.fillStyle = '#333'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('t / s', (x0+x1)/2, y1+20);
    ctx.save(); ctx.translate(x0-24, (y0+y1)/2); ctx.rotate(-Math.PI/2);
    ctx.fillText(type==='s'?'s / m':'v / (m/s)', 0, 0); ctx.restore();
    ctx.restore();

    ctx.save(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5; ctx.beginPath();
    if (type === 's') { ctx.moveTo(x0, y1); ctx.lineTo(x1, y0); }
    else { var vy = y1 - (uV/yMax)*H; ctx.moveTo(x0, vy); ctx.lineTo(x1, vy); }
    ctx.stroke(); ctx.restore();

    var ptX, ptY;
    if (type === 's') { ptX = x0 + (tNow/uT)*W; ptY = y1 - (uV*tNow/yMax)*H; }
    else { ptX = x0 + (tNow/uT)*W; ptY = y1 - (uV/yMax)*H; }
    ctx.save(); ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(ptX, ptY, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }

  // ===== 模式 3：平均速度 =====
  function getAvgCalc() {
    if (aMode === 'halfDist') {
      var sHalf = aS / 2, t1 = sHalf / aV1, t2 = sHalf / aV2;
      return { t1: t1, t2: t2, tTot: t1 + t2, vAvg: aS / (t1 + t2), boundaryS: sHalf };
    } else {
      var t0 = aS / (aV1 + aV2);
      return { t1: t0, t2: t0, tTot: 2 * t0, vAvg: aS / (2 * t0), boundaryS: aV1 * t0 };
    }
  }

  function drawAverageMode() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    var c = getAvgCalc();
    var roadY = H * 0.55, marginX = 60;
    var ppm = (W - marginX * 2) / aS;

    ctx.save(); ctx.fillStyle = '#34495e'; ctx.fillRect(0, roadY, W, 36); ctx.restore();

    var boundaryPx = marginX + c.boundaryS * ppm;
    ctx.save();
    ctx.fillStyle = 'rgba(52,152,219,0.20)'; ctx.fillRect(marginX, roadY, boundaryPx - marginX, 36);
    ctx.fillStyle = 'rgba(230,126,34,0.25)'; ctx.fillRect(boundaryPx, roadY, marginX + aS * ppm - boundaryPx, 36);
    ctx.restore();

    ctx.save(); ctx.fillStyle = '#888'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    var step = aS > 200 ? 50 : (aS > 100 ? 20 : 10);
    for (var m = 0; m <= aS; m += step) {
      var px = marginX + m * ppm;
      ctx.beginPath(); ctx.moveTo(px, roadY + 38); ctx.lineTo(px, roadY + 46); ctx.stroke();
      ctx.fillText(m, px, roadY + 60);
    }
    ctx.fillStyle = '#333'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('路程 s / m', W/2, roadY + 78); ctx.restore();

    ctx.save(); ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#2980b9'; ctx.fillText('v₁=' + aV1.toFixed(1) + ' m/s', (marginX + boundaryPx)/2, roadY - 12);
    ctx.fillStyle = '#d35400'; ctx.fillText('v₂=' + aV2.toFixed(1) + ' m/s', (boundaryPx + marginX + aS * ppm)/2, roadY - 12);
    ctx.restore();

    ctx.save(); ctx.strokeStyle = '#f39c12'; ctx.setLineDash([6, 4]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(boundaryPx, roadY - 40); ctx.lineTo(boundaryPx, roadY + 50); ctx.stroke(); ctx.restore();

    var carS = tNow <= c.t1 ? aV1 * tNow : (aMode==='halfDist'? aS/2 : aV1*c.t1) + aV2 * (tNow - c.t1);
    carS = Math.min(carS, aS);
    var carX = marginX + carS * ppm;

    ctx.save();
    var grad = ctx.createLinearGradient(carX - 30, 0, carX + 30, 0);
    grad.addColorStop(0, tNow <= c.t1 ? '#3498db' : '#e67e22');
    grad.addColorStop(1, tNow <= c.t1 ? '#2980b9' : '#d35400');
    ctx.fillStyle = grad; ctx.fillRect(carX - 30, roadY - 42, 60, 30);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.strokeRect(carX - 30, roadY - 42, 60, 30);
    ctx.fillStyle = tNow <= c.t1 ? '#2980b9' : '#d35400'; ctx.fillRect(carX - 18, roadY - 54, 36, 12);
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(carX - 16, roadY, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(carX + 16, roadY, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    var realAvg = c.vAvg, naiveAvg = (aV1 + aV2) / 2, diff = Math.abs(realAvg - naiveAvg);
    document.getElementById('readout').innerHTML =
      't = <b>' + Math.min(tNow, c.tTot).toFixed(2) + '</b> s　已走 <b>' + carS.toFixed(1) + '</b> m<br>' +
      '真实平均速度 v̄ = <b style="color:#27ae60">' + realAvg.toFixed(2) + '</b> m/s<br>' +
      '速度平均值 (v₁+v₂)/2 = <b style="color:#e74c3c">' + naiveAvg.toFixed(2) + '</b> m/s<br>' +
      (diff < 0.05 ? '<span style="color:#27ae60">两者相等（等时间模型）</span>' : '<span style="color:#e74c3c">两者不相等！</span>');
  }

  // ===== 主绘制 =====
  function draw() {
    opt.clear();
    if (currentMode === 'graph') drawGraphMode();
    else if (currentMode === 'uniform') drawUniformMode();
    else drawAverageMode();
  }

  // ===== 事件绑定 =====
  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  document.getElementById('modeSel').addEventListener('change', function(e){ setMode(e.target.value); });

  // 模式 1
  document.getElementById('gType').addEventListener('change', function(e){ gType = e.target.value; tNow = 0; draw(); });
  document.getElementById('gV0').addEventListener('input', function(e){ gV0 = parseFloat(e.target.value); tNow = 0; draw(); });
  document.getElementById('gA').addEventListener('input', function(e){ gA = parseFloat(e.target.value); tNow = 0; draw(); });
  document.getElementById('gT').addEventListener('input', function(e){ gT = parseFloat(e.target.value); if (tNow > gT) tNow = gT; draw(); });
  document.getElementById('gX').addEventListener('change', draw);
  document.getElementById('gY').addEventListener('change', draw);

  // 模式 2
  document.getElementById('uV').addEventListener('input', function(e){ uV = parseFloat(e.target.value); tNow = 0; draw(); });
  document.getElementById('uT').addEventListener('input', function(e){ uT = parseFloat(e.target.value); if (tNow > uT) tNow = uT; draw(); });

  // 模式 3
  document.getElementById('aMode').addEventListener('change', function(e){ aMode = e.target.value; tNow = 0; draw(); });
  document.getElementById('aV1').addEventListener('input', function(e){ aV1 = parseFloat(e.target.value); tNow = 0; draw(); });
  document.getElementById('aV2').addEventListener('input', function(e){ aV2 = parseFloat(e.target.value); tNow = 0; draw(); });
  document.getElementById('aS').addEventListener('input', function(e){ aS = parseFloat(e.target.value); tNow = 0; draw(); });

  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    tNow = 0;
    gType = 'accel'; gV0 = 0; gA = 2; gT = 10;
    uV = 5; uT = 10;
    aMode = 'halfDist'; aV1 = 4; aV2 = 6; aS = 100;
    document.getElementById('gType').value = 'accel';
    document.getElementById('gV0').value = 0;
    document.getElementById('gA').value = 2;
    document.getElementById('gT').value = 10;
    document.getElementById('uV').value = 5;
    document.getElementById('uT').value = 10;
    document.getElementById('aMode').value = 'halfDist';
    document.getElementById('aV1').value = 4;
    document.getElementById('aV2').value = 6;
    document.getElementById('aS').value = 100;
    document.getElementById('speedRange').value = 1;
    document.getElementById('speedVal').textContent = '1.0';
    stopPlay(); draw();
  });

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value);
    if (currentMode === 'graph') {
      tNow += 0.04 * spd;
      if (tNow > gT) tNow = 0;
    } else if (currentMode === 'uniform') {
      tNow += 0.04 * spd;
      if (tNow > uT) tNow = 0;
    } else {
      tNow += 0.02 * spd;
      if (tNow > getAvgCalc().tTot) { stopPlay(); return; }
    }
    draw();
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      if (currentMode === 'graph' && tNow >= gT) tNow = 0;
      if (currentMode === 'uniform' && tNow >= uT) tNow = 0;
      if (currentMode === 'average' && tNow >= getAvgCalc().tTot) tNow = 0;
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });

  // 初始化侧栏数值显示
  document.getElementById('gV0Val').textContent = '0.0';
  document.getElementById('gAVal').textContent = '2.0';
  document.getElementById('gTVal').textContent = '10';
  document.getElementById('uVVal').textContent = '5.0';
  document.getElementById('uTVal').textContent = '10';
  document.getElementById('aV1Val').textContent = '4.0';
  document.getElementById('aV2Val').textContent = '6.0';
  document.getElementById('aSVal').textContent = '100';

  setMode('graph');
})();
</script>
</body>
</html>
