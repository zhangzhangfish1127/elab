<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电磁铁 · ijhub</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>电磁铁</h1>
<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>因素</th><th>磁性强弱</th></tr></thead>
    <tbody>
      <tr class="active"><td>电流越大</td><td>磁性越强</td></tr>
      <tr class="active"><td>匝数越多</td><td>磁性越强</td></tr>
    </tbody>
  </table>
  <h3>控制面板</h3>
  <label>电流 I = <span id="iVal">1.0</span> A
    <input type="range" id="iRange" min="0" max="3" value="1" step="0.1">
  </label>
  <div class="row">
    <label style="margin:0;white-space:nowrap">线圈匝数</label>
    <select id="nSel">
      <option value="1">少 (50匝)</option>
      <option value="2" selected>中 (100匝)</option>
      <option value="3">多 (150匝)</option>
    </select>
  </div>
  <div class="readout" id="readout"></div>
</aside>
<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>
<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>
<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });
  var I = 1.0, N_level = 2; // 1, 2, 3

  function draw() {
    var ctx = opt.ctx, W = opt.W, H = opt.H;
    opt.clear();

    var strength = I * N_level; // 综合磁性强弱
    var pinsCount = Math.floor(strength * 4); // 吸引大头针的数量
    if (I === 0) pinsCount = 0;

    var cx = W / 2, cy = H * 0.35;
    var coreW = 60, coreH = 160;

    // 画电源和导线
    ctx.save();
    ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 200, H*0.8);
    ctx.lineTo(cx - 200, cy);
    ctx.lineTo(cx - coreW/2, cy);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx + coreW/2, cy);
    ctx.lineTo(cx + 200, cy);
    ctx.lineTo(cx + 200, H*0.8);
    ctx.stroke();

    // 电池
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(cx - 210, H*0.8 - 20, 20, 40);
    ctx.strokeStyle = '#d35400'; ctx.lineWidth = 2; ctx.strokeRect(cx - 210, H*0.8 - 20, 20, 40);
    ctx.restore();

    // 画铁芯
    ctx.save();
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(cx - coreW/2, cy - coreH/2, coreW, coreH);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    ctx.strokeRect(cx - coreW/2, cy - coreH/2, coreW, coreH);
    ctx.restore();

    // 画线圈（匝数越多，线圈画得越密）
    ctx.save();
    ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 4;
    var coils = 5 + N_level * 3; 
    var coilStep = coreH / coils;
    for(var i=0; i<coils; i++) {
      var y = cy - coreH/2 + i * coilStep + coilStep/2;
      ctx.beginPath();
      ctx.moveTo(cx - coreW/2 - 10, y);
      ctx.lineTo(cx + coreW/2 + 10, y + 5);
      ctx.stroke();
    }
    ctx.restore();

    // 画大头针
    ctx.save();
    ctx.fillStyle = '#bdc3c7'; ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 1;
    var pinBaseY = cy + coreH/2;
    for(var p=0; p<pinsCount; p++) {
      var px = cx - coreW/2 + 5 + (p % 6) * 10;
      var py = pinBaseY + Math.floor(p / 6) * 25;
      
      // 画针头
      ctx.beginPath(); ctx.arc(px, py + 15, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      // 画针身
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + 15); ctx.stroke();
    }
    ctx.restore();

    // 磁场线示意（强度越大越明显）
    if (strength > 0.5) {
      ctx.save();
      ctx.strokeStyle = App.getTheme().ray1;
      ctx.globalAlpha = Math.min(1, strength / 3);
      ctx.lineWidth = 2;
      // 简单的 U 型磁感线
      for (var m=0; m<3; m++) {
        var r = 80 + m*20;
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI*0.2, Math.PI*0.8, false);
        ctx.stroke();
        // 箭头
        var angle = Math.PI*0.8;
        var ax = cx + r * Math.cos(angle);
        var ay = cy + r * Math.sin(angle);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 5, ay - 8);
        ctx.lineTo(ax + 5, ay - 8);
        ctx.fill();
      }
      ctx.restore();
    }

    document.getElementById('readout').innerHTML =
      '综合磁性强弱 = I × N = <b>' + strength.toFixed(1) + '</b><br>' +
      '当前吸引大头针约 <b>' + pinsCount + '</b> 根<br>' +
      '<span style="color:#888">电流越大、匝数越多，磁性越强</span>';
  }

  document.getElementById('iRange').addEventListener('input', function(e){
    I = parseFloat(e.target.value);
    document.getElementById('iVal').textContent = I.toFixed(1);
    draw();
  });
  document.getElementById('nSel').addEventListener('change', function(e){
    N_level = parseInt(e.target.value);
    draw();
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
