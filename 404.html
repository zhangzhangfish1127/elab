<!DOCTYPE html>
<html lang="zh-CN">

<link rel="stylesheet" href="/shared/style.css">
<style>
  .error-page {
    max-width: 600px; margin: 100px auto; text-align: center;

    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .error-icon { font-size: 80px; margin-bottom: 10px; }
  .error-page h1 { color: #2c3e50; margin: 0 0 10px; font-size: 28px; }
  .error-page p { color: #7f8c8d; font-size: 15px; margin-bottom: 30px; }
  .btn-home {
    display: inline-block; padding: 10px 24px; background: #3498db;
    color: #fff; text-decoration: none; border-radius: 8px;
    font-size: 15px; font-weight: 500; transition: 0.2s;
  }
  .btn-home:hover { background: #2980b9; transform: translateY(-2px); }

<body>

    <a class="back" href="/index.html" style="margin-bottom:20px;">← 返回主页</a>
