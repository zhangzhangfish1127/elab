<h1>太阳系星际追踪</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>天体</th><th>半长轴 a</th><th>周期 T</th></tr></thead>
    <tbody id="bodyRows">
      <tr data-name="太阳"><td>太阳</td><td>—</td><td>—</td></tr>
      <tr data-name="水星"><td>水星</td><td>0.39 AU</td><td>0.24 年</td></tr>
      <tr data-name="金星"><td>金星</td><td>0.72 AU</td><td>0.62 年</td></tr>
      <tr data-name="地球"><td>地球</td><td>1.00 AU</td><td>1.00 年</td></tr>
      <tr data-name="火星"><td>火星</td><td>1.52 AU</td><td>1.88 年</td></tr>
      <tr data-name="小行星带"><td>小行星带</td><td>2.1~3.3</td><td>3~6 年</td></tr>
      <tr data-name="木星"><td>木星</td><td>5.20 AU</td><td>11.86 年</td></tr>
      <tr data-name="土星"><td>土星</td><td>9.54 AU</td><td>29.45 年</td></tr>
      <tr data-name="天王星"><td>天王星</td><td>19.19 AU</td><td>84.02 年</td></tr>
      <tr data-name="海王星"><td>海王星</td><td>30.07 AU</td><td>164.8 年</td></tr>
      <tr data-name="哈雷彗星"><td>哈雷彗星</td><td>17.8 AU</td><td>75.1 年</td></tr>
      <tr data-name="月球"><td>月球</td><td>0.0026 AU</td><td>27.3 天</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>时间流速 = <span id="speedVal">1.00</span>
    <input type="range" id="speedRange" min="0.01" max="20" value="1" step="0.01">
  </label>
  <div class="row">
    <label for="speedUnit" style="margin:0">单位</label>
    <select id="speedUnit">
      <option value="day">天/秒</option>
      <option value="year" selected>年/秒</option>
      <option value="century">世纪/秒</option>
    </select>
  </div>

  <label>天体尺寸 = <span id="sizeVal">1.0</span> ×

  <div class="row"><input type="checkbox" id="orbitToggle" checked><label for="orbitToggle" style="margin:0">显示轨道线</label></div>

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  // =============== 状态 ===============
  var cssW = 800, cssH = 500, dpr = 1;
  var baseScale = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var targetView = { cx: 0, cy: 0, scale: 1 };
  var sizeMult = 1;
  var speedVal = 1, speedUnit = 'year';
  var playing = true;
  var simYears = 0;
  var showOrbit = true, showLabel = true;
  var selected = null;
  var autoFit = true; // 无选中时自动适配全图

  // =============== 工具 ===============
  function withAlpha(c, a) {
    if (!c) return 'rgba(0,0,0,' + a + ')';
    c = String(c).trim();
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      if (h.length >= 6) {
        var n = parseInt(h.slice(0, 6), 16);
        if (isNaN(n)) return c;
        return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
      }
    }
    var m = c.match(/^rgba?\(([^)]+)\)$/i);
    if (m) {
      var p = m[1].split(',');
      if (p.length >= 3) return 'rgba(' + p[0].trim() + ',' + p[1].trim() + ',' + p[2].trim() + ',' + a + ')';
    }
    return c;
  }
  function compR(a) { return Math.pow(a, 0.5) * 10; }
  function w2s(x, y) {
    return [cssW / 2 + (x - view.cx) * view.scale, cssH / 2 + (y - view.cy) * view.scale];
  }
  function planetVisR(p) { return (2.5 + p.r * 1.1) * sizeMult; }
  function moonVisR(m) { return (1.2 + m.r * 1.4) * sizeMult; }

  // =============== 数据 ===============
  var SUN = { id:'sun', name:'太阳', isSun:true, x:0, y:0, r:14 };

  var PLANETS = [
    { id:'mercury', name:'水星', a:0.387, T:0.241, r:1.3, ck:'ray1', th0:0.6, x:0, y:0 },
    { id:'venus',   name:'金星', a:0.723, T:0.615, r:1.9, ck:'ray1', th0:2.2, x:0, y:0 },
    { id:'earth',   name:'地球', a:1.000, T:1.000, r:2.0, ck:'ray1', th0:4.1, x:0, y:0 },
    { id:'mars',    name:'火星', a:1.524, T:1.881, r:1.6, ck:'ray1', th0:1.1, x:0, y:0 },
    { id:'jupiter', name:'木星', a:5.203, T:11.86, r:4.6, ck:'ray2', th0:3.7, x:0, y:0 },
    { id:'saturn',  name:'土星', a:9.537, T:29.45, r:4.0, ck:'ray2', th0:5.5, x:0, y:0, ring:true },
    { id:'uranus',  name:'天王星', a:19.19, T:84.02, r:3.0, ck:'ray3', th0:0.9, x:0, y:0 },
    { id:'neptune', name:'海王星', a:30.07, T:164.8, r:3.0, ck:'ray3', th0:2.7, x:0, y:0 }
  ];

  // 卫星：orbitMult 为母星视觉半径的倍数（屏幕空间）
  var MOONS = {
    earth:   [ { id:'moon', name:'月球', r:0.55, orbitMult:2.6, T:0.0748, th0:0.8, ck:'normal' } ],
    mars:    [ { id:'phobos', name:'火卫一', r:0.28, orbitMult:1.8, T:0.00087, th0:1.2, ck:'normal' },
               { id:'deimos', name:'火卫二', r:0.22, orbitMult:2.6, T:0.0034, th0:3.5, ck:'normal' } ],
    jupiter: [ { id:'io', name:'木卫一', r:0.5, orbitMult:1.9, T:0.0048, th0:0.4, ck:'ray3' },
               { id:'europa', name:'木卫二', r:0.45, orbitMult:2.5, T:0.0097, th0:1.8, ck:'ray3' },
               { id:'ganymede', name:'木卫三', r:0.65, orbitMult:3.2, T:0.0196, th0:3.2, ck:'ray3' },
               { id:'callisto', name:'木卫四', r:0.6, orbitMult:4.0, T:0.0457, th0:4.9, ck:'ray3' } ],
    saturn:  [ { id:'titan', name:'土卫六', r:0.7, orbitMult:3.4, T:0.0436, th0:2.4, ck:'ray2' } ]
  };

  var COMET = { id:'comet', name:'哈雷彗星', a:17.8, e:0.967, T:75.1, M0:1.5, x:0, y:0, rReal:0 };

  // 显示开关
  var showFlags = {
    sun:true, mercury:true, venus:true, earth:true, mars:true,
    belt:true, jupiter:true, saturn:true, uranus:true, neptune:true, comet:true,
    moon:true, phobos:true, deimos:true, io:true, europa:true, ganymede:true, callisto:true, titan:true
  };

  // =============== 小行星带 ===============
  var beltParticles = [];
  (function(){
    for (var i = 0; i < 240; i++) {
      var aAU = 2.1 + Math.random() * 1.2;
      beltParticles.push({
        aAU: aAU,
        th0: Math.random() * TAU,
        omega: TAU / (Math.pow(aAU, 1.5) * 365), // 开普勒第三定律近似
        r: 0.5 + Math.random() * 0.7
      });
    }
  })();

  // =============== 开普勒 ===============
  function solveKepler(M, e) {
    M = M % TAU; if (M < 0) M += TAU;
    var E = M + e * Math.sin(M);
    for (var i = 0; i < 10; i++) {
      var d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= d;
      if (Math.abs(d) < 1e-6) break;
    }
    return E;
  }
  var cometPath = (function(){
    var pts = [], N = 300;
    for (var i = 0; i <= N; i++) {
      var E = i / N * TAU;
      var r = COMET.a * (1 - COMET.e * Math.cos(E));
      var th = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
      var rd = compR(r);
      pts.push([Math.cos(th) * rd, Math.sin(th) * rd]);
    }
    return pts;
  })();

  // 星空
  var stars = [];
  for (var si = 0; si < 160; si++) {
    stars.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random() * 1.1, a: 0.25 + Math.random() * 0.5 });
  }

  // =============== 简介文案 ===============
  var INFO = {
    sun: { title: '太阳', meta: '类型：G2V 主序星 · 直径约 139 万千米 · 表面温度约 5500℃ · 占太阳系质量 99.86%',
      body: '太阳是太阳系的绝对中心，是一颗中等质量的黄矮星，通过核心的氢核聚变每秒将约 6 亿吨氢转化为氦，释放出巨大能量。它的引力主宰着八大行星、矮行星、小行星带与彗星的轨道。太阳的直径约为地球的 109 倍，内部可以装下 130 万个地球。太阳活动如黑子、耀斑、日冕物质抛射会影响地球磁场，产生极光并干扰无线电通信。太阳已经燃烧了约 46 亿年，预计还能稳定燃烧约 50 亿年。' },
    mercury: { title: '水星', meta: '距日：约 0.39 AU · 公转周期：88 天 · 自转周期：58.6 天 · 无卫星',
      body: '水星是太阳系中最小、距太阳最近的行星，表面布满陨石坑，外貌酷似月球。由于几乎没有大气层，昼夜温差极端，白天可达 430℃，夜间降至 -180℃。水星轨道偏心率较大（0.206），公转速度最快，每 88 天绕太阳一周。它的自转与公转存在 3:2 的自旋轨道共振，因此水星上的"一天"（从日出到下一次日出）长达 176 个地球日。水星拥有异常巨大的铁核，约占其总体积的 55%。' },
    venus: { title: '金星', meta: '距日：约 0.72 AU · 公转周期：225 天 · 自转周期：243 天（逆行） · 无卫星',
      body: '金星是太阳系中最热的行星，表面温度约 465℃，主要原因是浓密的二氧化碳大气造成极端温室效应。它的气压是地球海平面的 92 倍。金星自转方向与多数行星相反（逆行），且自转周期比公转周期还长。金星与地球大小相近，被称为地球的"姊妹星"，但由于温室效应失控，表面环境完全不适合生命。金星上空覆盖着浓密的硫酸云层，是夜空中最亮的行星。' },
    earth: { title: '地球', meta: '距日：1 AU · 公转周期：365.25 天 · 自转周期：23 时 56 分 · 1 颗天然卫星',
      body: '地球是目前已知唯一存在生命的星球，71% 的表面被液态水覆盖，大气以氮和氧为主，形成了保护生命的臭氧层。地球拥有合适的位置（宜居带）、适中的质量（保持大气）以及一个巨大的金属核（产生磁场）。地球的磁场屏蔽了大部分太阳风，避免大气被剥离。地球自转产生昼夜交替，地轴倾角 23.5° 产生四季变化。地球内部的对流运动驱动板块构造，形成山脉、地震与火山。' },
    moon: { title: '月球', meta: '距地：约 38.4 万千米 · 公转周期：27.3 天 · 直径：3476 千米 · 潮汐锁定',
      body: '月球是地球唯一的天然卫星，也是太阳系中第五大卫星。它被地球潮汐锁定，因此永远以同一面朝向地球。月球表面主要有明亮的"高地"和暗色的"月海"（古代熔岩平原）。由于没有大气层，月球昼夜温差极大，且表面保留了大量陨石坑。月球引力是地球潮汐的主要来源，对地球气候与生命演化有重要影响。月球也是人类唯一登陆过的天体，阿波罗计划共带回 382 千克月岩样本。' },
    mars: { title: '火星', meta: '距日：1.52 AU · 公转周期：687 天 · 自转周期：24.6 小时 · 2 颗卫星',
      body: '火星因表面富含氧化铁而呈现红色，被称为"红色星球"。火星拥有太阳系最高的火山——奥林帕斯山（约 22 千米），以及最长的峡谷——水手号谷（长约 4000 千米）。火星大气稀薄（主要为二氧化碳），表面气压仅地球的 0.6%，但存在极冠、季节性沙尘暴以及古代河床遗迹，表明曾有液态水存在。火星是当前人类深空探测的热点，多个探测器已在其表面工作。' },
    phobos: { title: '火卫一', meta: '距火星：约 9376 千米 · 公转周期：7.66 小时 · 直径：约 22.5 千米',
      body: '火卫一是火星两颗天然卫星中较大、距离火星更近的一颗，形状不规则，表面布满陨石坑与沟槽。它绕火星公转的速度快于火星自转，因此在火星表面会看到它从西边升起、东边落下。火卫一的轨道正在缓慢缩小，预计数千万年后将坠毁在火星表面或碎裂成环。' },
    deimos: { title: '火卫二', meta: '距火星：约 23463 千米 · 公转周期：30.3 小时 · 直径：约 12.4 千米',
      body: '火卫二是火星两颗卫星中较小的一颗，外形不规则，表面相对光滑（陨石坑被尘埃覆盖）。它的轨道比火卫一远得多，公转周期约 30 小时，在火星表面看升起缓慢。火卫二与火卫一可能都是被火星捕获的小行星。' },
    belt: { title: '小行星带', meta: '位置：火星与木星之间 · 距日：约 2.1~3.3 AU · 公转周期：3~6 年',
      body: '小行星带是太阳系中位于火星与木星之间的环状天体密集区，包含了数百万颗小行星，已编号的超过 100 万颗。尽管数量庞大，但总质量仅约为月球的 4%，主要成因是木星强大引力阻止了物质聚合形成行星。最大的天体是谷神星（直径约 940 千米，被归类为矮行星），其次是灶神星、智神星等。小行星带的天体轨道较为稳定，但受木星等引力扰动偶尔会被抛出，形成近地小行星。' },
    jupiter: { title: '木星', meta: '距日：5.20 AU · 公转周期：11.86 年 · 自转周期：9.9 小时 · 95+ 颗卫星',
      body: '木星是太阳系最大的行星，质量是其他七大行星总和的 2.5 倍。它主要由氢和氦组成，没有固体表面，大气中著名的大红斑是一个持续数百年的巨型风暴。木星拥有最强大的磁场和辐射带，以及四颗伽利略卫星（木卫一至四）。木星在太阳系演化中扮演"清道夫"角色，它的引力影响小行星带与柯伊伯带，也保护内太阳系免受大量彗星撞击。' },
    io: { title: '木卫一 (Io)', meta: '距木星：约 42 万千米 · 公转周期：1.77 天 · 直径：3643 千米',
      body: '木卫一是太阳系中火山活动最剧烈的天体，表面有超过 400 座活火山，喷发羽流可高达 400 千米。这种剧烈活动源于木星强大潮汐力对其内部的反复挤压加热。木卫一表面呈黄、橙、红、黑等多种颜色，覆盖着硫化物与硅酸盐沉积。它几乎没有水，是太阳系中最干燥的天体之一。' },
    europa: { title: '木卫二 (Europa)', meta: '距木星：约 67 万千米 · 公转周期：3.55 天 · 直径：3122 千米',
      body: '木卫二是太阳系中最有可能存在地外生命的天体之一。它表面覆盖着厚达数千米的冰壳，冰壳下可能隐藏着深达 100 千米的全球性液态水海洋。表面纵横交错的裂纹与冰脊是其显著特征，暗示冰层在运动。木卫二的水量可能是地球的两倍。NASA 的"欧罗巴快船"计划正对它进行详细探测。' },

  // =============== 边栏开关生成 ===============
  var toggleList = [
    { id:'sun', label:'太阳' }, { id:'mercury', label:'水星' },
    { id:'venus', label:'金星' }, { id:'earth', label:'地球' },
    { id:'mars', label:'火星' }, { id:'belt', label:'小行星带' },
    { id:'jupiter', label:'木星' }, { id:'saturn', label:'土星' },
    { id:'uranus', label:'天王星' }, { id:'neptune', label:'海王星' },
    { id:'comet', label:'哈雷彗星' }, { id:'moon', label:'月球' },
    { id:'phobos', label:'火卫一' }, { id:'deimos', label:'火卫二' },
    { id:'io', label:'木卫一' }, { id:'europa', label:'木卫二' },
    { id:'ganymede', label:'木卫三' }, { id:'callisto', label:'木卫四' },
    { id:'titan', label:'土卫六' }
  ];
  (function(){
    var box = document.getElementById('bodyToggles');
    var html = '';
    for (var i = 0; i < toggleList.length; i++) {
      var t = toggleList[i];
      html += '<div class="row"><input type="checkbox" id="tgl_' + t.id + '" checked><label for="tgl_' + t.id + '">' + t.label + '</label></div>';
    }
    box.innerHTML = html;
    box.addEventListener('change', function(e){
      var id = e.target.id.replace('tgl_', '');
      showFlags[id] = e.target.checked;
      updatePositionCache();
    });
  })();

  // =============== 位置更新 ===============
  function isPlanetVisible(p) { return showFlags[p.id]; }
  function isMoonVisible(m) { return showFlags[m.id]; }

  function updatePlanets() {
    for (var i = 0; i < PLANETS.length; i++) {
      var b = PLANETS[i];
      var th = b.th0 + TAU * simYears / b.T;
      var rd = compR(b.a);
      b.x = Math.cos(th) * rd;
      b.y = Math.sin(th) * rd;
    }
    var M = COMET.M0 + TAU * simYears / COMET.T;
    var E = solveKepler(M, COMET.e);
    var r = COMET.a * (1 - COMET.e * Math.cos(E));
    var theta = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
    var rd2 = compR(r);
    COMET.x = Math.cos(theta) * rd2;
    COMET.y = Math.sin(theta) * rd2;
    COMET.rReal = r;
  }

  // 卫星屏幕坐标（用于点击、绘制、聚焦）
  function updateMoonPositions() {
    for (var pid in MOONS) {
      var planet = null;
      for (var j = 0; j < PLANETS.length; j++) {
        if (PLANETS[j].id === pid) { planet = PLANETS[j]; break; }
      }
      if (!planet) continue;
      var ps = w2s(planet.x, planet.y);
      var pr = planetVisR(planet) * view.scale;
      for (var i = 0; i < MOONS[pid].length; i++) {
        var m = MOONS[pid][i];
        var angle = m.th0 + TAU * simYears / m.T;
        m.parent = planet;
        m.screenX = ps[0] + Math.cos(angle) * pr * m.orbitMult;
        m.screenY = ps[1] + Math.sin(angle) * pr * m.orbitMult;
        m.screenR = moonVisR(m) * view.scale;
      }
    }
  }

  function updatePositionCache() { updatePlanets(); updateMoonPositions(); }

  // =============== 尺寸 ===============
  function updateBaseScale() {
    var maxR = compR(30.07);
    var half = Math.min(cssW, cssH) / 2;
    baseScale = (half * 0.88) / maxR;
    if (!isFinite(baseScale) || baseScale <= 0) baseScale = 1;
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateBaseScale();
    if (autoFit) { view.scale = baseScale; targetView.scale = baseScale; }
    updatePositionCache();
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  // =============== 聚焦 ===============
  function focusOn(obj) {
    selected = obj;
    autoFit = false;
    var minDim = Math.min(cssW, cssH);

    if (obj.id === 'sun') {
      targetView.cx = 0; targetView.cy = 0;
      targetView.scale = (minDim * 0.42) / (14 * sizeMult);
      return;
    }
    if (obj.isMoon) {
      var parent = obj.parent;
      targetView.cx = parent.x; targetView.cy = parent.y;
      // 使卫星屏幕半径 ≈ minDim * 0.4
      var mr = moonVisR(obj);
      targetView.scale = (minDim * 0.4) / mr;
      return;
    }
    if (obj.id === 'comet') {
      targetView.cx = obj.x; targetView.cy = obj.y;
      targetView.scale = (minDim * 0.4) / (3 * sizeMult);
      return;
    }
    if (obj.id === 'belt') {
      targetView.cx = 0; targetView.cy = 0;
      targetView.scale = baseScale * 2.2;
      return;
    }
    // 行星
    var planet = obj;
    targetView.cx = planet.x; targetView.cy = planet.y;
    var moons = MOONS[planet.id] || [];
    var maxOrbit = 0;
    for (var i = 0; i < moons.length; i++) {
      if (showFlags[moons[i].id] && moons[i].orbitMult > maxOrbit) maxOrbit = moons[i].orbitMult;
    }
    var pr = planetVisR(planet);
    if (maxOrbit > 0) {
      var systemR = pr * (1 + maxOrbit) + moonVisR(moons[0]) * 2;
      targetView.scale = (minDim * 0.42) / systemR;
    } else {
      targetView.scale = (minDim * 0.42) / pr;
    }
  }

  function resetView() {
    selected = null;
    autoFit = true;
    targetView.cx = 0; targetView.cy = 0;
    targetView.scale = baseScale;
    document.getElementById('infoPanel').classList.remove('show');
    syncTable();
  }

  // =============== 绘制 ===============
  function drawSphere(sx, sy, R, color, highlight) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    var g1 = ctx.createRadialGradient(sx - R * 0.35, sy - R * 0.35, R * 0.05, sx - R * 0.35, sy - R * 0.35, R * 1.6);
    g1.addColorStop(0, 'rgba(255,255,255,0.6)');
    g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    var g2 = ctx.createRadialGradient(sx + R * 0.5, sy + R * 0.5, R * 0.1, sx + R * 0.5, sy + R * 0.5, R * 1.85);
    g2.addColorStop(0, 'rgba(0,0,0,0.45)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    if (highlight) {
      ctx.strokeStyle = highlight;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, R + 5, 0, TAU); ctx.stroke();
    }
  }

  function draw() {
    var TH = App.getTheme();
    var c1 = TH.ray1, c2 = TH.ray2, c3 = TH.ray3;
    var cN = TH.normal, cI = TH.img;
    var CMAP = { ray1: c1, ray2: c2, ray3: c3, normal: cN };

    // 深空黑底
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cssW, cssH);

    // 星空
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = st.a;
      ctx.beginPath();
      ctx.arc(st.x * cssW, st.y * cssH, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var o = w2s(0, 0);
    ctx.lineWidth = 1;

    // 行星轨道
    if (showOrbit) {
      for (var j = 0; j < PLANETS.length; j++) {
        if (!showFlags[PLANETS[j].id]) continue;
        ctx.strokeStyle = withAlpha(cN, 0.55);
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(o[0], o[1], compR(PLANETS[j].a) * view.scale, 0, TAU);
        ctx.stroke();
      }
      // 彗星轨道
      if (showFlags.comet) {
        ctx.strokeStyle = withAlpha(c2, 0.55);
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (var k = 0; k < cometPath.length; k++) {
          var p = w2s(cometPath[k][0], cometPath[k][1]);
          if (k === 0) ctx.moveTo(p[0], p[1]);
          else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 小行星带
    if (showFlags.belt) {
      ctx.fillStyle = withAlpha(cN, 0.6);
      for (var bi = 0; bi < beltParticles.length; bi++) {
        var bp = beltParticles[bi];
        var ba = compR(bp.aAU);
        var bth = bp.th0 + bp.omega * simYears * 365;
        var bx = Math.cos(bth) * ba;
        var by = Math.sin(bth) * ba;
        var bsp = w2s(bx, by);
        if (bsp[0] < -10 || bsp[0] > cssW + 10 || bsp[1] < -10 || bsp[1] > cssH + 10) continue;
        ctx.beginPath();
        ctx.arc(bsp[0], bsp[1], bp.r, 0, TAU);
        ctx.fill();
      }
    }

    // 太阳
    if (showFlags.sun) {
      var sp = w2s(0, 0);
      var sunR = 14 * sizeMult * view.scale;
      if (sunR < 0.5) sunR = 0.5;

      var g0 = ctx.createRadialGradient(sp[0], sp[1], sunR * 0.7, sp[0], sp[1], sunR * 4.5);
      g0.addColorStop(0, withAlpha(c3, 0.45));
      g0.addColorStop(0.45, withAlpha(c3, 0.14));
      g0.addColorStop(1, withAlpha(c3, 0));
      ctx.fillStyle = g0;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR * 4.5, 0, TAU); ctx.fill();

      var g1 = ctx.createRadialGradient(sp[0] - sunR * 0.3, sp[1] - sunR * 0.3, 0, sp[0], sp[1], sunR);
      g1.addColorStop(0, 'rgba(255,255,255,0.95)');
      g1.addColorStop(0.5, c3);
      g1.addColorStop(1, withAlpha(c3, 0.85));
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR, 0, TAU); ctx.fill();

      if (selected && selected.id === 'sun') {
        ctx.strokeStyle = cI; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR + 8, 0, TAU); ctx.stroke();
      }
    }

    // 行星
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n = 0; n < PLANETS.length; n++) {
      var b = PLANETS[n];
      if (!showFlags[b.id]) continue;
      var s = w2s(b.x, b.y);
      var R = planetVisR(b) * view.scale;
      if (R < 0.6) R = 0.6;
      var color = CMAP[b.ck] || cN;

      if (b.ring && R > 2) {
        ctx.save();
        ctx.translate(s[0], s[1]);
        ctx.rotate(-0.35);
        ctx.strokeStyle = withAlpha(color, 0.6);
        ctx.lineWidth = Math.max(1.5, R * 0.32);
        ctx.beginPath();
        ctx.ellipse(0, 0, R * 1.95, R * 0.68, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      var hlt = (selected === b) ? cI : null;
      drawSphere(s[0], s[1], R, color, hlt);

      if (showLabel && R > 3) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.fillText(b.name, s[0], s[1] + R + 13);
      }
    }

    // 卫星
    for (var pid in MOONS) {
      var moons = MOONS[pid];
      for (var mi = 0; mi < moons.length; mi++) {
        var m = moons[mi];
        if (!showFlags[m.id]) continue;
        if (!m.parent) continue;
        if (m.screenX == null) continue;

        var mx = m.screenX, my = m.screenY;
        var mR = m.screenR;
        if (mR < 0.4) mR = 0.4;

        // 卫星轨道线（视图足够大才显示）
        if (showOrbit && mR > 1.5 && view.scale > baseScale * 3) {
          var ps = w2s(m.parent.x, m.parent.y);
          var pr = planetVisR(m.parent) * view.scale;
          ctx.strokeStyle = withAlpha(cN, 0.35);
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.arc(ps[0], ps[1], pr * m.orbitMult, 0, TAU);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        var mhlt = (selected === m) ? cI : null;
        drawSphere(mx, my, mR, CMAP[m.ck] || cN, mhlt);

        if (showLabel && mR > 3) {
          ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.fillText(m.name, mx, my + mR + 12);
        }
      }
    }

    // 彗星
    if (showFlags.comet) {
      var cs = w2s(COMET.x, COMET.y);
      var cR = 3 * sizeMult * view.scale;
      if (cR < 0.6) cR = 0.6;
      var dir = Math.atan2(COMET.y, COMET.x);
      var tn = Math.max(0, Math.min(1, (COMET.rReal - 0.5) / 20));
      var tailLen = (90 - 60 * tn) * Math.max(0.5, Math.min(3, view.scale / baseScale));
      var tx = cs[0] + Math.cos(dir) * tailLen;
      var ty = cs[1] + Math.sin(dir) * tailLen;
      var g2 = ctx.createLinearGradient(cs[0], cs[1], tx, ty);
      g2.addColorStop(0, withAlpha(c2, 0.85));
      g2.addColorStop(1, withAlpha(c2, 0));
      ctx.strokeStyle = g2;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cs[0], cs[1]);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.lineCap = 'butt';

      drawSphere(cs[0], cs[1], cR, c2, (selected === COMET) ? cI : null);

      if (showLabel && cR > 2) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = withAlpha(c2, 1);
        ctx.fillText('哈雷彗星', cs[0], cs[1] + cR + 14);
      }
    }

    ctx.textBaseline = 'alphabetic';
  }

  // =============== 读数 ===============
  var roCount = 0;
  function updateReadout() {
    var el = document.getElementById('readout');
    var t = '模拟时间：<b>' + simYears.toFixed(2) + '</b> 年<br>';
    var u = speedUnit === 'day' ? '天/秒' : speedUnit === 'century' ? '世纪/秒' : '年/秒';
    t += '流速：<b>' + speedVal.toFixed(2) + '</b> ' + u + '<br>';
    t += '缩放：<b>' + (view.scale / baseScale).toFixed(2) + '×</b>';
    el.innerHTML = t;
  }

  function syncTable() {
    var rows = document.querySelectorAll('#bodyRows tr');
    var nm = selected ? selected.name : '';
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', rows[i].getAttribute('data-name') === nm);
    }
  }

  // =============== 简介面板 ===============
  function showInfo(obj) {
    var key = obj.id || '';
    var info = INFO[key];
    if (!info) {
      info = { title: obj.name, meta: '', body: '暂无简介' };
    }
    document.getElementById('infoTitle').textContent = info.title;
    document.getElementById('infoBody').textContent = info.body;
    document.getElementById('infoMeta').innerHTML = info.meta;
    var panel = document.getElementById('infoPanel');
    panel.classList.add('show');
    panel.scrollTop = 0;
  }

  // =============== 点击检测 ===============
  function pickTarget(px, py) {
    var best = null, bestD = 30;

    // 太阳
    if (showFlags.sun) {
      var sp = w2s(0, 0);
      var sunR = 14 * sizeMult * view.scale;
      if (sunR < 8) sunR = 8;
      var d = Math.hypot(sp[0] - px, sp[1] - py);
      if (d < sunR + 12 && d < bestD) { best = SUN; bestD = d; }
    }

    // 卫星（优先后测，覆盖行星）
    for (var pid in MOONS) {
      var moons = MOONS[pid];
      for (var i = 0; i < moons.length; i++) {
        var m = moons[i];
        if (!showFlags[m.id] || !m.parent) continue;
        if (m.screenX == null) continue;
        var dd = Math.hypot(m.screenX - px, m.screenY - py);
        var r = Math.max(m.screenR, 10) + 10;
        if (dd < r && dd < bestD) { best = m; bestD = dd; }
      }
    }

    // 行星
    for (var j = 0; j < PLANETS.length; j++) {
      var b = PLANETS[j];
      if (!showFlags[b.id]) continue;
      var s = w2s(b.x, b.y);
      var R = Math.max(planetVisR(b) * view.scale, 8);
      var d2 = Math.hypot(s[0] - px, s[1] - py);
      if (d2 < R + 12 && d2 < bestD) { best = b; bestD = d2; }
    }

    // 彗星
    if (showFlags.comet) {
      var cs = w2s(COMET.x, COMET.y);
      var cR = Math.max(3 * sizeMult * view.scale, 8);
      var dc = Math.hypot(cs[0] - px, cs[1] - py);
      if (dc < cR + 12 && dc < bestD) { best = COMET; bestD = dc; }
    }

    return best;
  }

  // 表格点击
  var trs = document.querySelectorAll('#bodyRows tr');
  for (var ti = 0; ti < trs.length; ti++) {
    (function(tr){
      tr.addEventListener('click', function(){
        var name = tr.getAttribute('data-name');
        var target = null;
        if (name === '太阳') target = SUN;
        else if (name === '哈雷彗星') target = COMET;
        else if (name === '小行星带') target = { id:'belt', name:'小行星带', x:0, y:0 };
        else {
          for (var i = 0; i < PLANETS.length; i++) {
            if (PLANETS[i].name === name) { target = PLANETS[i]; break; }
          }
          if (!target) {
            for (var pid in MOONS) {
              for (var k = 0; k < MOONS[pid].length; k++) {
                if (MOONS[pid][k].name === name) { target = MOONS[pid][k]; break; }
              }
              if (target) break;
            }
          }
        }
        if (target) {
          focusOn(target);
          showInfo(target);
          syncTable();
        }
      });
    })(trs[ti]);
  }

  // =============== 交互 ===============
  var activePointer = null;
  var dragStart = null;

  canvas.addEventListener('pointerdown', function(e){
    if (activePointer !== null) return;
    activePointer = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;

    var hit = pickTarget(px, py);
    if (hit) {
      focusOn(hit);
      showInfo(hit);
      syncTable();
      dragStart = null;
    } else {
      dragStart = { x: px, y: py, cx: targetView.cx, cy: targetView.cy };
    }
  });

  canvas.addEventListener('pointermove', function(e){
    if (activePointer === null || e.pointerId !== activePointer || !dragStart) return;
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - dragStart.x;
    var dy = py - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      targetView.cx = dragStart.cx - dx / view.scale;
      targetView.cy = dragStart.cy - dy / view.scale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
    }
  });

  function endPointer(e){
    if (activePointer === null || e.pointerId !== activePointer) return;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    activePointer = null;
    dragStart = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // 侧栏
  document.getElementById('speedRange').addEventListener('input', function(e){
    speedVal = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = speedVal.toFixed(2);
  });
  document.getElementById('speedUnit').addEventListener('change', function(e){
    speedUnit = e.target.value;
  });
  document.getElementById('sizeRange').addEventListener('input', function(e){
    sizeMult = parseFloat(e.target.value);
    document.getElementById('sizeVal').textContent = sizeMult.toFixed(1);
  });
  document.getElementById('orbitToggle').addEventListener('change', function(e){ showOrbit = e.target.checked; });
  document.getElementById('labelToggle').addEventListener('change', function(e){ showLabel = e.target.checked; });

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', resetView);

  // =============== 主循环 ===============
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;

    // 时间流速：统一换算到"年"
    if (playing) {
      var yearsPerSec = speedVal;
      if (speedUnit === 'day') yearsPerSec = speedVal / 365.25;
      else if (speedUnit === 'century') yearsPerSec = speedVal * 100;
      simYears += dt * yearsPerSec;
    }

    // 视图 lerp
    if (!autoFit) {
      view.cx += (targetView.cx - view.cx) * 0.12;
      view.cy += (targetView.cy - view.cy) * 0.12;
      view.scale += (targetView.scale - view.scale) * 0.12;
    } else {
      view.cx += (0 - view.cx) * 0.12;
      view.cy += (0 - view.cy) * 0.12;
      view.scale += (baseScale - view.scale) * 0.12;
      targetView.cx = 0; targetView.cy = 0; targetView.scale = baseScale;
    }

    updatePositionCache();
    draw();

    if (++roCount >= 6) { roCount = 0; updateReadout(); }
  }

  // =============== 启动 ===============
  resize();
  view.cx = 0; view.cy = 0; view.scale = baseScale;
  targetView.cx = 0; targetView.cy = 0; targetView.scale = baseScale;
  updatePositionCache();
  updateReadout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
