<h1>太阳系星际追踪</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>天体</th><th>半长轴 a</th><th>周期 T</th></tr></thead>
    <tbody id="bodyRows">
      <tr data-name="太阳"><td>太阳</td><td>—</td><td>—</td></tr>
      <tr data-name="水星"><td>水星</td><td>0.39 AU</td><td>0.24 年</td></tr>
      <tr data-name="金星"><td>金星</td><td>0.72 AU</td><td>0.62 年</td></tr>
      <tr data-name="地球"><td>地球</td><td>1.00 AU</td><td>1.00 年</td></tr>
      <tr data-name="火星"><td>火星</td><td>1.52 AU</td><td>1.88 年</td></tr>
      <tr data-name="小行星带"><td>小行星带</td><td>2.1~3.3</td><td>3~6 年</td></tr>
      <tr data-name="木星"><td>木星</td><td>5.20 AU</td><td>11.86 年</td></tr>
      <tr data-name="土星"><td>土星</td><td>9.54 AU</td><td>29.45 年</td></tr>
      <tr data-name="天王星"><td>天王星</td><td>19.19 AU</td><td>84.02 年</td></tr>
      <tr data-name="海王星"><td>海王星</td><td>30.07 AU</td><td>164.8 年</td></tr>

  <h3>控制面板</h3>

    <input type="range" id="speedRange" min="0.01" max="20" value="1" step="0.01">
  </label>
  <div class="row">
    <label for="speedUnit" style="margin:0">单位</label>
    <select id="speedUnit">
      <option value="day" selected>天/秒</option>
      <option value="year">年/秒</option>
      <option value="century">世纪/秒</option>
    </select>
  </div>

  <label>天体尺寸 = <span id="sizeVal">1.0</span> ×
    <input type="range" id="sizeRange" min="0.5" max="3" value="1" step="0.1">

  <div class="row"><input type="checkbox" id="orbitToggle" checked><label for="orbitToggle" style="margin:0">显示轨道线</label></div>
  <div class="row"><input type="checkbox" id="labelToggle" checked><label for="labelToggle" style="margin:0">显示名称</label></div>

  <div class="body-toggles" id="bodyToggles"></div>

  <button id="playBtn">⏸ 暂停</button>

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  var cssW = 800, cssH = 500, dpr = 1;
  var baseScale = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var targetView = { cx: 0, cy: 0, scale: 1 };
  var tilt = 0, targetTilt = 0;
  var sizeMult = 1;
  var speedVal = 1, speedUnit = 'day';
  var playing = true;
  var simYears = 0;
  var showOrbit = true, showLabel = true;
  var selected = null;
  var autoFit = true;
  var followTarget = null;
  var focusOnPlanet = null;

  // =============== 真实天文颜色常量 ===============
  var C_SUN_CORE = '#fff5c8';
  var C_SUN_EDGE = '#ffb238';
  var C_SAT_RING = 'rgba(201,180,135,0.85)';
  var C_COMET    = '#7ec8e3';
  var C_COMET_TAIL = 'rgba(126,200,227,0.9)';

  function withAlpha(c, a) {
    if (!c) return 'rgba(0,0,0,' + a + ')';
    c = String(c).trim();
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      if (h.length >= 6) {
        var n = parseInt(h.slice(0, 6), 16);
        if (isNaN(n)) return c;
        return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
      }
    }
    var m = c.match(/^rgba?\(([^)]+)\)$/i);
    if (m) {
      var p = m[1].split(',');
      if (p.length >= 3) return 'rgba(' + p[0].trim() + ',' + p[1].trim() + ',' + p[2].trim() + ',' + a + ')';
    }
    return c;
  }
  function compR(a) { return Math.pow(a, 0.5) * 10; }
  function w2s(x, y) {
    return [cssW / 2 + (x - view.cx) * view.scale, cssH / 2 + (y - view.cy) * view.scale];
  }
  function cosTilt() { return Math.cos(tilt * Math.PI / 2 * 0.92); }
  var SUN_R = 3.2;
  function planetR(p) { return p.r * 0.9; }
  function moonR(m) { return m.r * 0.9; }
  function pseudo(seed) {
    var x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  // =============== 天体数据（realColor 为真实天文颜色） ===============
  var SUN = { id:'sun', name:'太阳', isSun:true, x:0, y:0 };

  var PLANETS = [
    { id:'mercury', name:'水星', a:0.387, T:0.241, r:1.3, th0:0.6, x:0, y:0, surf:'mercury', realColor:'#9c9086' },
    { id:'venus',   name:'金星', a:0.723, T:0.615, r:1.9, th0:2.2, x:0, y:0, surf:'venus',   realColor:'#e8c87a' },
    { id:'earth',   name:'地球', a:1.000, T:1.000, r:2.0, th0:4.1, x:0, y:0, surf:'earth',   realColor:'#3a7bd5' },
    { id:'mars',    name:'火星', a:1.524, T:1.881, r:1.6, th0:1.1, x:0, y:0, surf:'mars',    realColor:'#c1440e' },
    { id:'jupiter', name:'木星', a:5.203, T:11.86, r:4.6, th0:3.7, x:0, y:0, surf:'jupiter', realColor:'#c9a66b' },
    { id:'saturn',  name:'土星', a:9.537, T:29.45, r:4.0, th0:5.5, x:0, y:0, surf:'saturn',  realColor:'#e3c896', ring:true },
    { id:'uranus',  name:'天王星', a:19.19, T:84.02, r:3.0, th0:0.9, x:0, y:0, surf:'uranus',  realColor:'#a8dadc' },
    { id:'neptune', name:'海王星', a:30.07, T:164.8, r:3.0, th0:2.7, x:0, y:0, surf:'neptune', realColor:'#3b5bdb' }
  ];

  var MOONS = {
    earth:   [ { id:'moon', name:'月球', r:0.55, orbitMult:1.5, T:0.0748, th0:0.8, isMoon:true, realColor:'#b0b0b0' } ],
    mars:    [ { id:'phobos', name:'火卫一', r:0.28, orbitMult:1.15, T:0.00087, th0:1.2, isMoon:true, realColor:'#8a7d6b' },
               { id:'deimos', name:'火卫二', r:0.22, orbitMult:1.5, T:0.0034, th0:3.5, isMoon:true, realColor:'#7a6f5f' } ],
    jupiter: [ { id:'io', name:'木卫一', r:0.5, orbitMult:1.15, T:0.0048, th0:0.4, isMoon:true, realColor:'#e8d84a' },
               { id:'europa', name:'木卫二', r:0.45, orbitMult:1.3, T:0.0097, th0:1.8, isMoon:true, realColor:'#d4c5a0' },
               { id:'ganymede', name:'木卫三', r:0.65, orbitMult:1.45, T:0.0196, th0:3.2, isMoon:true, realColor:'#9a8a7a' },
               { id:'callisto', name:'木卫四', r:0.6, orbitMult:1.6, T:0.0457, th0:4.9, isMoon:true, realColor:'#6b5d4f' } ],
    saturn:  [ { id:'titan', name:'土卫六', r:0.7, orbitMult:1.5, T:0.0436, th0:2.4, isMoon:true, realColor:'#d68e3a' } ]
  };

  var COMET = { id:'comet', name:'哈雷彗星', a:17.8, e:0.967, T:75.1, M0:1.5, x:0, y:0, rReal:0 };

  var showFlags = {
    sun:true, mercury:true, venus:true, earth:true, mars:true,
    belt:true, jupiter:true, saturn:true, uranus:true, neptune:true, comet:true
  };

  // 小行星带（颜色为真实灰岩色）
  var BELT_COLOR = 'rgba(140,130,120,0.7)';
  var beltParticles = [];
  for (var bi = 0; bi < 220; bi++) {
    var aAU = 2.1 + Math.random() * 1.2;
    beltParticles.push({
      aAU: aAU,
      th0: Math.random() * TAU,
      omega: TAU / (Math.pow(aAU, 1.5) * 365),
      r: 0.6 + Math.random() * 0.6
    });
  }

  function solveKepler(M, e) {
    M = M % TAU; if (M < 0) M += TAU;
    var E = M + e * Math.sin(M);
    for (var i = 0; i < 10; i++) {
      var d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= d;
      if (Math.abs(d) < 1e-6) break;
    }
    return E;
  }
  var cometPath = (function(){
    var pts = [], N = 300;
    for (var i = 0; i <= N; i++) {
      var E = i / N * TAU;
      var r = COMET.a * (1 - COMET.e * Math.cos(E));
      var th = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
      var rd = compR(r);
      pts.push([Math.cos(th) * rd, Math.sin(th) * rd]);
    }
    return pts;
  })();

  var INFO = {
    sun: { title: '太阳', meta: '类型：G2V 主序星 · 直径约 139 万千米 · 表面温度约 5500℃ · 占太阳系质量 99.86%',
      body: '太阳是太阳系的绝对中心，是一颗中等质量的黄矮星，通过核心的氢核聚变每秒将约 6 亿吨氢转化为氦，释放出巨大能量。它的引力主宰着八大行星、矮行星、小行星带与彗星的轨道。太阳的直径约为地球的 109 倍，内部可以装下 130 万个地球。太阳活动如黑子、耀斑、日冕物质抛射会影响地球磁场，产生极光并干扰无线电通信。太阳已经燃烧了约 46 亿年，预计还能稳定燃烧约 50 亿年。' },
    mercury: { title: '水星', meta: '距日：约 0.39 AU · 公转周期：88 天 · 自转周期：58.6 天 · 无卫星',
      body: '水星是太阳系中最小、距太阳最近的行星，表面布满陨石坑，外貌酷似月球。由于几乎没有大气层，昼夜温差极端，白天可达 430℃，夜间降至 -180℃。水星轨道偏心率较大（0.206），公转速度最快，每 88 天绕太阳一周。它的自转与公转存在 3:2 的自旋轨道共振，因此水星上的"一天"（从日出到下一次日出）长达 176 个地球日。水星拥有异常巨大的铁核，约占其总体积的 55%。' },
    venus: { title: '金星', meta: '距日：约 0.72 AU · 公转周期：225 天 · 自转周期：243 天（逆行） · 无卫星',
      body: '金星是太阳系中最热的行星，表面温度约 465℃，主要原因是浓密的二氧化碳大气造成极端温室效应。它的气压是地球海平面的 92 倍。金星自转方向与多数行星相反（逆行），且自转周期比公转周期还长。金星与地球大小相近，被称为地球的"姊妹星"，但由于温室效应失控，表面环境完全不适合生命。金星上空覆盖着浓密的硫酸云层，是夜空中最亮的行星。' },
    earth: { title: '地球', meta: '距日：1 AU · 公转周期：365.25 天 · 自转周期：23 时 56 分 · 1 颗天然卫星',
      body: '地球是目前已知唯一存在生命的星球，71% 的表面被液态水覆盖，大气以氮和氧为主，形成了保护生命的臭氧层。地球拥有合适的位置（宜居带）、适中的质量（保持大气）以及一个巨大的金属核（产生磁场）。地球的磁场屏蔽了大部分太阳风，避免大气被剥离。地球自转产生昼夜交替，地轴倾角 23.5° 产生四季变化。地球内部的对流运动驱动板块构造，形成山脉、地震与火山。' },
    moon: { title: '月球', meta: '距地：约 38.4 万千米 · 公转周期：27.3 天 · 直径：3476 千米 · 潮汐锁定',
      body: '月球是地球唯一的天然卫星，也是太阳系中第五大卫星。它被地球潮汐锁定，因此永远以同一面朝向地球。月球表面主要有明亮的"高地"和暗色的"月海"（古代熔岩平原）。由于没有大气层，月球昼夜温差极大，且表面保留了大量陨石坑。月球引力是地球潮汐的主要来源，对地球气候与生命演化有重要影响。月球也是人类唯一登陆过的天体，阿波罗计划共带回 382 千克月岩样本。' },
    mars: { title: '火星', meta: '距日：1.52 AU · 公转周期：687 天 · 自转周期：24.6 小时 · 2 颗卫星',
      body: '火星因表面富含氧化铁而呈现红色，被称为"红色星球"。火星拥有太阳系最高的火山——奥林帕斯山（约 22 千米），以及最长的峡谷——水手号谷（长约 4000 千米）。火星大气稀薄（主要为二氧化碳），表面气压仅地球的 0.6%，但存在极冠、季节性沙尘暴以及古代河床遗迹，表明曾有液态水存在。火星是当前人类深空探测的热点，多个探测器已在其表面工作。' },
    phobos: { title: '火卫一', meta: '距火星：约 9376 千米 · 公转周期：7.66 小时 · 直径：约 22.5 千米',
      body: '火卫一是火星两颗天然卫星中较大、距离火星更近的一颗，形状不规则，表面布满陨石坑与沟槽。它绕火星公转的速度快于火星自转，因此在火星表面会看到它从西边升起、东边落下。火卫一的轨道正在缓慢缩小，预计数千万年后将坠毁在火星表面或碎裂成环。' },
    deimos: { title: '火卫二', meta: '距火星：约 23463 千米 · 公转周期：30.3 小时 · 直径：约 12.4 千米',
      body: '火卫二是火星两颗卫星中较小的一颗，外形不规则，表面相对光滑（陨石坑被尘埃覆盖）。它的轨道比火卫一远得多，公转周期约 30 小时，在火星表面看升起缓慢。火卫二与火卫一可能都是被火星捕获的小行星。' },
    belt: { title: '小行星带', meta: '位置：火星与木星之间 · 距日：约 2.1~3.3 AU · 公转周期：3~6 年',
      body: '小行星带是太阳系中位于火星与木星之间的环状天体密集区，包含了数百万颗小行星，已编号的超过 100 万颗。尽管数量庞大，但总质量仅约为月球的 4%，主要成因是木星强大引力阻止了物质聚合形成行星。最大的天体是谷神星（直径约 940 千米，被归类为矮行星），其次是灶神星、智神星等。小行星带的天体轨道较为稳定，但受木星等引力扰动偶尔会被抛出，形成近地小行星。' },
    jupiter: { title: '木星', meta: '距日：5.20 AU · 公转周期：11.86 年 · 自转周期：9.9 小时 · 95+ 颗卫星',
      body: '木星是太阳系最大的行星，质量是其他七大行星总和的 2.5 倍。它主要由氢和氦组成，没有固体表面，大气中著名的大红斑是一个持续数百年的巨型风暴。木星拥有最强大的磁场和辐射带，以及四颗伽利略卫星（木卫一至四）。木星在太阳系演化中扮演"清道夫"角色，它的引力影响小行星带与柯伊伯带，也保护内太阳系免受大量彗星撞击。' },
    io: { title: '木卫一 (Io)', meta: '距木星：约 42 万千米 · 公转周期：1.77 天 · 直径：3643 千米',
      body: '木卫一是太阳系中火山活动最剧烈的天体，表面有超过 400 座活火山，喷发羽流可高达 400 千米。这种剧烈活动源于木星强大潮汐力对其内部的反复挤压加热。木卫一表面呈黄、橙、红、黑等多种颜色，覆盖着硫化物与硅酸盐沉积。它几乎没有水，是太阳系中最干燥的天体之一。' },
    europa: { title: '木卫二 (Europa)', meta: '距木星：约 67 万千米 · 公转周期：3.55 天 · 直径：3122 千米',

  function updatePlanets() {
    var ct = cosTilt();
    for (var i = 0; i < PLANETS.length; i++) {
      var b = PLANETS[i];
      var th = b.th0 + TAU * simYears / b.T;
      var rd = compR(b.a);
      b.x = Math.cos(th) * rd;
      b.y = Math.sin(th) * rd * ct;
    }
    var M = COMET.M0 + TAU * simYears / COMET.T;
    var E = solveKepler(M, COMET.e);
    var r = COMET.a * (1 - COMET.e * Math.cos(E));
    var theta = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
    var rd2 = compR(r);
    COMET.x = Math.cos(theta) * rd2;
    COMET.y = Math.sin(theta) * rd2 * ct;
    COMET.rReal = r;
  }

  function updateMoonWorldPositions() {
    var ct = cosTilt();
    for (var pid in MOONS) {
      var planet = null;
      for (var i = 0; i < PLANETS.length; i++) {
        if (PLANETS[i].id === pid) { planet = PLANETS[i]; break; }
      }
      if (!planet) continue;
      var pr = planetR(planet);
      var moons = MOONS[pid];
      for (var j = 0; j < moons.length; j++) {
        var m = moons[j];
        m.parent = planet;
        var orbitR = pr * m.orbitMult;
        var angle = m.th0 + TAU * simYears / m.T;
        m.worldX = planet.x + Math.cos(angle) * orbitR;
        m.worldY = planet.y + Math.sin(angle) * orbitR * ct;
        m.worldR = moonR(m);
      }
    }
  }

  function updateBaseScale() {
    var maxR = compR(30.07);
    var half = Math.min(cssW, cssH) / 2;
    baseScale = (half * 0.88) / maxR;
    if (!isFinite(baseScale) || baseScale <= 0) baseScale = 1;
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateBaseScale();
    if (autoFit) { view.scale = baseScale; targetView.scale = baseScale; }
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  function focusOn(obj) {
    if (!obj) return;
    selected = obj;
    autoFit = false;
    var minDim = Math.min(cssW, cssH);
    if (!isFinite(minDim) || minDim < 50) minDim = 500;

    if (obj.id === 'sun' || obj.isSun) {
      followTarget = null;
      targetView.cx = 0; targetView.cy = 0;
      targetView.scale = (minDim * 0.4) / (SUN_R * Math.max(0.1, sizeMult));
      targetTilt = 0;
      focusOnPlanet = null;
      return;
    }
    if (obj.isMoon) {
      if (!obj.parent) return;
      var mr = moonR(obj);
      if (!isFinite(mr) || mr <= 0) mr = 0.3;
      followTarget = obj;
      focusOnPlanet = obj.parent;
      targetView.scale = (minDim * 0.4) / (mr * Math.max(0.1, sizeMult));
      targetTilt = 0.85;
      return;
    }
    if (obj.id === 'comet') {
      followTarget = COMET;
      targetView.scale = (minDim * 0.3) / Math.max(0.1, sizeMult);
      targetTilt = 0.55;
      focusOnPlanet = null;
      return;
    }
    if (obj.id === 'belt') {
      followTarget = null;
      targetView.cx = 0; targetView.cy = 0;
      targetView.scale = baseScale * 1.8;
      targetTilt = 0.45;
      focusOnPlanet = null;
      return;
    }
    var planet = obj;
    var pr2 = planetR(planet);
    if (!isFinite(pr2) || pr2 <= 0) pr2 = 1;
    followTarget = planet;
    focusOnPlanet = planet;
    targetView.scale = (minDim * 0.32) / (pr2 * Math.max(0.1, sizeMult));
    targetTilt = 0.85;
  }

  function resetView() {
    selected = null;
    followTarget = null;
    focusOnPlanet = null;
    autoFit = true;
    targetTilt = 0;
    targetView.cx = 0; targetView.cy = 0;
    targetView.scale = baseScale;
    document.getElementById('infoPanel').classList.remove('show');
    syncTable();
  }

  function goBack() {
    if (selected && selected.isMoon && selected.parent) {
      var parent = selected.parent;
      focusOn(parent);
      showInfo(parent);
      syncTable();
      return;
    }
    if (!autoFit || selected) {
      resetView();
    }
  }

  function drawPlanetSurface(sx, sy, R, baseColor, surf) {
    if (R < 0.5) R = 0.5;
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
    if (R < 3) return;

    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.clip();

    // 地球：蓝色海洋 + 绿色大陆 + 白云
    if (surf === 'earth' && R > 6) {
      var continents = [
        {x:-0.35, y:-0.2, s:0.35, a:0.85},
        {x:0.2, y:0.35, s:0.28, a:0.85},
        {x:0.4, y:-0.4, s:0.2, a:0.75},
        {x:-0.1, y:0.5, s:0.15, a:0.7}
      ];
      for (var ci = 0; ci < continents.length; ci++) {
        var c = continents[ci];
        ctx.fillStyle = 'rgba(74,124,89,' + c.a + ')';
        ctx.beginPath();
        ctx.ellipse(sx + c.x*R, sy + c.y*R, c.s*R, c.s*R*0.7, 0, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#fff';
      for (var i = 0; i < 5; i++) {
        var a = pseudo(i*3.1) * TAU;
        var rr = pseudo(i*5.7) * 0.7;
        ctx.beginPath();
        ctx.ellipse(sx + Math.cos(a)*rr*R, sy + Math.sin(a)*rr*R, (0.15+pseudo(i*7.3)*0.15)*R, (0.08+pseudo(i*9.1)*0.08)*R, pseudo(i*11)*Math.PI, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 火星：白色极冠 + 暗褐色陨石坑
    if (surf === 'mars' && R > 6) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.ellipse(sx, sy - R*0.85, R*0.4, R*0.15, 0, 0, TAU);
      ctx.fill();
      for (var i = 0; i < 8; i++) {
        var a = pseudo(i*2.7) * TAU;
        var rr = pseudo(i*4.3) * 0.75;
        var px = sx + Math.cos(a)*rr*R;
        var py = sy + Math.sin(a)*rr*R;
        var pr = (0.05 + pseudo(i*6.9)*0.08) * R;
        ctx.fillStyle = 'rgba(80,25,15,0.55)';
        ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      }
    }

    // 木星：棕白交替条纹 + 大红斑
    if (surf === 'jupiter' && R > 8) {
      var stripes = [
        'rgba(210,180,140,0.55)',  // 亮米
        'rgba(150,110,75,0.5)',    // 深棕
        'rgba(200,170,130,0.55)',
        'rgba(140,100,70,0.5)',
        'rgba(210,185,145,0.55)',
        'rgba(150,110,75,0.5)',
        'rgba(200,170,130,0.55)',
        'rgba(140,100,70,0.5)'
      ];
      for (var b = -4; b <= 4; b++) {
        if (b === 0) continue;
        ctx.fillStyle = stripes[Math.abs(b) - 1];
        ctx.beginPath();
        ctx.ellipse(sx, sy + b*R*0.17, R*0.98, R*0.06, 0, 0, TAU);
        ctx.fill();
      }
      // 大红斑
      ctx.fillStyle = 'rgba(180,70,50,0.8)';
      ctx.beginPath();
      ctx.ellipse(sx + R*0.25, sy + R*0.18, R*0.22, R*0.13, 0.1, 0, TAU);
      ctx.fill();
    }

    // 土星：淡金条纹
    if (surf === 'saturn' && R > 8) {
      for (var b = -3; b <= 3; b++) {
        if (b === 0) continue;
        ctx.fillStyle = 'rgba(210,180,130,0.45)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + b*R*0.18, R*0.95, R*0.055, 0, 0, TAU);
        ctx.fill();
      }
    }

    // 水星：灰褐陨石坑
    if (surf === 'mercury' && R > 5) {
      for (var i = 0; i < 10; i++) {
        var a = pseudo(i*1.9) * TAU;
        var rr = pseudo(i*3.1) * 0.8;
        var px = sx + Math.cos(a)*rr*R;
        var py = sy + Math.sin(a)*rr*R;
        var pr = (0.04 + pseudo(i*5.3)*0.07) * R;
        ctx.fillStyle = 'rgba(80,74,68,0.6)';
        ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(200,190,175,0.4)';
        ctx.beginPath(); ctx.arc(px - pr*0.3, py - pr*0.3, pr*0.55, 0, TAU); ctx.fill();
      }
    }

    // 金星：奶黄色云带
    if (surf === 'venus' && R > 5) {
      for (var i = 0; i < 5; i++) {
        var yOff = (i - 2) * R * 0.28;
        ctx.fillStyle = 'rgba(245,225,175,0.4)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + yOff, R*0.9, R*0.1, 0, 0, TAU);
        ctx.fill();
      }
    }

    // 天王星：淡青色微弱条纹
    if (surf === 'uranus' && R > 5) {
      for (var i = 0; i < 3; i++) {
        var yOff = (i - 1) * R * 0.4;
        ctx.fillStyle = 'rgba(220,245,245,0.28)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + yOff, R*0.85, R*0.07, 0, 0, TAU);
        ctx.fill();
      }
    }

    // 海王星：深蓝 + 大暗斑
    if (surf === 'neptune' && R > 5) {
      ctx.fillStyle = 'rgba(20,40,110,0.55)';
      ctx.beginPath();
      ctx.ellipse(sx + R*0.2, sy + R*0.15, R*0.25, R*0.14, 0.1, 0, TAU);
      ctx.fill();
      for (var i = 0; i < 3; i++) {
        var yOff = (i - 1) * R * 0.38;
        ctx.fillStyle = 'rgba(140,170,240,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + yOff, R*0.85, R*0.06, 0, 0, TAU);
        ctx.fill();
      }
    }

    ctx.restore();

    // 高光
    var g1 = ctx.createRadialGradient(sx - R * 0.38, sy - R * 0.38, R * 0.05, sx - R * 0.38, sy - R * 0.38, R * 1.6);
    g1.addColorStop(0, 'rgba(255,255,255,0.5)');
    g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    // 阴影
    var g2 = ctx.createRadialGradient(sx + R * 0.55, sy + R * 0.55, R * 0.1, sx + R * 0.55, sy + R * 0.55, R * 1.85);
    g2.addColorStop(0, 'rgba(0,0,0,0.5)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
  }

  function drawMoonSurface(sx, sy, R, baseColor) {
    if (R < 0.5) R = 0.5;
    ctx.fillStyle = baseColor;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
    if (R < 4) return;

    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.clip();
    for (var i = 0; i < 8; i++) {
      var a = pseudo(i*2.3) * TAU;
      var rr = pseudo(i*4.1) * 0.8;
      var px = sx + Math.cos(a)*rr*R;
      var py = sy + Math.sin(a)*rr*R;
      var pr = (0.05 + pseudo(i*6.2)*0.09) * R;
      ctx.fillStyle = 'rgba(40,40,40,0.5)';
      ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
    }
    ctx.restore();

    var g1 = ctx.createRadialGradient(sx - R * 0.38, sy - R * 0.38, R * 0.05, sx - R * 0.38, sy - R * 0.38, R * 1.6);
    g1.addColorStop(0, 'rgba(255,255,255,0.45)');
    g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    var g2 = ctx.createRadialGradient(sx + R * 0.55, sy + R * 0.55, R * 0.1, sx + R * 0.55, sy + R * 0.55, R * 1.85);
    g2.addColorStop(0, 'rgba(0,0,0,0.5)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
  }

  function drawSun() {
    var sp = w2s(0, 0);
    var sunR = SUN_R * sizeMult * view.scale;
    if (sunR < 1) sunR = 1;

    // 日冕光晕
    var g0 = ctx.createRadialGradient(sp[0], sp[1], sunR * 0.7, sp[0], sp[1], sunR * 4);
    g0.addColorStop(0, 'rgba(255,190,80,0.45)');
    g0.addColorStop(0.5, 'rgba(255,150,50,0.15)');
    g0.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR * 4, 0, TAU); ctx.fill();

    // 本体
    var g1 = ctx.createRadialGradient(sp[0] - sunR * 0.3, sp[1] - sunR * 0.3, 0, sp[0], sp[1], sunR);
    g1.addColorStop(0, C_SUN_CORE);
    g1.addColorStop(0.5, C_SUN_EDGE);
    g1.addColorStop(1, '#e07f10');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR, 0, TAU); ctx.fill();

    // 表面米粒组织
    if (sunR > 12) {
      ctx.save();
      ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR, 0, TAU); ctx.clip();
      for (var i = 0; i < 20; i++) {
        var ang = pseudo(i * 3.7) * TAU;
        var rr = Math.sqrt(pseudo(i * 5.1)) * 0.85;
        var px = sp[0] + Math.cos(ang) * rr * sunR;
        var py = sp[1] + Math.sin(ang) * rr * sunR;
        var pr = (0.04 + pseudo(i * 7.3) * 0.1) * sunR;
        ctx.fillStyle = i % 3 === 0
          ? 'rgba(220,120,40,0.4)'
          : 'rgba(255,245,200,0.45)';
        ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }

    if (selected && selected.id === 'sun') {
      ctx.strokeStyle = App.getTheme().img; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR + 6, 0, TAU); ctx.stroke();
    }
  }

  function draw() {
    var TH = App.getTheme();
    var cN = TH.normal, cI = TH.img;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cssW, cssH);

    var o = w2s(0, 0);
    var ct = cosTilt();

    // 轨道线（UI 元素 → 用 TH.normal）
    if (showOrbit) {
      for (var j = 0; j < PLANETS.length; j++) {
        if (!showFlags[PLANETS[j].id]) continue;
        var rx = compR(PLANETS[j].a) * view.scale;
        var ry = rx * ct;
        ctx.strokeStyle = withAlpha(cN, 0.5);
        ctx.setLineDash([]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(o[0], o[1], rx, Math.max(ry, 0.5), 0, 0, TAU);
        ctx.stroke();
      }
      if (showFlags.comet) {
        ctx.strokeStyle = withAlpha(C_COMET, 0.5);
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (var k = 0; k < cometPath.length; k++) {
          var p = w2s(cometPath[k][0], cometPath[k][1] * ct);
          if (k === 0) ctx.moveTo(p[0], p[1]);
          else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 小行星带（真实灰岩色）
    if (showFlags.belt) {
      ctx.fillStyle = BELT_COLOR;
      for (var bpi = 0; bpi < beltParticles.length; bpi++) {
        var bp = beltParticles[bpi];
        var ba = compR(bp.aAU);
        var bth = bp.th0 + bp.omega * simYears * 365;
        var bx = Math.cos(bth) * ba;
        var by = Math.sin(bth) * ba * ct;
        var bsp = w2s(bx, by);
        if (bsp[0] < -10 || bsp[0] > cssW + 10 || bsp[1] < -10 || bsp[1] > cssH + 10) continue;
        ctx.beginPath();
        ctx.arc(bsp[0], bsp[1], bp.r, 0, TAU);
        ctx.fill();
      }
    }

    if (showFlags.sun) drawSun();

    // 行星
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n = 0; n < PLANETS.length; n++) {
      var b = PLANETS[n];
      if (!showFlags[b.id]) continue;
      var s = w2s(b.x, b.y);
      var R = planetR(b) * sizeMult * view.scale;
      if (R < 0.5) R = 0.5;

      // 土星环（后）
      if (b.ring && R > 3) {
        ctx.save();
        ctx.translate(s[0], s[1]);
        ctx.rotate(-0.35);
        ctx.strokeStyle = C_SAT_RING;
        ctx.lineWidth = Math.max(1.5, R * 0.3);
        ctx.beginPath();
        ctx.ellipse(0, 0, R * 1.9, R * 0.65 * ct, 0, Math.PI, TAU);
        ctx.stroke();
        ctx.restore();
      }

      // 行星本体 → 用真实天文颜色
      drawPlanetSurface(s[0], s[1], R, b.realColor, b.surf);

      // 土星环（前）
      if (b.ring && R > 3) {
        ctx.save();
        ctx.translate(s[0], s[1]);
        ctx.rotate(-0.35);
        ctx.strokeStyle = C_SAT_RING;
        ctx.lineWidth = Math.max(1.5, R * 0.3);
        ctx.beginPath();
        ctx.ellipse(0, 0, R * 1.9, R * 0.65 * ct, 0, 0, Math.PI);
        ctx.stroke();
        ctx.restore();
      }

      if (selected === b) {
        ctx.strokeStyle = cI; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s[0], s[1], R + 4, 0, TAU); ctx.stroke();
      }

      if (showLabel && R > 3) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = '#555';
        ctx.fillText(b.name, s[0], s[1] + R + 14);
      }
    }

    // 卫星
    if (focusOnPlanet) {
      var moons = MOONS[focusOnPlanet.id];
      if (moons) {
        if (showOrbit) {
          var ps = w2s(focusOnPlanet.x, focusOnPlanet.y);
          var pr = planetR(focusOnPlanet) * sizeMult * view.scale;
          ctx.strokeStyle = withAlpha(cN, 0.35);
          ctx.setLineDash([3, 4]);
          ctx.lineWidth = 1;
          for (var mi = 0; mi < moons.length; mi++) {
            var m = moons[mi];
            var rx = pr * m.orbitMult;
            var ry = rx * ct;
            ctx.beginPath();
            ctx.ellipse(ps[0], ps[1], rx, Math.max(ry, 0.5), 0, 0, TAU);
            ctx.stroke();
          }
          ctx.setLineDash([]);
        }

        for (var mi = 0; mi < moons.length; mi++) {
          var m = moons[mi];
          if (m.worldX === undefined) continue;
          var mw = w2s(m.worldX, m.worldY);
          var mR = m.worldR * sizeMult * view.scale;
          if (mR < 0.8) mR = 0.8;

          drawMoonSurface(mw[0], mw[1], mR, m.realColor);

          if (selected === m) {
            ctx.strokeStyle = cI; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mw[0], mw[1], mR + 4, 0, TAU); ctx.stroke();
          }

          if (showLabel && mR > 3) {
            ctx.font = '10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillStyle = '#777';
            ctx.fillText(m.name, mw[0], mw[1] + mR + 11);
          }

          m.screenX = mw[0];
          m.screenY = mw[1];
          m.screenR = mR;
        }
      }
    }

    // 彗星（真实淡蓝色等离子尾）
    if (showFlags.comet) {
      var cs = w2s(COMET.x, COMET.y);
      var cR = Math.max(1 * sizeMult * view.scale, 2);
      var dir = Math.atan2(COMET.y - view.cy, COMET.x - view.cx);
      var tn = Math.max(0, Math.min(1, (COMET.rReal - 0.5) / 20));
      var tailLen = (70 - 45 * tn) * Math.max(0.5, Math.min(3, view.scale / baseScale));
      var tx = cs[0] + Math.cos(dir) * tailLen;
      var ty = cs[1] + Math.sin(dir) * tailLen;
      var g2 = ctx.createLinearGradient(cs[0], cs[1], tx, ty);
      g2.addColorStop(0, C_COMET_TAIL);
      g2.addColorStop(1, 'rgba(126,200,227,0)');
      ctx.strokeStyle = g2;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cs[0], cs[1]);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.lineCap = 'butt';

      ctx.fillStyle = C_COMET;
      ctx.beginPath(); ctx.arc(cs[0], cs[1], cR, 0, TAU); ctx.fill();

      if (selected === COMET) {
        ctx.strokeStyle = cI; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cs[0], cs[1], cR + 5, 0, TAU); ctx.stroke();
      }
      if (showLabel && cR > 2) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = '#4a90a4';
        ctx.fillText('哈雷彗星', cs[0], cs[1] + cR + 14);
      }
    }

    ctx.textBaseline = 'alphabetic';
  }

  var roCount = 0;
  function updateReadout() {
    var el = document.getElementById('readout');
    var u = speedUnit === 'day' ? '天/秒' : speedUnit === 'century' ? '世纪/秒' : '年/秒';
    var html = '模拟时间：<b>' + simYears.toFixed(2) + '</b> 年<br>';
    html += '流速：<b>' + speedVal.toFixed(2) + '</b> ' + u + '<br>';
    html += '缩放：<b>' + (view.scale / baseScale).toFixed(2) + '×</b>';
    el.innerHTML = html;
  }

  function syncTable() {
    var rows = document.querySelectorAll('#bodyRows tr');
    var nm = selected ? selected.name : '';
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', rows[i].getAttribute('data-name') === nm);
    }
  }

  function showInfo(obj) {
    var key = obj.id || '';
    var info = INFO[key];
    if (!info) info = { title: obj.name, meta: '', body: '暂无简介' };
    document.getElementById('infoTitle').textContent = info.title;
    document.getElementById('infoBody').textContent = info.body;
    document.getElementById('infoMeta').innerHTML = info.meta;
    var panel = document.getElementById('infoPanel');
    panel.classList.add('show');
    panel.scrollTop = 0;
  }
  document.getElementById('infoClose').addEventListener('click', function(){
    document.getElementById('infoPanel').classList.remove('show');
  });

  function pickTarget(px, py) {
    var best = null, bestD = 30;

    if (focusOnPlanet) {
      var moons = MOONS[focusOnPlanet.id] || [];
      for (var i = 0; i < moons.length; i++) {
        var m = moons[i];
        if (m.screenX == null) continue;
        var dd = Math.hypot(m.screenX - px, m.screenY - py);
        var r = Math.max(m.screenR, 8) + 10;
        if (dd < r && dd < bestD) { best = m; bestD = dd; }
      }
    }

    if (showFlags.sun) {
      var sp = w2s(0, 0);
      var sunR = Math.max(SUN_R * sizeMult * view.scale, 8);
      var d = Math.hypot(sp[0] - px, sp[1] - py);
      if (d < sunR + 10 && d < bestD) { best = SUN; bestD = d; }
    }

    for (var j = 0; j < PLANETS.length; j++) {
      var b = PLANETS[j];
      if (!showFlags[b.id]) continue;
      var s = w2s(b.x, b.y);
      var R = Math.max(planetR(b) * sizeMult * view.scale, 8);
      var d2 = Math.hypot(s[0] - px, s[1] - py);
      if (d2 < R + 10 && d2 < bestD) { best = b; bestD = d2; }
    }

    if (showFlags.comet) {
      var cs = w2s(COMET.x, COMET.y);
      var cR = Math.max(1 * sizeMult * view.scale, 8);
      var dc = Math.hypot(cs[0] - px, cs[1] - py);
      if (dc < cR + 10 && dc < bestD) { best = COMET; bestD = dc; }
    }

    return best;
  }

  var trs = document.querySelectorAll('#bodyRows tr');
  for (var ti = 0; ti < trs.length; ti++) {
    (function(tr){
      tr.addEventListener('click', function(){
        var name = tr.getAttribute('data-name');
        var target = null;
        if (name === '太阳') target = SUN;
        else if (name === '哈雷彗星') target = COMET;
        else if (name === '小行星带') target = { id:'belt', name:'小行星带' };
        else {
          for (var i = 0; i < PLANETS.length; i++) {
            if (PLANETS[i].name === name) { target = PLANETS[i]; break; }
          }
        }
        if (target) {
          focusOn(target);
          showInfo(target);
          syncTable();
        }
      });
    })(trs[ti]);
  }

  var pointers = {};
  var dragStart = null;
  var pinch = null;

  function updatePinch() {
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (dist < 1) return;
    if (!pinch) {
      var rect = canvas.getBoundingClientRect();
      var midX = (p1.x + p2.x) / 2 - rect.left;
      var midY = (p1.y + p2.y) / 2 - rect.top;
      pinch = {
        dist: dist,
        scale: view.scale,
        midX: midX,
        midY: midY,
        worldX: (midX - cssW / 2) / view.scale + view.cx,
        worldY: (midY - cssH / 2) / view.scale + view.cy
      };
    } else {
      var ratio = dist / pinch.dist;
      var newScale = pinch.scale * ratio;
      newScale = Math.max(baseScale * 0.2, Math.min(baseScale * 200, newScale));
      if (!isFinite(newScale) || newScale <= 0) return;
      view.scale = newScale;
      view.cx = pinch.worldX - (pinch.midX - cssW / 2) / newScale;
      view.cy = pinch.worldY - (pinch.midY - cssH / 2) / newScale;
      if (!isFinite(view.cx)) view.cx = 0;
      if (!isFinite(view.cy)) view.cy = 0;
      targetView.cx = view.cx;
      targetView.cy = view.cy;
      targetView.scale = view.scale;
      autoFit = false;
    }
  }

  canvas.addEventListener('pointerdown', function(e){
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (Object.keys(pointers).length === 1) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left;
      var py = e.clientY - rect.top;
      dragStart = { x: px, y: py, cx: targetView.cx, cy: targetView.cy, moved: false };
    } else if (Object.keys(pointers).length === 2) {
      pinch = null;
      updatePinch();
      dragStart = null;
    }
  });

  canvas.addEventListener('pointermove', function(e){
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (Object.keys(pointers).length >= 2) {
      updatePinch();
      return;
    }

    if (!dragStart) return;
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - dragStart.x;
    var dy = py - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      dragStart.moved = true;
      targetView.cx = dragStart.cx - dx / view.scale;
      targetView.cy = dragStart.cy - dy / view.scale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
      autoFit = false;
      followTarget = null;
    }
  });

  function endPointer(e){
    var wasDrag = dragStart && dragStart.moved;
    if (Object.keys(pointers).length === 1 && !wasDrag && !pinch) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left;
      var py = e.clientY - rect.top;
      var hit = pickTarget(px, py);
      if (hit) {
        focusOn(hit);
        showInfo(hit);
        syncTable();
      } else {
        goBack();
      }
    }

    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = null;
    if (Object.keys(pointers).length === 0) dragStart = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  document.getElementById('speedRange').addEventListener('input', function(e){
    speedVal = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = speedVal.toFixed(2);
  });
  document.getElementById('speedUnit').addEventListener('change', function(e){
    speedUnit = e.target.value;
  });
  document.getElementById('sizeRange').addEventListener('input', function(e){
    sizeMult = parseFloat(e.target.value);
    document.getElementById('sizeVal').textContent = sizeMult.toFixed(1);
  });
  document.getElementById('orbitToggle').addEventListener('change', function(e){ showOrbit = e.target.checked; });
  document.getElementById('labelToggle').addEventListener('change', function(e){ showLabel = e.target.checked; });

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', resetView);

  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;
    if (!isFinite(dt) || dt < 0) dt = 0;

    if (playing) {
      var yearsPerSec = speedVal;
      if (speedUnit === 'day') yearsPerSec = speedVal / 365.25;
      else if (speedUnit === 'century') yearsPerSec = speedVal * 100;
      simYears += dt * yearsPerSec;
    }

    tilt += (targetTilt - tilt) * 0.08;

    updatePlanets();
    updateMoonWorldPositions();

    if (followTarget) {
      var fx, fy;
      if (followTarget.isMoon && followTarget.worldX !== undefined) {
        fx = followTarget.worldX;
        fy = followTarget.worldY;
      } else if (followTarget.x !== undefined) {
        fx = followTarget.x;
        fy = followTarget.y;
      }
      if (isFinite(fx) && isFinite(fy)) {
        targetView.cx = fx;
        targetView.cy = fy;
      }
    }

    if (autoFit) {
      view.cx += (0 - view.cx) * 0.10;
      view.cy += (0 - view.cy) * 0.10;
      view.scale += (baseScale - view.scale) * 0.10;
      targetView.cx = 0; targetView.cy = 0; targetView.scale = baseScale;
    } else {
      view.cx += (targetView.cx - view.cx) * 0.10;
      view.cy += (targetView.cy - view.cy) * 0.10;
      view.scale += (targetView.scale - view.scale) * 0.10;
    }

    if (!isFinite(view.cx)) view.cx = isFinite(targetView.cx) ? targetView.cx : 0;
    if (!isFinite(view.cy)) view.cy = isFinite(targetView.cy) ? targetView.cy : 0;
    if (!isFinite(view.scale) || view.scale <= 0) view.scale = baseScale;
    if (!isFinite(targetView.cx)) targetView.cx = 0;
    if (!isFinite(targetView.cy)) targetView.cy = 0;
    if (!isFinite(targetView.scale) || targetView.scale <= 0) targetView.scale = baseScale;

    draw();

    if (++roCount >= 6) { roCount = 0; updateReadout(); }
  }

  resize();
  view.cx = 0; view.cy = 0; view.scale = baseScale;
  targetView.cx = 0; targetView.cy = 0; targetView.scale = baseScale;
  updatePlanets();
  updateMoonWorldPositions();
  updateReadout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
