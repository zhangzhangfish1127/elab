<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太阳系星际追踪 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  #readout b { color: inherit; }
  .stage canvas { touch-action: none; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>太阳系星际追踪</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>天体</th><th>半长轴 a</th><th>周期 T</th></tr></thead>
    <tbody id="bodyRows">
      <tr data-name="太阳"><td>太阳</td><td>—</td><td>—</td></tr>
      <tr data-name="水星"><td>水星</td><td>0.39 AU</td><td>0.24 年</td></tr>
      <tr data-name="金星"><td>金星</td><td>0.72 AU</td><td>0.62 年</td></tr>
      <tr data-name="地球"><td>地球</td><td>1.00 AU</td><td>1.00 年</td></tr>
      <tr data-name="火星"><td>火星</td><td>1.52 AU</td><td>1.88 年</td></tr>
      <tr data-name="木星"><td>木星</td><td>5.20 AU</td><td>11.86 年</td></tr>
      <tr data-name="土星"><td>土星</td><td>9.54 AU</td><td>29.45 年</td></tr>
      <tr data-name="天王星"><td>天王星</td><td>19.19 AU</td><td>84.02 年</td></tr>
      <tr data-name="海王星"><td>海王星</td><td>30.07 AU</td><td>164.8 年</td></tr>
      <tr data-name="哈雷彗星"><td>哈雷彗星</td><td>17.8 AU</td><td>75.1 年</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>时间流速 = <span id="speedVal">1.0</span> ×
    <input type="range" id="speedRange" min="0" max="20" value="1" step="0.1">
  </label>
  <label>视图缩放 = <span id="zoomVal">1.0</span> ×
    <input type="range" id="zoomRange" min="0.3" max="3" value="1" step="0.05">
  </label>
  <label>天体尺寸 = <span id="sizeVal">1.0</span> ×
    <input type="range" id="sizeRange" min="0.5" max="3" value="1" step="0.1">
  </label>

  <div class="row"><input type="checkbox" id="orbitToggle" checked><label for="orbitToggle" style="margin:0">显示轨道线</label></div>
  <div class="row"><input type="checkbox" id="labelToggle" checked><label for="labelToggle" style="margin:0">显示名称</label></div>

  <button id="playBtn">⏸ 暂停</button>
  <button id="resetBtn" class="secondary">↺ 重置视角</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·

  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  // ---------- 状态 ----------
  var cssW = 800, cssH = 500, dpr = 1;
  var baseScale = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var zoomMult = 1, sizeMult = 1, speedMult = 1;
  var playing = true;
  var simYears = 0;
  var showOrbit = true, showLabel = true;
  var selected = null, followTarget = null;

  // ---------- 工具 ----------
  function withAlpha(c, a) {
    if (!c) return 'rgba(0,0,0,' + a + ')';
    c = String(c).trim();
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      if (h.length >= 6) {
        var n = parseInt(h.slice(0, 6), 16);
        if (isNaN(n)) return c;
        return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
      }
    }
    var m = c.match(/^rgba?\(([^)]+)\)$/i);
    if (m) {
      var p = m[1].split(',');
      if (p.length >= 3) return 'rgba(' + p[0].trim() + ',' + p[1].trim() + ',' + p[2].trim() + ',' + a + ')';
    }
    return c;
  }

  // 径向压缩：只改变视觉半径，不改变角位置与运动规律
  function compR(a) { return Math.pow(a, 0.5) * 10; }

  function w2s(x, y) {
    return [cssW / 2 + (x - view.cx) * view.scale, cssH / 2 + (y - view.cy) * view.scale];
  }

  // ---------- 天体数据（真实轨道参数） ----------
  var SUN = { name: '太阳', x: 0, y: 0, isSun: true };

  var BODIES = [
    { name: '水星',   a: 0.387, T: 0.241, r: 1.3, ck: 'ray1', th0: 0.6, x: 0, y: 0 },
    { name: '金星',   a: 0.723, T: 0.615, r: 1.9, ck: 'ray1', th0: 2.2, x: 0, y: 0 },
    { name: '地球',   a: 1.000, T: 1.000, r: 2.0, ck: 'ray1', th0: 4.1, x: 0, y: 0 },
    { name: '火星',   a: 1.524, T: 1.881, r: 1.6, ck: 'ray1', th0: 1.1, x: 0, y: 0 },
    { name: '木星',   a: 5.203, T: 11.86, r: 4.6, ck: 'ray2', th0: 3.7, x: 0, y: 0 },
    { name: '土星',   a: 9.537, T: 29.45, r: 4.0, ck: 'ray2', th0: 5.5, x: 0, y: 0, ring: true },
    { name: '天王星', a: 19.19, T: 84.02, r: 3.0, ck: 'ray3', th0: 0.9, x: 0, y: 0 },
    { name: '海王星', a: 30.07, T: 164.8, r: 3.0, ck: 'ray3', th0: 2.7, x: 0, y: 0 }
  ];

  var COMET = { name: '哈雷彗星', a: 17.8, e: 0.967, T: 75.1, M0: 1.5, x: 0, y: 0, rReal: 0, theta: 0 };

  // 开普勒方程求解：M = E - e·sinE
  function solveKepler(M, e) {
    M = M % TAU;
    if (M < 0) M += TAU;
    var E = M + e * Math.sin(M);
    for (var i = 0; i < 12; i++) {
      var d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= d;
      if (Math.abs(d) < 1e-7) break;
    }
    return E;
  }

  // 彗星轨道路径（预计算）
  var cometPath = (function(){
    var pts = [], N = 360;
    for (var i = 0; i <= N; i++) {
      var E = i / N * TAU;
      var r = COMET.a * (1 - COMET.e * Math.cos(E));
      var th = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
      var rd = compR(r);
      pts.push([Math.cos(th) * rd, Math.sin(th) * rd]);
    }
    return pts;
  })();

  // 星空背景（归一化坐标）
  var stars = [];
  for (var si = 0; si < 140; si++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: 0.4 + Math.random() * 1.1,
      a: 0.12 + Math.random() * 0.38
    });
  }

  // ---------- 位置更新 ----------
  function updatePositions() {
    for (var i = 0; i < BODIES.length; i++) {
      var b = BODIES[i];
      var th = b.th0 + TAU * simYears / b.T;
      var rd = compR(b.a);
      b.x = Math.cos(th) * rd;
      b.y = Math.sin(th) * rd;
    }
    var M = COMET.M0 + TAU * simYears / COMET.T;
    var E = solveKepler(M, COMET.e);
    var r = COMET.a * (1 - COMET.e * Math.cos(E));
    var theta = Math.atan2(Math.sqrt(1 - COMET.e * COMET.e) * Math.sin(E), Math.cos(E) - COMET.e);
    var rd2 = compR(r);
    COMET.x = Math.cos(theta) * rd2;
    COMET.y = Math.sin(theta) * rd2;
    COMET.rReal = r;
    COMET.theta = theta;
  }

  // ---------- 尺寸 ----------
  function updateBaseScale() {
    var maxR = compR(30.07);
    var half = Math.min(cssW, cssH) / 2;
    baseScale = (half * 0.88) / maxR;
    if (!isFinite(baseScale) || baseScale <= 0) baseScale = 1;
  }
  function updateScale() { view.scale = baseScale * zoomMult; }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateBaseScale();
    updateScale();
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  // ---------- 绘制 ----------
  function drawSphere(sx, sy, R, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    var g1 = ctx.createRadialGradient(sx - R * 0.4, sy - R * 0.4, R * 0.05, sx - R * 0.4, sy - R * 0.4, R * 1.7);
    g1.addColorStop(0, 'rgba(255,255,255,0.55)');
    g1.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();

    var g2 = ctx.createRadialGradient(sx + R * 0.55, sy + R * 0.55, R * 0.1, sx + R * 0.55, sy + R * 0.55, R * 1.9);
    g2.addColorStop(0, 'rgba(0,0,0,0.38)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
  }

  function draw() {
    var TH = App.getTheme();
    var c1 = TH.ray1, c2 = TH.ray2, c3 = TH.ray3;
    var cN = TH.normal, cI = TH.img;
    var CMAP = { ray1: c1, ray2: c2, ray3: c3 };

    ctx.clearRect(0, 0, cssW, cssH);

    // 星空
    ctx.fillStyle = withAlpha(cN, 0.5);
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = st.a;
      ctx.beginPath();
      ctx.arc(st.x * cssW, st.y * cssH, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 轨道
    if (showOrbit) {
      var o = w2s(0, 0);
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      for (var j = 0; j < BODIES.length; j++) {
        ctx.strokeStyle = withAlpha(cN, 0.4);
        ctx.beginPath();
        ctx.arc(o[0], o[1], compR(BODIES[j].a) * view.scale, 0, TAU);
        ctx.stroke();
      }
      // 彗星轨道
      ctx.strokeStyle = withAlpha(c2, 0.45);
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      for (var k = 0; k < cometPath.length; k++) {
        var p = w2s(cometPath[k][0], cometPath[k][1]);
        if (k === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 太阳
    var sp = w2s(0, 0);
    var sunR = 12 * sizeMult;
    var g0 = ctx.createRadialGradient(sp[0], sp[1], sunR * 0.7, sp[0], sp[1], sunR * 4.5);
    g0.addColorStop(0, withAlpha(c3, 0.42));
    g0.addColorStop(0.45, withAlpha(c3, 0.12));
    g0.addColorStop(1, withAlpha(c3, 0));
    ctx.fillStyle = g0;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR * 4.5, 0, TAU); ctx.fill();

    var g1 = ctx.createRadialGradient(sp[0] - sunR * 0.3, sp[1] - sunR * 0.3, 0, sp[0], sp[1], sunR);
    g1.addColorStop(0, 'rgba(255,255,255,0.9)');
    g1.addColorStop(0.45, c3);
    g1.addColorStop(1, c3);
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR, 0, TAU); ctx.fill();

    if (selected === SUN) {
      ctx.strokeStyle = cI; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], sunR + 6, 0, TAU); ctx.stroke();
    }

    // 行星
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n = 0; n < BODIES.length; n++) {
      var b = BODIES[n];
      var s = w2s(b.x, b.y);
      var R = (2.5 + b.r * 1.1) * sizeMult;
      var color = CMAP[b.ck] || cN;

      // 土星环（后）
      if (b.ring) {
        ctx.save();
        ctx.translate(s[0], s[1]);
        ctx.rotate(-0.35);
        ctx.strokeStyle = withAlpha(color, 0.55);
        ctx.lineWidth = Math.max(1.5, R * 0.32);
        ctx.beginPath();
        ctx.ellipse(0, 0, R * 1.95, R * 0.68, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      drawSphere(s[0], s[1], R, color);

      if (selected === b) {
        ctx.strokeStyle = cI; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s[0], s[1], R + 5, 0, TAU); ctx.stroke();
      }

      if (showLabel) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = withAlpha(cN, 0.95);
        ctx.fillText(b.name, s[0], s[1] + R + 13);
      }
    }

    // 彗星
    var cs = w2s(COMET.x, COMET.y);
    var cR = 3 * sizeMult;
    var dir = Math.atan2(COMET.y, COMET.x);
    var tn = Math.max(0, Math.min(1, (COMET.rReal - 0.5) / 20));
    var tailLen = 80 - 55 * tn;
    var tx = cs[0] + Math.cos(dir) * tailLen;
    var ty = cs[1] + Math.sin(dir) * tailLen;
    var g2 = ctx.createLinearGradient(cs[0], cs[1], tx, ty);
    g2.addColorStop(0, withAlpha(c2, 0.75));
    g2.addColorStop(1, withAlpha(c2, 0));
    ctx.strokeStyle = g2;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cs[0], cs[1]);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.lineCap = 'butt';

    drawSphere(cs[0], cs[1], cR, c2);

    if (selected === COMET) {
      ctx.strokeStyle = cI; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cs[0], cs[1], cR + 6, 0, TAU); ctx.stroke();
    }
    if (showLabel) {
      ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = withAlpha(c2, 1);
      ctx.fillText('哈雷彗星', cs[0], cs[1] + cR + 14);
    }

    ctx.textBaseline = 'alphabetic';
  }

  // ---------- 读数 ----------
  var roCount = 0;
  function updateReadout() {
    var el = document.getElementById('readout');
    if (selected === SUN) {
      el.innerHTML = '☀ <b>太阳</b> · 系统中心<br>质量占太阳系 99.86%<br>模拟时间：<b>' + simYears.toFixed(2) + '</b> 年';
      return;
    }
    if (!selected) {
      el.innerHTML = '点击画布天体或下方表格<br>可锁定追踪<br>模拟时间：<b>' + simYears.toFixed(2) + '</b> 年';
      return;
    }
    if (selected === COMET) {
      el.innerHTML = '☄ <b>哈雷彗星</b><br>半长轴：' + COMET.a.toFixed(1) + ' AU<br>偏心率 e：' + COMET.e.toFixed(3) + '<br>近日点：' + (COMET.a * (1 - COMET.e)).toFixed(2) + ' AU<br>远日点：' + (COMET.a * (1 + COMET.e)).toFixed(1) + ' AU<br>周期：' + COMET.T.toFixed(1) + ' 年<br>当前距日：<b>' + COMET.rReal.toFixed(2) + '</b> AU';
      return;
    }
    var b = selected;
    var v = TAU * b.a / b.T;
    el.innerHTML = '🪐 <b>' + b.name + '</b><br>半长轴 a：' + b.a.toFixed(2) + ' AU<br>周期 T：' + b.T.toFixed(2) + ' 年<br>平均速度：' + v.toFixed(2) + ' AU/年<br>模拟时间：<b>' + simYears.toFixed(2) + '</b> 年';
  }

  function syncTable() {
    var rows = document.querySelectorAll('#bodyRows tr');
    var nm = selected ? selected.name : '';
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', rows[i].getAttribute('data-name') === nm);
    }
  }

  // ---------- 点选与拖拽 ----------
  function pickBody(px, py) {
    var best = null, bestD = 30;
    var sp = w2s(0, 0);
    var dSun = Math.sqrt((sp[0] - px) * (sp[0] - px) + (sp[1] - py) * (sp[1] - py));
    if (dSun < bestD && dSun < 12 * sizeMult + 18) { best = SUN; bestD = dSun; }

    var list = BODIES.concat([COMET]);
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var s = w2s(b.x, b.y);
      var d = Math.sqrt((s[0] - px) * (s[0] - px) + (s[1] - py) * (s[1] - py));
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  var activePointer = null;
  var dragStart = null;

  canvas.addEventListener('pointerdown', function(e) {
    if (activePointer !== null) return;
    activePointer = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;

    var hit = pickBody(px, py);
    if (hit) {
      selected = hit;
      followTarget = hit.isSun ? null : hit;
      syncTable();
      updateReadout();
      dragStart = null;
    } else {
      selected = null;
      followTarget = null;
      syncTable();
      updateReadout();
      dragStart = { x: px, y: py, cx: view.cx, cy: view.cy };
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (activePointer === null || e.pointerId !== activePointer || !dragStart) return;
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - dragStart.x;
    var dy = py - dragStart.y;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      view.cx = dragStart.cx - dx / view.scale;
      view.cy = dragStart.cy - dy / view.scale;
    }
  });

  function endPointer(e) {
    if (activePointer === null || e.pointerId !== activePointer) return;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    activePointer = null;
    dragStart = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- 侧栏交互 ----------
  document.getElementById('speedRange').addEventListener('input', function(e) {
    speedMult = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = speedMult.toFixed(1);
  });
  document.getElementById('zoomRange').addEventListener('input', function(e) {
    zoomMult = parseFloat(e.target.value);
    document.getElementById('zoomVal').textContent = zoomMult.toFixed(1);
    updateScale();
  });
  document.getElementById('sizeRange').addEventListener('input', function(e) {
    sizeMult = parseFloat(e.target.value);
    document.getElementById('sizeVal').textContent = sizeMult.toFixed(1);
  });
  document.getElementById('orbitToggle').addEventListener('change', function(e) {
    showOrbit = e.target.checked;
  });
  document.getElementById('labelToggle').addEventListener('change', function(e) {
    showLabel = e.target.checked;
  });

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function() {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    view.cx = 0; view.cy = 0;
    followTarget = null;
    selected = null;
    syncTable();
    updateReadout();
  });

  // 表格点击锁定
  var trs = document.querySelectorAll('#bodyRows tr');
  for (var ti = 0; ti < trs.length; ti++) {
    (function(tr){
      tr.addEventListener('click', function() {
        var name = tr.getAttribute('data-name');
        var target = null;
        if (name === '太阳') target = SUN;
        else if (name === '哈雷彗星') target = COMET;
        else {
          for (var i = 0; i < BODIES.length; i++) {
            if (BODIES[i].name === name) { target = BODIES[i]; break; }
          }
        }
        if (target) {
          selected = target;
          followTarget = target.isSun ? null : target;
          if (target.isSun) { view.cx = 0; view.cy = 0; }
          syncTable();
          updateReadout();
        }
      });
    })(trs[ti]);
  }

  // ---------- 主循环 ----------
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;

    if (playing) {
      simYears += dt * 0.1 * speedMult;
    }

    updatePositions();

    if (followTarget) {
      view.cx += (followTarget.x - view.cx) * 0.1;
      view.cy += (followTarget.y - view.cy) * 0.1;
    }

    draw();

    if (++roCount >= 6) { roCount = 0; updateReadout(); }
  }

  // ---------- 启动 ----------
  resize();
  updatePositions();
  updateReadout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
