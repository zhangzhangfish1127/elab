<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太阳系星际追踪 - 完整版</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
        }
        #canvas-container {
            width: 100vw; height: 100vh;
            touch-action: none; user-select: none; -webkit-user-select: none;
            position: absolute; top: 0; left: 0;
        }
        /* 左上角返回按钮 */
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(30, 41, 59, 0.8); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px; border-radius: 8px;
            text-decoration: none; font-size: 14px;
            backdrop-filter: blur(5px); z-index: 20;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(30, 41, 59, 1); }

        /* 左侧控制面板 */
        .panel {
            position: absolute; top: 20px; left: 120px;
            width: 280px; background: rgba(20, 25, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 15px; color: #fff;
            backdrop-filter: blur(10px); z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .panel h2 { font-size: 16px; margin: 0 0 15px 0; text-align: center; color: #60a5fa; }
        .control-item {
            margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; font-size: 13px; color: #cbd5e1;
        }
        .control-item input[type="range"] { width: 130px; }
        
        /* 按钮组 */
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        button, .btn {
            padding: 8px 12px; background: #3b82f6; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 13px; transition: background 0.2s;
            flex: 1; text-align: center;
        }
        button:hover { background: #2563eb; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        
        /* 操作提示 */
        .hint {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; color: rgba(255,255,255,0.4);
            font-size: 13px; pointer-events: none; z-index: 10;
        }
    </style>
    <!-- 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <a href="https://www.yuanstudy.com/pages/8/" target="_blank" class="back-btn">← 返回主页</a>

    <div class="panel">
        <h2>太阳系星际追踪</h2>
        
        <div class="control-item">
            <span>动画控制</span>
            <button id="btn-play" style="flex: 0 0 80px; padding: 4px;">暂停</button>
        </div>
        
        <div class="control-item">
            <label>显示轨道线</label>
            <input type="checkbox" id="toggle-orbit" checked>
        </div>
        
        <div class="control-item">
            <label>距离比例</label>
            <input type="range" id="slider-dist" min="10" max="150" value="40">
        </div>
        
        <div class="control-item">
            <label>天体大小</label>
            <input type="range" id="slider-size" min="0.5" max="5" step="0.1" value="1">
        </div>
        
        <div class="control-item">
            <label>动画速度</label>
            <input type="range" id="slider-speed" min="0" max="5" step="0.1" value="1">
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" id="btn-fit-dist">适应距离</button>
            <button class="btn btn-secondary" id="btn-fit-size">适应大小</button>
            <button class="btn btn-secondary" id="btn-reset">回正视角</button>
        </div>
        <div class="btn-group">
            <button class="btn" id="btn-real-scale">🎯 真实大小比例</button>
        </div>
    </div>

    <div class="hint">拖动平移 · 双指缩放 · 点击星体锁定视角</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ================= 1. 基础场景初始化 =================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 保护 iPad 屏幕
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 60, 150);

        // ================= 2. 防白屏 & 触摸锁定 =================
        const canvas = renderer.domElement;
        canvas.style.touchAction = 'none';
        canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); }, false);
        const blockTouch = (e) => { if(e.cancelable) e.preventDefault(); };
        canvas.addEventListener('touchstart', blockTouch, { passive: false });
        canvas.addEventListener('touchmove', blockTouch, { passive: false });

        // ================= 3. 控制器 =================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 1500;

        // ================= 4. 动态纹理生成 (让星体有细节) =================
        function createPlanetTexture(type) {
            const cvs = document.createElement('canvas');
            cvs.width = 256; cvs.height = 256;
            const ctx = cvs.getContext('2d');
            
            if (type === 'earth') {
                ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, 256, 256); // 海洋
                ctx.fillStyle = '#22c55e'; // 陆地
                ctx.beginPath(); ctx.arc(80, 100, 40, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(180, 150, 50, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(120, 220, 30, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'jupiter') {
                for(let i=0; i<10; i++) {
                    ctx.fillStyle = i % 2 === 0 ? '#d4a373' : '#faedcd';
                    ctx.fillRect(0, i * 25, 256, 25);
                }
            } else if (type === 'mars') {
                ctx.fillStyle = '#9a3412'; ctx.fillRect(0, 0, 256, 256);
                ctx.fillStyle = '#7c2d12';
                for(let i=0; i<50; i++) {
                    ctx.beginPath(); ctx.arc(Math.random()*256, Math.random()*256, Math.random()*10, 0, Math.PI*2); ctx.fill();
                }
            } else {
                ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                ctx.fillRect(0, 0, 256, 256);
            }
            return new THREE.CanvasTexture(cvs);
        }

        // ================= 5. 天体数据与创建 =================
        // 基础数据（非真实比例，为了好看）
        const planetsData = [
            { name: '水星', type: 'mercury', size: 0.8, distance: 15, speed: 4.1, color: 0xaaaaaa },
            { name: '金星', type: 'venus', size: 1.2, distance: 22, speed: 1.6, color: 0xffcc00 },
            { name: '地球', type: 'earth', size: 1.3, distance: 32, speed: 1.0, color: 0x2288ff },
            { name: '火星', type: 'mars', size: 1.0, distance: 42, speed: 0.5, color: 0xff4400 },
            { name: '木星', type: 'jupiter', size: 3.5, distance: 60, speed: 0.08, color: 0xffaa88 },
            { name: '土星', type: 'saturn', size: 3.0, distance: 80, speed: 0.03, color: 0xeeddbb, hasRing: true },
            { name: '天王星', type: 'uranus', size: 2.0, distance: 100, speed: 0.01, color: 0x88ddff },
            { name: '海王星', type: 'neptune', size: 2.0, distance: 120, speed: 0.006, color: 0x4444ff }
        ];

        const planets = []; // 用于射线检测和动画
        const orbits = [];  // 轨道线组

        // 太阳 (中心)
        const sunGeo = new THREE.SphereGeometry(6, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // 创建行星
        planetsData.forEach(data => {
            const geo = new THREE.SphereGeometry(data.size, 32, 32);
            const texture = createPlanetTexture(data.type);
            const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { isPlanet: true, name: data.name, baseSize: data.size }; // 挂载数据用于点击检测
            scene.add(mesh);

            // 土星环
            if (data.hasRing) {
                const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2.2, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xccbbaa, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                mesh.add(ring);
            }

            // 轨道线
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const angle = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance));
            }
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
            scene.add(orbitLine);
            orbits.push(orbitLine);

            planets.push({ mesh, data, angle: Math.random() * Math.PI * 2 });
        });

        // 添加哈雷彗星
        const cometGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const cometMat = new THREE.MeshBasicMaterial({ color: 0x88ccff });
        const comet = new THREE.Mesh(cometGeo, cometMat);
        comet.userData = { isPlanet: true, name: '哈雷彗星', baseSize: 0.5 };
        scene.add(comet);
        
        const cometPath = [];
        for(let i=0; i<=360; i++) {
            const a = i * Math.PI / 180;
            const r = 100 / (1 + 0.85 * Math.cos(a));
            cometPath.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
        }
        const cometOrbit = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(cometPath), new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.2 }));
        scene.add(cometOrbit);
        orbits.push(cometOrbit);
        let cometAngle = 0;

        // ================= 6. 点击锁定追踪逻辑 (Raycaster) =================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lockedTarget = null; // 当前锁定的星体

        // 监听点击 (兼容触摸)
        canvas.addEventListener('pointerdown', (e) => {
            // 如果正在拖拽平移，不触发点击
            if (e.button !== 0) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([sun, comet, ...planets.map(p => p.mesh)]);

            if (intersects.length > 0) {
                lockedTarget = intersects[0].object;
                // 瞬间将焦点转移，平滑过渡在动画循环中做
            } else {
                lockedTarget = null; // 点击空白取消锁定
            }
        });

        // ================= 7. UI 交互逻辑 =================
        let isPlaying = true;
        let speedMult = 1;
        let distMult = 1;
        let sizeMult = 1;

        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.textContent = isPlaying ? '暂停' : '播放';
            btnPlay.style.background = isPlaying ? '#3b82f6' : '#ef4444';
        });

        document.getElementById('toggle-orbit').addEventListener('change', (e) => {
            orbits.forEach(o => o.visible = e.target.checked);
        });

        document.getElementById('slider-dist').addEventListener('input', (e) => {
            distMult = e.target.value / 40;
        });

        document.getElementById('slider-size').addEventListener('input', (e) => {
            sizeMult = parseFloat(e.target.value);
            planets.forEach(p => p.mesh.scale.setScalar(sizeMult));
            comet.scale.setScalar(sizeMult);
        });

        document.getElementById('slider-speed').addEventListener('input', (e) => {
            speedMult = parseFloat(e.target.value);
        });

        // 快捷按钮
        document.getElementById('btn-reset').addEventListener('click', () => {
            lockedTarget = null;
            controls.target.set(0, 0, 0);
            camera.position.set(0, 60, 150);
            controls.update();
        });

        document.getElementById('btn-fit-dist').addEventListener('click', () => {
            camera.position.set(0, 150, 400);
        });

        document.getElementById('btn-fit-size').addEventListener('click', () => {
            document.getElementById('slider-size').value = 2;
            document.getElementById('slider-size').dispatchEvent(new Event('input'));
        });

        document.getElementById('btn-real-scale').addEventListener('click', () => {
            // 模拟“真实大小比例”，把行星缩成小点，拉开距离
            lockedTarget = null;
            document.getElementById('slider-size').value = 0.2;
            document.getElementById('slider-size').dispatchEvent(new Event('input'));
            document.getElementById('slider-dist').value = 100;
            document.getElementById('slider-dist').dispatchEvent(new Event('input'));
            camera.position.set(0, 200, 500);
        });

        // ================= 8. 动画循环 =================
        const clock = new THREE.Clock();
        const targetPos = new THREE.Vector3(); // 用于平滑移动

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // 公转和自转
            if (isPlaying) {
                sun.rotation.y += 0.001 * speedMult;
                
                planets.forEach(p => {
                    p.angle += delta * p.data.speed * 0.5 * speedMult;
                    const curDist = p.data.distance * distMult;
                    p.mesh.position.set(Math.cos(p.angle) * curDist, 0, Math.sin(p.angle) * curDist);
                    p.mesh.rotation.y += 0.01 * speedMult;
                });

                cometAngle += delta * 0.8 * speedMult;
                const r = 100 / (1 + 0.85 * Math.cos(cometAngle));
                comet.position.set(Math.cos(cometAngle) * r * distMult, 0, Math.sin(cometAngle) * r * distMult);
            }

            // 镜头锁定逻辑
            if (lockedTarget) {
                // 把控制器的目标点平滑移动到锁定星体的位置
                targetPos.copy(lockedTarget.position);
                controls.target.lerp(targetPos, 0.1);
                
                // 如果摄像机离星体太远，轻轻拉近一点
                const dist = camera.position.distanceTo(lockedTarget.position);
                if (dist > 50) {
                    const dir = new THREE.Vector3().subVectors(camera.position, lockedTarget.position).normalize();
                    camera.position.lerp(lockedTarget.position.clone().add(dir.multiplyScalar(20)), 0.05);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
