<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平抛运动 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>平抛运动</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table">
    <thead><tr><th>方向</th><th>运动</th></tr></thead>
    <tbody>
      <tr class="active"><td>水平方向</td><td>匀速直线（v₀）</td></tr>
      <tr class="active"><td>竖直方向</td><td>自由落体（g）</td></tr>
      <tr class="active"><td>合运动</td><td>平抛抛物线</td></tr>
      <tr class="active"><td>下落时间</td><td>t = √(2h/g)</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>
  <label>初速度 v₀ = <span id="v0Val">8.0</span> m/s
    <input type="range" id="v0Range" min="2" max="20" value="8" step="0.5">
  </label>
  <label>抛出高度 h = <span id="hVal">20.0</span> m
    <input type="range" id="hRange" min="5" max="50" value="20" step="0.5">
  </label>
  <label>重力加速度 g = <span id="gVal">9.8</span> m/s²
    <input type="range" id="gRange" min="1.6" max="15" value="9.8" step="0.1">
  </label>

  <div class="row">
    <input type="checkbox" id="showSplit" checked>
    <label for="showSplit" style="margin:0">显示分解运动</label>
  </div>

  <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">
  <div style="font-size:13px;color:#666;margin-bottom:8px">播放模式</div>
  <label>速度 = <span id="speedVal">1.0</span>×
    <input type="range" id="speedRange" min="0.1" max="3" value="1" step="0.1">
  </label>
  <button id="playBtn">▶ 播放</button>
  <button id="resetBtn" class="secondary">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="hint">看小球水平匀速 + 竖直自由落体的合成轨迹</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·
  <a href="../feedback.html">反馈</a> ·
  <a href="../support.html">支持我们</a>
</div>

<script src="../shared/common.js"></script>
<script src="../shared/optics.js"></script>
<script>
(function(){
  App.injectTopbar();
  var canvas = document.getElementById('cv');
  var opt = new OpticsCanvas(canvas, { scale: 1 });

  var v0 = 8, h = 20, g = 9.8;
  var t = 0;
  var playing = false, rafId = null;

  function tFall() { return Math.sqrt(2 * h / g); }

  function state(tt) {
    var tf = tFall();
    var tt2 = Math.min(tt, tf);
    return {
      x: v0 * tt2,
      y: h - 0.5 * g * tt2 * tt2,
      vx: v0,
      vy: g * tt2,
      tf: tf,
      done: tt >= tf
    };
  }

  function draw() {
    var ctx = opt.ctx;
    var W = opt.W, H = opt.H;
    opt.clear();

    var s = state(t);
    var totalX = v0 * s.tf;
    var marginX = 60, marginY = 60;
    var sceneW = W - marginX - 40;
    var sceneH = H - marginY - 60;
    var ppmX = sceneW / totalX;
    var ppmY = sceneH / h;
    var ppm = Math.min(ppmX, ppmY);
    // 用统一比例，使抛物线看起来不失真
    var groundY = H - marginY;
    var originX = marginX;

    // 地面
    ctx.save();
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.restore();

    // 抛出台
    ctx.save();
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(originX - 20, groundY - h * ppm, 20, h * ppm);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(originX - 22, groundY - h * ppm - 4, 24, 6);
    ctx.restore();

    // 轨迹
    ctx.save();
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    for (var i = 0; i <= 100; i++) {
      var ti = s.tf * i / 100;
      var si = state(ti);
      var px = originX + si.x * ppm;
      var py = groundY - si.y * ppm;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // 落地位置标记
    ctx.save();
    ctx.strokeStyle = '#f39c12';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(originX + totalX * ppm, groundY - 100);
    ctx.lineTo(originX + totalX * ppm, groundY);
    ctx.stroke();
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('落点', originX + totalX * ppm, groundY - 106);
    ctx.restore();

    // 分解运动
    if (document.getElementById('showSplit').checked) {
      var curPx = originX + s.x * ppm;
      var curPy = groundY - s.y * ppm;
      // 水平投影（在地面）
      ctx.save();
      ctx.fillStyle = 'rgba(52,152,219,0.6)';
      ctx.beginPath();
      ctx.arc(curPx, groundY - 5, 6, 0, Math.PI * 2);
      ctx.fill();
      // 竖直投影（在左侧）
      ctx.fillStyle = 'rgba(155,89,182,0.6)';
      ctx.beginPath();
      ctx.arc(originX - 10, curPy, 6, 0, Math.PI * 2);
      ctx.fill();
      // 虚线连到小球
      ctx.strokeStyle = 'rgba(52,152,219,0.5)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(curPx, curPy);
      ctx.lineTo(curPx, groundY - 5);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(155,89,182,0.5)';
      ctx.beginPath();
      ctx.moveTo(curPx, curPy);
      ctx.lineTo(originX - 10, curPy);
      ctx.stroke();
      ctx.restore();

      // 标注
      ctx.save();
      ctx.fillStyle = '#3498db';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('水平匀速', curPx, groundY + 16);
      ctx.save();
      ctx.translate(originX - 30, curPy);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#8e44ad';
      ctx.textAlign = 'center';
      ctx.fillText('竖直自由落体', 0, 0);
      ctx.restore();
      ctx.restore();
    }

    // 小球
    var ballPx = originX + s.x * ppm;
    var ballPy = groundY - s.y * ppm;
    ctx.save();
    var grad = ctx.createRadialGradient(ballPx - 4, ballPy - 4, 2, ballPx, ballPy, 14);
    grad.addColorStop(0, '#f39c12');
    grad.addColorStop(1, '#c0392b');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ballPx, ballPy, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 速度矢量
    if (!s.done) {
      var scaleV = 4;
      var vEndX = ballPx + s.vx * scaleV;
      var vEndY = ballPy + s.vy * scaleV;
      ctx.save();
      // 合速度
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(ballPx, ballPy);
      ctx.lineTo(vEndX, vEndY);
      ctx.stroke();
      // 分量
      ctx.strokeStyle = 'rgba(52,152,219,0.7)';
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ballPx, ballPy);
      ctx.lineTo(vEndX, ballPy);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(155,89,182,0.7)';
      ctx.beginPath();
      ctx.moveTo(ballPx, ballPy);
      ctx.lineTo(ballPx, vEndY);
      ctx.stroke();
      ctx.restore();
    }

    // 侧栏
    document.getElementById('v0Val').textContent = v0.toFixed(1);
    document.getElementById('hVal').textContent = h.toFixed(1);
    document.getElementById('gVal').textContent = g.toFixed(1);
    document.getElementById('v0Range').value = v0;
    document.getElementById('hRange').value = h;
    document.getElementById('gRange').value = g;

    var vTotal = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    document.getElementById('readout').innerHTML =
      't = <b>' + Math.min(t, s.tf).toFixed(2) + '</b> s<br>' +
      '水平位移 x = <b>' + s.x.toFixed(2) + '</b> m<br>' +
      '竖直高度 y = <b>' + s.y.toFixed(2) + '</b> m<br>' +
      '水平速度 vₓ = <b>' + s.vx.toFixed(2) + '</b> m/s（恒定）<br>' +
      '竖直速度 v_y = <b>' + s.vy.toFixed(2) + '</b> m/s<br>' +
      '合速度 v = <b>' + vTotal.toFixed(2) + '</b> m/s<br>' +
      '下落时间 t = √(2h/g) = <b>' + s.tf.toFixed(2) + '</b> s<br>' +
      '水平射程 x = <b>' + totalX.toFixed(2) + '</b> m';
  }

  document.getElementById('v0Range').addEventListener('input', function(e){ v0 = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('hRange').addEventListener('input', function(e){ h = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('gRange').addEventListener('input', function(e){ g = parseFloat(e.target.value); t = 0; draw(); });
  document.getElementById('showSplit').addEventListener('change', draw);
  document.getElementById('speedRange').addEventListener('input', function(e){
    document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
  });
  document.getElementById('resetBtn').addEventListener('click', function(){ t = 0; stopPlay(); draw(); });

  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    document.getElementById('playBtn').textContent = '▶ 播放';
  }

  function tick() {
    if (!playing) return;
    var spd = parseFloat(document.getElementById('speedRange').value);
    t += 0.02 * spd;
    draw();
    if (t > tFall() + 0.3) { stopPlay(); return; }
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').addEventListener('click', function(){
    if (playing) stopPlay();
    else {
      if (t >= tFall()) t = 0;
      playing = true;
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      rafId = requestAnimationFrame(tick);
    }
  });

  window.addEventListener('themechange', draw);
  window.addEventListener('resize', function(){ opt._initHiDPI(); draw(); });
  draw();
})();
</script>
</body>
</html>
